            const COUNTRY_NAME_MAPPING = {

                'South Korea': '南韓', 'Korea': '南韓', 'KR': '南韓',
                'United States': '美國', 'US': '美國', 'USA': '美國',
                'Australia': '澳大利亞', 'AU': '澳大利亞',
                'United Kingdom': '英國', 'GB': '英國', 'UK': '英國',
                'Thailand': '泰國', 'TH': '泰國',
                'China': '中國', 'CN': '中國',
                'Hong Kong': '香港', 'HK': '香港'

            function resolveCountryInfo(countryInput) {
                const clean = (countryInput || '').trim().toLowerCase();
                if (clean.includes('台') || clean.includes('tw') || clean.includes('taiwan')) return { code: 'TW', name: '台灣', lat: 25.033, lng: 121.565 };
                if (clean.includes('日') || clean.includes('jp') || clean.includes('japan')) return { code: 'JP', name: '日本', lat: 35.676, lng: 139.650 };
                if (clean.includes('韓') || clean.includes('kr') || clean.includes('korea')) return { code: 'KR', name: '南韓', lat: 37.566, lng: 126.978 };
                if (clean.includes('美') || clean.includes('us') || clean.includes('america')) return { code: 'US', name: '美國', lat: 40.712, lng: -74.006 };
                return { code: 'OTHER', name: countryInput || '台灣', lat: 25.033, lng: 121.565 };
            }

            function parseSpotifyEmbedUrl(urlOrUri) {
                if (!urlOrUri) return null;
                let raw = urlOrUri.trim();
                if (raw.startsWith('spotify:')) {
                    const parts = raw.split(':');
                    if (parts.length >= 3) return `https://open.spotify.com/embed/${parts[1]}/${parts[2]}?utm_source=generator&theme=0`;
                }
                if (raw.includes('open.spotify.com')) {
                    try {
                        const urlObj = new URL(raw);
                        const pathSegments = urlObj.pathname.split('/').filter(Boolean);
                        if (pathSegments.length >= 2) return `https://open.spotify.com/embed/${pathSegments[0]}/${pathSegments[1]}?utm_source=generator&theme=0`;
                    } catch (e) {}
                }
                return null;
            }

            function compressImageFile(fileOrUrl, maxWidth = 1600, maxHeight = 1600, quality = 0.92) {
                return new Promise((resolve) => {
                    if (!fileOrUrl) {
                        resolve('https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=1200&q=90');
                        return;
                    }
                    if (typeof fileOrUrl === 'string' && (fileOrUrl.startsWith('http') || fileOrUrl.length < 400)) {
                        resolve(fileOrUrl);
                        return;
                    }
                    const img = new Image();
                    img.onload = () => {
                        let width = img.width, height = img.height;
                        if (width > height) {
                            if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
                        } else {
                            if (height > maxHeight) { width = Math.round((height * maxHeight) / height); height = maxHeight; }
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.imageSmoothingEnabled = true;
                        ctx.imageSmoothingQuality = 'high';
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.onerror = () => resolve('');
                    if (typeof fileOrUrl === 'string') img.src = fileOrUrl;
                    else if (fileOrUrl instanceof File || fileOrUrl instanceof Blob) {
                        const reader = new FileReader();
                        reader.onload = (e) => { img.src = e.target.result; };
                        reader.readAsDataURL(fileOrUrl);
                    } else resolve('');
                });
            }

            function TouchImageTransform({ src, initialTransform, onChange, className = "w-full h-full object-contain" }) {
                const [transform, setTransform] = useState(() => initialTransform || { scale: 1, x: 0, y: 0 });
                const isDragging = useRef(false);
                const dragStart = useRef({ x: 0, y: 0 });
                const pinchStartDist = useRef(null);
                const pinchStartScale = useRef(1);

                const handleTouchStart = (e) => {
                    if (e.touches.length === 1) {
                        isDragging.current = true;
                        dragStart.current = { x: e.touches[0].clientX - transform.x, y: e.touches[0].clientY - transform.y };
                    } else if (e.touches.length === 2) {
                        isDragging.current = false;
                        pinchStartDist.current = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                        pinchStartScale.current = transform.scale;
                    }
                };

                const handleTouchMove = (e) => {
                    if (e.touches.length === 1 && isDragging.current) {
                        const updated = { ...transform, x: e.touches[0].clientX - dragStart.current.x, y: e.touches[0].clientY - dragStart.current.y };
                        setTransform(updated);
                        if (onChange) onChange(updated);
                    } else if (e.touches.length === 2 && pinchStartDist.current) {
                        const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                        const updated = { ...transform, scale: Math.min(Math.max(0.2, pinchStartScale.current * (dist / pinchStartDist.current)), 4) };
                        setTransform(updated);
                        if (onChange) onChange(updated);
                    }
                };

                const handleTouchEnd = () => { isDragging.current = false; pinchStartDist.current = null; };

                return (
                    <div className="overflow-hidden relative select-none w-full h-full cursor-grab active:cursor-grabbing flex items-center justify-center bg-[#EBEBE9]"
                        onTouchStart={handleTouchStart} onTouchMove={handleTouchMove} onTouchEnd={handleTouchEnd}
                        onMouseDown={(e) => { isDragging.current = true; dragStart.current = { x: e.clientX - transform.x, y: e.clientY - transform.y }; }}
                        onMouseMove={(e) => { if (!isDragging.current) return; const updated = { ...transform, x: e.clientX - dragStart.current.x, y: e.clientY - transform.y }; setTransform(updated); if (onChange) onChange(updated); }}
                        onMouseUp={() => { isDragging.current = false; }} onMouseLeave={() => { isDragging.current = false; }}>
                        <img src={src} alt="Preview" className={className}
                            style={{ transform: `translate(${transform.x}px, ${transform.y}px) scale(${transform.scale})`, transition: isDragging.current ? 'none' : 'transform 0.1s ease-out', maxWidth: '100%', maxHeight: '100%', objectFit: 'contain' }}
                            draggable={false} />
                    </div>
                );
            }

            function App() {
                const [events, setEvents] = useState(() => {
                    try {
                        const saved = localStorage.getItem('liveecho_records_palette_v12');
                        return saved ? JSON.parse(saved) : [];
                    } catch (e) { return []; }

                    try {

                const [activeTab, setActiveTab] = useState('archive');

                const [searchQuery, setSearchQuery] = useState('');

                }, [events]);

                useEffect(() => { localStorage.setItem('liveecho_user_profile_v12', JSON.stringify(userProfile)); }, [userProfile]);
                
                useEffect(() => { 
                    if (window.lucide) {
                        try { window.lucide.createIcons(); } catch (e) {}
                    }
                });

                const showAlert = (msg) => { setAlertMsg(msg); setTimeout(() => setAlertMsg(null), 3000); };

                const filteredEvents = useMemo(() => {
                    return events.filter(evt => {
                        const matchCategory = selectedCategory === 'all' || evt.type === selectedCategory;
                        const q = (searchQuery || '').toLowerCase().trim();
                        const matchSearch = (evt.title || '').toLowerCase().includes(q) || 
                                            (evt.venue || '').toLowerCase().includes(q) || 
                                            (evt.artist || '').toLowerCase().includes(q);
                        return matchCategory && matchSearch;
                    }).sort((a, b) => new Date(b.date) - new Date(a.date));
                }, [events, selectedCategory, searchQuery]);

                const stats = useMemo(() => {
                    const attended = events.filter(e => e.status === 'attended' || !e.status);
                    const totalCost = events.reduce((sum, e) => sum + (Number(e.cost) || 0), 0);
                    const categoryCounts = {
                        concert: events.filter(e => e.type === 'concert').length,
                        exhibition: events.filter(e => e.type === 'exhibition').length,
                        movie: events.filter(e => e.type === 'movie').length,
                        book: events.filter(e => e.type === 'book').length,
                        drama: events.filter(e => e.type === 'drama').length,
                    };
                    const uniqueArtistsCount = new Set(events.map(e => e.artist).filter(Boolean)).size;
                    return {
                        totalEvents: events.length, attendedCount: attended.length, totalCost,
                        uniqueVenuesCount: new Set(attended.map(e => e.venue).filter(Boolean)).size,
                        uniqueCountriesCount: new Set(attended.map(e => e.countryName || '台灣').filter(Boolean)).size,
                        uniqueArtistsCount,
                        categoryCounts
                    };
                }, [events]);

                                        <h2 className="text-white font-black text-base leading-snug">{event.title}</h2>
                                    </div>
                                </div>
                            </div>
                            <div className="p-4 space-y-3 overflow-y-auto flex-1 text-xs">
                                {event.artist && <div className="bg-white p-3 rounded-2xl border border-[#D2CABF]"><span className="text-[10px] text-[#737C75] font-bold block">演出藝人</span><p className="font-bold">{event.artist}</p></div>}
                                <div className="grid grid-cols-2 gap-2 bg-white p-3 rounded-2xl border border-[#D2CABF]">
                                    <div><span className="text-[10px] text-[#737C75] font-bold block">演出日期</span><span className="font-mono font-bold">{event.date}</span></div>
                                    <div><span className="text-[10px] text-[#737C75] font-bold block">票價花費</span><span className="font-mono font-bold">NT$ {Number(event.cost || 0).toLocaleString()}</span></div>
                                </div>
                                {event.detailSeat && <div className="bg-white p-3 rounded-2xl border border-[#D2CABF]"><span className="text-[10px] text-[#737C75] font-bold block">座位/票區資訊</span><p className="font-bold">{event.detailSeat}</p></div>}
                                <div className="bg-white p-3 rounded-2xl border border-[#D2CABF]"><span className="text-[10px] text-[#737C75] font-bold block">舉辦場館與國家 ({event.countryName || '台灣'})</span><p className="font-bold text-sm">{event.venue}</p><p className="text-[11px] text-[#737C75]">{event.venueAddress}</p></div>
                                {spotifyEmbed && <div className="bg-white p-2 rounded-2xl border border-[#D2CABF]"><span className="text-[10px] text-[#737C75] font-bold block px-1">🎵 Spotify 音樂預覽</span><iframe src={spotifyEmbed} width="100%" height="80" frameBorder="0" allowtransparency="true" allow="encrypted-media" className="rounded-xl"></iframe></div>}
                                {event.notes && <div className="bg-white p-3 rounded-2xl border border-[#D2CABF]"><span className="text-[10px] text-[#737C75] font-bold block">心得筆記</span><p className="leading-relaxed">{event.notes}</p></div>}
                            </div>
                            <div className="p-3 bg-[#EBEBE9] border-t border-[#D2CABF] flex gap-2">
                                <button onClick={() => { onEdit(event); onClose(); }} className="flex-1 py-2.5 rounded-xl bg-[#C5AB89] text-[#161D15] font-bold text-xs flex items-center justify-center gap-1.5 shadow"><i data-lucide="pencil" className="w-4 h-4"></i> 編輯紀錄</button>
                                <button onClick={() => { onDelete(event.id); onClose(); }} className="py-2.5 px-3 rounded-xl bg-red-600 text-white font-bold text-xs flex items-center justify-center shadow" title="刪除紀錄"><i data-lucide="trash-2" className="w-4 h-4 text-white"></i></button>
                                <button onClick={onClose} className="flex-1 py-2.5 rounded-xl bg-[#161D15] text-[#EFF0EA] font-bold text-xs">關閉</button>
                            </div>
                        </div>
                    </div>
                );
            }

            function LeafletMapSection({ events, stats, getGoogleMapsUrl }) {
                const mapRef = useRef(null);
                const mapInst = useRef(null);
                const markersLayerRef = useRef(L.layerGroup());
                const activeLayerRef = useRef(null);
                const geoJsonLayerRef = useRef(null);
                const [selectedCountry, setSelectedCountry] = useState(null);
                const [selectedEventModal, setSelectedEventModal] = useState(null);

                const countryMap = useMemo(() => {
                    const m = {};
                    events.forEach(e => {
                        if (e.status === 'wishlist') return;
                        const c = e.countryName || '台灣';
                        if (!m[c]) m[c] = { name: c, events: [], venues: new Set() };
                        m[c].events.push(e);
                        if (e.venue) m[c].venues.add(e.venue);
                    });
                    return m;
                }, [events]);

                const visited = useMemo(() => Object.keys(countryMap), [countryMap]);

                useEffect(() => {
                    if (!mapRef.current) return;
                    if (!mapInst.current) {
                        const southWest = L.latLng(-85, -180);
                        const northEast = L.latLng(85, 180);
                        const bounds = L.latLngBounds(southWest, northEast);

                        const map = L.map(mapRef.current, { 
                            zoomControl: false, 
                            attributionControl: false, 
                            minZoom: 2,
                            maxBounds: bounds,
                            maxBoundsViscosity: 1.0
                        }).setView([25.033, 121.565], 3);

                        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { 
                            maxZoom: 19, 
                            noWrap: true,
                            bounds: bounds
                        }).addTo(map);

                        markersLayerRef.current.addTo(map);
                        mapInst.current = map;

                        fetch('https://raw.githubusercontent.com/datasets/geo-boundaries-world-110m/master/countries.geojson')
                            .then(res => res.json())
                            .then(data => {
                                const layer = L.geoJSON(data, {
                                    style: (feature) => {
                                        const p = feature.properties || {};
                                        const name = COUNTRY_NAME_MAPPING[p.name || p.ADMIN] || p.name || '';
                                        const isV = visited.some(v => name.includes(v));
                                        return { fillColor: isV ? '#C2A175' : '#1A2218', fillOpacity: isV ? 0.45 : 0.2, color: isV ? '#C5AB89' : '#2A3626', weight: isV ? 1.5 : 0.8 };
                                    },
                                    onEachFeature: (feature, layer) => {
                                        const p = feature.properties || {};
                                        const zh = COUNTRY_NAME_MAPPING[p.name || p.ADMIN] || p.name || '區域';
                                        layer.on({
                                            click: (e) => {
                                                L.DomEvent.stopPropagation(e);
                                                if (activeLayerRef.current && geoJsonLayerRef.current) {
                                                    geoJsonLayerRef.current.resetStyle(activeLayerRef.current);
                                                }
                                                activeLayerRef.current = e.target;
                                                e.target.setStyle({ fillColor: '#FFC800', fillOpacity: 0.75, color: '#FFFFFF', weight: 2.5 });
                                                const match = visited.find(v => zh.includes(v));
                                                setSelectedCountry(match ? countryMap[match] : { name: zh, events: [], venues: new Set() });
                                            }
                                        });
                                    }
                                }).addTo(map);
                                geoJsonLayerRef.current = layer;
                            }).catch(() => {});
                    }

                    const timer = requestAnimationFrame(() => {
                        if (mapInst.current) mapInst.current.invalidateSize();
                    });

                    return () => { 
                        cancelAnimationFrame(timer);
                    };
                }, []);

                useEffect(() => {
                    if (!mapInst.current) return;
                    markersLayerRef.current.clearLayers();

                    events.forEach((evt, idx) => {
                        const latVal = parseFloat(evt.lat);
                        const lngVal = parseFloat(evt.lng);

                        if (isNaN(latVal) || isNaN(lngVal)) return;

                        const marker = L.marker([latVal, lngVal], {
                            icon: L.divIcon({ 
                                className: 'custom-div-icon', 
                                html: `<div class="custom-numeric-marker w-7 h-7 flex items-center justify-center">${idx + 1}</div>`, 
                                iconSize: [28, 28], 
                                iconAnchor: [14, 14] 
                            })
                        });
                        
                        marker.on('click', () => setSelectedEventModal(evt));
                        markersLayerRef.current.addLayer(marker);
                    });
                }, [events]);

                const handleCloseCountryModal = () => {
                    if (activeLayerRef.current && geoJsonLayerRef.current) {
                        geoJsonLayerRef.current.resetStyle(activeLayerRef.current);
                        activeLayerRef.current = null;
                    }
                    setSelectedCountry(null);
                };

                return (
                    <div id="map-wrapper" className="relative flex-1 w-full flex flex-col bg-[#000000] overflow-hidden">
                        <div className="absolute top-3 left-4 right-4 z-[999] flex items-center justify-between pointer-events-none top-stats-card">
                            <div className="ios-glass px-3 py-1.5 rounded-full shadow-xl border border-[#737C75]/30 pointer-events-auto flex items-center gap-2">
                                <span className="text-[10px] font-bold text-[#C5AB89]">🌍 星跡Map</span>
                                <span className="text-[10px] font-mono"><strong className="text-[#C5AB89]">{stats.uniqueCountriesCount}</strong> 國 · <strong className="text-[#C5AB89]">{stats.attendedCount}</strong> 場</span>
                            </div>
                        </div>
                        <div ref={mapRef} id="map" className="w-full h-full flex-1"></div>
                        
                        {selectedCountry && (
                            <div className="absolute bottom-4 left-4 right-4 z-[1000]">
                                <div className="bg-[#EFF0EA] text-[#161D15] rounded-3xl p-4 shadow-2xl border-2 border-[#C5AB89] space-y-3 relative">
                                    <button onClick={handleCloseCountryModal} className="absolute top-4 right-4 text-[#737C75] hover:text-[#161D15]"><i data-lucide="x" className="w-5 h-5"></i></button>
                                    <div className="flex items-center gap-2">
                                        <CompassStarIcon className="w-6 h-6 shrink-0" />
                                        <h3 className="font-black text-base text-[#161D15]">{selectedCountry.name}</h3>
                                    </div>
                                    <div className="inline-block px-3 py-1 rounded-xl bg-[#161D15] text-[#EFF0EA] text-[11px] font-bold">
                                        已去過當地 <span className="text-[#C5AB89] font-black">{selectedCountry.venues ? selectedCountry.venues.size : 0}</span> 個場館
                                    </div>

                                    {selectedCountry.events && selectedCountry.events.length > 0 ? (
                                        <div className="space-y-1.5 max-h-44 overflow-y-auto no-scrollbar pt-1">
                                            {selectedCountry.events.map(e => (
                                                <div key={e.id} className="bg-white p-2.5 rounded-2xl border border-[#D2CABF] flex items-center justify-between text-xs shadow-sm">
                                                    <div className="min-w-0 flex-1 pr-2">
                                                        <div className="font-extrabold text-[#161D15] truncate">{e.artist || e.title}</div>
                                                        <div className="text-[10px] text-[#737C75] truncate mt-0.5">📍 {e.venue || '未定場館'}</div>
                                                    </div>
                                                    <div className="font-mono text-[10px] font-bold text-[#161D15] bg-[#EBEBE9] px-2 py-1 rounded-lg shrink-0">
                                                        {e.date}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    ) : (
                                        <p className="text-xs text-[#737C75]">尚未在當地紀錄演出活動</p>
                                    )}
                                    <button onClick={handleCloseCountryModal} className="w-full py-2.5 rounded-xl bg-[#161D15] text-[#EFF0EA] font-bold text-xs">關閉</button>
                                </div>
                            </div>
                        )}
                        {selectedEventModal && <EventDetailModal event={selectedEventModal} onClose={() => setSelectedEventModal(null)} onDelete={() => {}} onEdit={() => {}} />}
                    </div>
                );
            }

            function ArchiveSection({ events, allEvents, selectedCategory, setSelectedCategory, searchQuery, setSearchQuery, viewMode, onDelete, onEdit, getGoogleMapsUrl, onOpenAddModal }) {
                const [detailEvent, setDetailEvent] = useState(null);
                const [calendarDate, setCalendarDate] = useState(new Date());
                const year = calendarDate.getFullYear(), month = calendarDate.getMonth();

                const calendarDays = useMemo(() => {
                    const firstDay = new Date(year, month, 1).getDay();
                    const totalDays = new Date(year, month + 1, 0).getDate();
                    const days = Array(firstDay).fill(null);
                    for (let i = 1; i <= totalDays; i++) {
                        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                        days.push({ day: i, events: allEvents.filter(e => e.date === dateStr) });
                    }
                    return days;
                }, [year, month, allEvents]);

                return (
                    <div className="space-y-4 p-4 pb-24">
                        <div className="space-y-2.5">
                            <div className="relative">
                                <i data-lucide="search" className="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-[#737C75]"></i>
                                <input type="text" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} placeholder="搜尋名稱、場館、藝人..." className="w-full bg-[#EFF0EA] text-[#161D15] pl-9 pr-8 py-2 rounded-xl text-xs border border-[#D2CABF]" />
                            </div>
                            <div className="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-1 -mx-4 px-4">
                                <button onClick={() => setSelectedCategory('all')} className={`px-3 py-1.5 rounded-full text-xs font-bold whitespace-nowrap ${selectedCategory === 'all' ? 'bg-[#C5AB89] text-[#161D15]' : 'bg-[#EFF0EA] text-[#161D15]'}`}>✨ 全部 ({allEvents.length})</button>
                                {Object.entries(CATEGORIES).map(([k, cat]) => (
                                    <button key={k} onClick={() => setSelectedCategory(k)} className={`px-3 py-1.5 rounded-full text-xs font-bold whitespace-nowrap ${selectedCategory === k ? `${cat.badgeBg}` : 'bg-[#EFF0EA] text-[#161D15]'}`}>{cat.emoji} {cat.label}</button>
                                ))}
                            </div>
                        </div>

                        {viewMode === 'calendar' ? (
                            <div className="bg-[#EFF0EA] text-[#161D15] p-4 rounded-3xl shadow-lg border border-[#D2CABF] space-y-4">
                                <div className="flex items-center justify-between"><h3 className="font-extrabold text-sm">{year} 年 {month + 1} 月</h3><div className="flex gap-1"><button onClick={() => setCalendarDate(new Date(year, month - 1, 1))} className="p-1 rounded bg-[#EBEBE9]"><i data-lucide="chevron-left" className="w-4 h-4"></i></button><button onClick={() => setCalendarDate(new Date(year, month + 1, 1))} className="p-1 rounded bg-[#EBEBE9]"><i data-lucide="chevron-right" className="w-4 h-4"></i></button></div></div>
                                <div className="grid grid-cols-7 gap-1 text-center font-bold text-[10px] text-[#737C75]"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
                                <div className="grid grid-cols-7 gap-1">{calendarDays.map((item, idx) => !item ? <div key={idx} className="h-10"></div> : <div key={idx} onClick={() => { if(item.events.length) setDetailEvent(item.events[0]); }} className={`h-10 rounded-xl flex flex-col items-center justify-center ${item.events.length ? 'bg-[#C5AB89] font-black cursor-pointer' : 'bg-[#EBEBE9]'}`}><span>{item.day}</span></div>)}</div>
                            </div>
                        ) : (
                            <div className="space-y-3">
                                {events.length === 0 ? (
                                    <div className="text-center py-16 bg-[#EFF0EA]/5 border border-dashed border-[#737C75]/40 rounded-3xl p-6 space-y-3">
                                        <p className="text-xs text-[#EFF0EA] font-extrabold">暫無藝文紀錄</p>
                                        <button onClick={onOpenAddModal} className="px-4 py-2 bg-[#C5AB89] text-[#161D15] rounded-xl font-bold text-xs">新增藝文紀錄</button>
                                    </div>
                                ) : (
                                    events.map((evt) => {
                                        const cat = CATEGORIES[evt.type] || CATEGORIES.concert;
                                        const t = evt.imageTransform || { scale: 1, x: 0, y: 0 };
                                        return (
                                            <div key={evt.id} onClick={() => setDetailEvent(evt)} className="relative bg-[#EFF0EA] text-[#161D15] rounded-2xl flex shadow-lg overflow-hidden cursor-pointer hover:scale-[1.01] transition-all my-2">
                                                <div className="absolute -left-3 top-1/2 -translate-y-1/2 w-6 h-6 bg-[#161D15] rounded-full z-20"></div>
                                                <div className="absolute -right-3 top-1/2 -translate-y-1/2 w-6 h-6 bg-[#161D15] rounded-full z-20"></div>
                                                
                                                <div className="flex-1 p-3.5 pl-5 flex gap-3 min-w-0 pr-4 relative">
                                                    <div 
                                                        onClick={(e) => { e.stopPropagation(); setDetailEvent(evt); }}
                                                        className="w-16 h-20 rounded-xl overflow-hidden shrink-0 border border-[#D2CABF] bg-[#EBEBE9] relative shadow-sm cursor-pointer hover:opacity-95 flex items-center justify-center"
                                                    >
                                                        {evt.coverImg ? (
                                                            <img src={evt.coverImg} alt={evt.title} className="w-full h-full object-cover" style={{ transform: `translate(${t.x * 0.25}px, ${t.y * 0.25}px) scale(${t.scale})` }} />
                                                        ) : (
                                                            <div className="w-full h-full bg-[#EBEBE9]" />
                                                        )}
                                                    </div>
                                                    <div className="flex-1 flex flex-col justify-between min-w-0">
                                                        <div className="space-y-1">
                                                            <div className="flex items-center justify-between gap-1 text-[10px] font-mono font-bold text-[#737C75]">
                                                                <span className="whitespace-nowrap">{evt.date}</span>
                                                                <span className="truncate max-w-[120px] sm:max-w-none text-right" title={evt.venue}>📍 {evt.venue}</span>
                                                            </div>
                                                            <h3 className="font-extrabold text-xs text-[#161D15] leading-snug line-clamp-2">{evt.title}</h3>
                                                        </div>
                                                        <div className="text-[10px] text-[#737C75] flex items-center gap-1">
                                                            <span>{cat.emoji} {cat.label}</span>
                                                        </div>
                                                    </div>
                                                </div>
                                                <div className="relative w-0 border-r-2 border-dashed border-[#737C75]/40 my-1 z-10"></div>
                                                <div className="w-[88px] bg-[#EBEBE9] p-2.5 flex flex-col justify-between items-center text-center shrink-0 border-l border-[#D2CABF]/40">
                                                    <span className="text-[8px] font-mono font-black text-[#737C75]">ADMIT ONE</span>
                                                    <div className="font-mono text-[10px] font-black">{evt.cost ? `$${Number(evt.cost).toLocaleString()}` : 'FREE'}</div>
                                                    {evt.detailSeat ? <span className="text-[8px] font-bold bg-[#CCB9AA] px-1.5 py-0.5 rounded w-full truncate">{evt.detailSeat.slice(0, 6)}</span> : <span></span>}
                                                </div>
                                            </div>
                                        );
                                    })
                                )}
                            </div>
                        )}
                        {detailEvent && <EventDetailModal event={detailEvent} onClose={() => setDetailEvent(null)} onDelete={onDelete} onEdit={onEdit} />}
                    </div>
                );
            }

            function ScheduleSection({ schedules, onDelete, onEdit, onSaveSchedule, getGoogleMapsUrl, onOpenAddModal }) {
                const STATUS_CYCLE = ['即將開賣', '售票中', '已完售'];

                const handleCycleStatus = (sch, e) => {
                    e.stopPropagation();
                    const currentIdx = STATUS_CYCLE.indexOf(sch.status || '即將開賣');
                    const nextStatus = STATUS_CYCLE[(currentIdx + 1) % STATUS_CYCLE.length];
                    onSaveSchedule({ ...sch, status: nextStatus });
                };

                return (
                    <div className="p-4 pb-24 space-y-4">
                        <div><h2 className="text-base font-extrabold">近期演出排程</h2></div>
                        <div className="space-y-3.5">
                            {schedules.length === 0 ? (
                                <div className="text-center py-16 bg-[#EFF0EA]/5 border border-dashed border-[#737C75]/40 rounded-3xl p-6">
                                    <p className="text-xs text-[#EFF0EA] font-extrabold mb-2">暫無演出排程</p>
                                    <button onClick={onOpenAddModal} className="px-4 py-2 bg-[#C5AB89] text-[#161D15] rounded-xl font-bold text-xs">新增演出排程</button>
                                </div>
                            ) : (
                                schedules.map(sch => {
                                    const priceLines = (sch.priceRange || '').split('\n');
                                    return (
                                        <div key={sch.id} className="relative bg-[#EFF0EA] text-[#161D15] rounded-2xl flex shadow-lg overflow-hidden my-2">
                                            <div className="absolute -left-3 top-1/2 -translate-y-1/2 w-6 h-6 bg-[#161D15] rounded-full z-20"></div>
                                            <div className="absolute -right-3 top-1/2 -translate-y-1/2 w-6 h-6 bg-[#161D15] rounded-full z-20"></div>
                                            
                                            <div className="flex-1 p-3.5 pl-5 flex flex-col justify-between min-w-0 pr-3 overflow-hidden">
                                                <div className="space-y-2">
                                                    <div className="flex items-center justify-between">
                                                        <span className="px-2.5 py-1 rounded-lg bg-[#CCB9AA]/40 text-[#161D15] font-mono text-[10px] font-extrabold">{sch.date}</span>
                                                        <div className="flex items-center gap-1.5">
                                                            <button
                                                                onClick={(e) => handleCycleStatus(sch, e)}
                                                                className={`px-2.5 py-1 rounded-xl font-bold text-[10px] border transition-all cursor-pointer ${
                                                                    sch.status === '已完售'
                                                                        ? 'bg-red-100 text-red-700 border-red-300'
                                                                        : sch.status === '售票中'
                                                                        ? 'bg-green-100 text-green-700 border-green-300'
                                                                        : 'bg-transparent text-[#AB8C83] border-[#AB8C83]/60'
                                                                }`}
                                                                title="點擊切換狀態"
                                                            >
                                                                {sch.status || '即將開賣'}
                                                            </button>
                                                            <button onClick={() => onEdit(sch)} className="w-7 h-7 rounded-full bg-[#CCB9AA]/30 text-[#161D15] flex items-center justify-center hover:bg-[#CCB9AA]/50 transition-colors shadow-sm" title="編輯排程">
                                                                <i data-lucide="pencil" className="w-3.5 h-3.5"></i>
                                                            </button>
                                                        </div>
                                                    </div>
                                                    <div className="min-w-0 overflow-hidden">
                                                        <h3 className="font-black text-sm text-[#161D15] leading-snug break-words whitespace-normal max-w-full">
                                                            {sch.title}
                                                        </h3>
                                                        <p className="text-[11px] text-[#737C75] font-medium leading-relaxed truncate mt-1">
                                                            {sch.organizer} • {sch.venue}
                                                        </p>
                                                    </div>
                                                </div>
                                            </div>

                                            <div className="relative w-0 border-r-2 border-dashed border-[#737C75]/40 my-1 z-10"></div>

                                            <div className="w-[110px] bg-[#EBEBE9] p-3 flex flex-col justify-between items-start text-left shrink-0 border-l border-[#D2CABF]/40">
                                                <div className="font-mono text-[11px] font-black leading-tight tracking-tight text-[#161D15] w-full text-left flex flex-col items-start justify-center">
                                                    {priceLines.length > 0 && priceLines[0] !== '' ? (
                                                        priceLines.map((line, idx) => (
                                                            <span key={idx} className="block text-left w-full truncate">{line}</span>
                                                        ))
                                                    ) : (
                                                        <span className="text-[#737C75] font-normal text-[10px]">票價未定</span>
                                                    )}
                                                </div>
                                                <a href={sch.ticketLink || 'https://tixcraft.com'} target="_blank" rel="noopener noreferrer" className="w-full py-1.5 bg-[#161D15] text-[#EFF0EA] rounded-xl font-bold text-[11px] shadow hover:bg-black transition-colors block text-center mt-2">
                                                    購票
                                                </a>
                                            </div>
                                        </div>
                                    );
                                })
                            )}
                        </div>
                    </div>
                );
            }

            function StatsSection({ stats, events }) {
                const artistRankings = useMemo(() => {
                    const counts = {};
                    events.forEach(e => {
                        if (e.artist && e.artist.trim()) {
                            const a = e.artist.trim();
                            counts[a] = (counts[a] || 0) + 1;
                        }
                    });
                    return Object.entries(counts)
                        .map(([artist, count]) => ({ artist, count }))
                        .sort((a, b) => b.count - a.count);
                }, [events]);

                return (
                    <div className="p-4 pb-24 space-y-4">
                        <div className="space-y-0.5">
                            <h2 className="text-base font-extrabold text-[#EFF0EA]">成就統計與花費總覽</h2>
                            <p className="text-[11px] text-[#737C75]">全方位檢視您的藝文足跡與收藏成就</p>
                        </div>

                        <div className="grid grid-cols-2 gap-3">
                            <div className="bg-[#EFF0EA] text-[#161D15] px-3 py-2.5 rounded-2xl shadow-lg border border-[#D2CABF] space-y-0.5">
                                <span className="text-[10px] text-[#737C75] font-bold block">總藝文紀錄</span>
                                <div className="font-mono font-black text-xl flex items-baseline gap-1">
                                    {stats.totalEvents} <span className="text-xs font-bold text-[#737C75]">筆</span>
                                </div>
                            </div>
                            <div className="bg-[#EFF0EA] text-[#161D15] px-3 py-2.5 rounded-2xl shadow-lg border border-[#D2CABF] space-y-0.5">
                                <span className="text-[10px] text-[#737C75] font-bold block">總花費金額</span>
                                <div className="font-mono font-black text-base tracking-tight pt-0.5">
                                    NT$ {stats.totalCost.toLocaleString()}
                                </div>
                            </div>
                        </div>

                        <div className="bg-[#EFF0EA] text-[#161D15] rounded-3xl p-4 shadow-lg border border-[#D2CABF] space-y-3">
                            <div className="flex items-center justify-between border-b border-[#D2CABF] pb-2">
                                <h3 className="font-extrabold text-sm text-[#161D15]">演出藝人次數排名</h3>
                                <span className="text-[10px] text-[#737C75] font-bold">共 {stats.uniqueArtistsCount} 人</span>
                            </div>
                            {artistRankings.length === 0 ? (
                                <p className="text-xs text-[#737C75] text-center py-2">尚未紀錄任何演出藝人</p>
                            ) : (
                                <div className="space-y-2 max-h-60 overflow-y-auto no-scrollbar">
                                    {artistRankings.map((item, idx) => {
                                        const rank = idx + 1;
                                        return (
                                            <div key={item.artist} className="flex items-center justify-between p-2 rounded-2xl bg-white border border-[#D2CABF]/60 shadow-sm">
                                                <div className="flex items-center gap-2.5 min-w-0">
                                                    <RankIcon rank={rank} />
                                                    <span className="font-extrabold text-xs text-[#161D15] truncate">{item.artist}</span>
                                                </div>
                                                <div className="font-mono font-black text-xs text-[#161D15] bg-[#EBEBE9] px-2.5 py-1 rounded-xl shrink-0">
                                                    {item.count} <span className="text-[10px] font-bold text-[#737C75]">場</span>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            )}
                        </div>

                        <div className="bg-[#EFF0EA] text-[#161D15] rounded-3xl p-5 shadow-lg border border-[#D2CABF] space-y-3">
                            <h3 className="font-extrabold text-sm text-[#161D15] border-b border-[#D2CABF] pb-2">分類佔比</h3>
                            <div className="space-y-3">
                                {Object.entries(CATEGORIES).map(([key, cat]) => {
                                    const count = stats.categoryCounts[key] || 0;
                                    const percentage = stats.totalEvents > 0 ? Math.round((count / stats.totalEvents) * 100) : 0;
                                    return (
                                        <div key={key} className="flex items-center justify-between text-xs font-bold py-1.5 px-2 bg-white rounded-xl border border-[#D2CABF]/60">
                                            <div className="flex items-center gap-2">
                                                <span className="text-sm">{cat.emoji}</span>
                                                <span className="text-[#161D15]">{cat.label}</span>
                                            </div>
                                            <div className="font-mono text-[#737C75]">
                                                <strong className="text-[#161D15]">{count}</strong> 筆 (<strong className="text-[#161D15]">{percentage}%</strong>)
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    </div>
                );
            }

            ReactDOM.createRoot(document.getElementById('root')).render(<App />);
        } catch (err) {
            document.getElementById('root').innerHTML = `<div style="padding:24px; color:#EFF0EA; text-align:center;"><h2>載入錯誤</h2><p>${err.message}</p><button onclick="localStorage.clear();window.location.reload();" style="background:#C5AB89;padding:8px 16px;border-radius:8px;font-weight:bold;margin-top:12px;">重設快取</button></div>`;
        }
    </script>
</body>
</html>
