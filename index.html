<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <!-- iOS PWA 與全螢幕適配 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Travel Log</title>
    
    <!-- React & Tailwind & Leaflet CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        /* iOS Safe Area 邊距支援 */
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        .pt-safe { padding-top: env(safe-area-inset-top); }
        
        /* 防 iOS 滑動回彈拉伸 */
        body {
            overscroll-behavior-y: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Leaflet Marker 樣式調整 */
        .custom-div-icon {
            background: transparent;
            border: none;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 select-none">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // 預設國家座標表
        const COUNTRY_COORDS = {
            '台灣': { lat: 23.6978, lng: 120.9605 },
            '日本': { lat: 36.2048, lng: 138.2529 },
            '韓國': { lat: 35.9078, lng: 127.7669 },
            '美國': { lat: 37.0902, lng: -95.7129 }
        };

        // 1. 地圖區塊組件 (包含修復 1 與 修復 2)
        function LeafletMapSection({ events, onDelete, getGoogleMapsUrl }) {
            const mapRef = useRef(null);
            const mapInstanceRef = useRef(null);
            const layerGroupRef = useRef(null);
            const [selectedEventModal, setSelectedEventModal] = useState(null);

            // 初始化地圖
            useEffect(() => {
                if (!mapRef.current || mapInstanceRef.current) return;

                const map = L.map(mapRef.current, {
                    zoomControl: false,
                    tap: !L.Browser.mobile // 避免 iOS 雙重觸發點擊
                }).setView([23.6978, 120.9605], 4);

                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '© OpenStreetMap'
                }).addTo(map);

                layerGroupRef.current = L.layerGroup().addTo(map);
                mapInstanceRef.current = map;

                return () => {
                    map.remove();
                    mapInstanceRef.current = null;
                };
            }, []);

            // [修復 2] 動態繪製與同步 Marker
            useEffect(() => {
                if (!mapInstanceRef.current || !layerGroupRef.current) return;

                const layerGroup = layerGroupRef.current;
                layerGroup.clearLayers();

                events.forEach((evt, index) => {
                    if (!evt.lat || !evt.lng || evt.status === 'wishlist') return;

                    const markerNumber = index + 1;
                    const customIcon = L.divIcon({
                        className: 'custom-div-icon',
                        html: `<div class="w-7 h-7 bg-indigo-600 text-white font-bold rounded-full flex items-center justify-center shadow-lg border-2 border-white">${markerNumber}</div>`,
                        iconSize: [28, 28],
                        iconAnchor: [14, 14]
                    });

                    const marker = L.marker([evt.lat, evt.lng], { icon: customIcon });
                    marker.on('click', () => setSelectedEventModal(evt));
                    layerGroup.addLayer(marker);
                });
            }, [events]);

            return (
                <div className="relative w-full h-[calc(100vh-70px)]">
                    <div ref={mapRef} className="w-full h-full z-0" />
                    
                    {/* [修復 1] 正確傳遞 onDelete */}
                    {selectedEventModal && (
                        <EventDetailModal 
                            event={selectedEventModal} 
                            onClose={() => setSelectedEventModal(null)} 
                            onDelete={(id) => {
                                onDelete(id);
                                setSelectedEventModal(null);
                            }} 
                            getGoogleMapsUrl={getGoogleMapsUrl} 
                        />
                    )}
                </div>
            );
        }

        // 活動詳情彈窗
        function EventDetailModal({ event, onClose, onDelete, getGoogleMapsUrl }) {
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">
                    <div className="bg-white w-full max-w-sm rounded-2xl p-5 shadow-xl space-y-4">
                        <div className="flex justify-between items-start">
                            <h3 className="text-xl font-bold">{event.title}</h3>
                            <button onClick={onClose} className="text-gray-400 text-xl font-bold p-1">✕</button>
                        </div>
                        <p className="text-sm text-gray-600">{event.country} · {event.date}</p>
                        <p className="text-gray-700">{event.note || '無詳細備註'}</p>
                        
                        <div className="flex gap-2 pt-2">
                            <a 
                                href={getGoogleMapsUrl(event)} 
                                target="_blank" 
                                rel="noreferrer"
                                className="flex-1 bg-indigo-50 text-indigo-600 py-2.5 rounded-xl text-center font-medium active:bg-indigo-100"
                            >
                                開啟地圖
                            </a>
                            <button 
                                onClick={() => onDelete(event.id)}
                                className="flex-1 bg-red-50 text-red-600 py-2.5 rounded-xl font-medium active:bg-red-100"
                            >
                                刪除紀錄
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // 新增紀錄彈窗 (包含修復 3)
        function AddEventModal({ onClose, onAdd }) {
            const [country, setCountry] = useState('台灣');
            const [title, setTitle] = useState('');
            const [note, setNote] = useState('');

            const handleSubmit = (e) => {
                e.preventDefault();
                const baseCoord = COUNTRY_COORDS[country] || { lat: 23.6978, lng: 120.9605 };
                
                // [修復 3] 加入座標 Jitter，解決同國家重疊問題
                const jitter = () => (Math.random() - 0.5) * 0.04;
                
                const newEvent = {
                    id: Date.now(),
                    title,
                    country,
                    note,
                    date: new Date().toISOString().split('T')[0],
                    lat: baseCoord.lat + jitter(),
                    lng: baseCoord.lng + jitter(),
                    status: 'visited'
                };

                onAdd(newEvent);
                onClose();
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">
                    <form onSubmit={handleSubmit} className="bg-white w-full max-w-sm rounded-2xl p-5 space-y-4">
                        <h3 className="text-lg font-bold">新增旅遊紀錄</h3>
                        <div>
                            <label className="text-xs font-semibold text-gray-500">目的地國家</label>
                            <select 
                                value={country} 
                                onChange={(e) => setCountry(e.target.value)}
                                className="w-full mt-1 border border-gray-200 rounded-xl p-2.5 bg-gray-50 outline-none"
                            >
                                <option value="台灣">台灣</option>
                                <option value="日本">日本</option>
                                <option value="韓國">韓國</option>
                                <option value="美國">美國</option>
                            </select>
                        </div>
                        <div>
                            <label className="text-xs font-semibold text-gray-500">地點 / 活動名稱</label>
                            <input 
                                required
                                type="text" 
                                value={title} 
                                onChange={(e) => setTitle(e.target.value)}
                                className="w-full mt-1 border border-gray-200 rounded-xl p-2.5 outline-none"
                                placeholder="例如：東京鐵塔"
                            />
                        </div>
                        <div>
                            <label className="text-xs font-semibold text-gray-500">心得備註</label>
                            <textarea 
                                value={note} 
                                onChange={(e) => setNote(e.target.value)}
                                className="w-full mt-1 border border-gray-200 rounded-xl p-2.5 outline-none h-20"
                            />
                        </div>
                        <div className="flex gap-2">
                            <button type="button" onClick={onClose} className="flex-1 py-2.5 text-gray-500 font-medium">取消</button>
                            <button type="submit" className="flex-1 py-2.5 bg-indigo-600 text-white rounded-xl font-medium shadow-md">儲存</button>
                        </div>
                    </form>
                </div>
            );
        }

        // 成就統計區塊 (包含修復 4)
        function StatsSection({ events }) {
            const totalVisited = events.filter(e => e.status === 'visited').length;
            const progress = Math.min((totalVisited / 10) * 100, 100);

            return (
                <div className="p-4 space-y-4">
                    <div className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                        <div className="flex justify-between items-center mb-2">
                            <span className="font-semibold text-sm">解鎖國家成就目標</span>
                            <span className="text-xs font-bold text-indigo-600">{totalVisited} / 10</span>
                        </div>
                        
                        {/* [修復 4] 修正類別衝突問題 (修正為 h-2 w-full) */}
                        <div className="h-2 bg-gray-100 rounded-full overflow-hidden w-full">
                            <div 
                                className="h-full bg-indigo-600 transition-all duration-300" 
                                style={{ width: `${progress}%` }} 
                            />
                        </div>
                    </div>
                </div>
            );
        }

        // 個人檔案編輯彈窗 (包含修復 5)
        function EditProfileModal({ profile, onClose, onSave }) {
            const [bio, setBio] = useState(profile.bio);

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">
                    <div className="bg-white w-full max-w-sm rounded-2xl p-5 space-y-4">
                        <h3 className="text-lg font-bold">編輯個人檔案</h3>
                        <div>
                            {/* [修復 5] 修正文字顯示 */}
                            <label className="text-xs font-semibold text-gray-500">個人簡介</label>
                            <input 
                                type="text" 
                                value={bio} 
                                onChange={(e) => setBio(e.target.value)}
                                className="w-full mt-1 border border-gray-200 rounded-xl p-2.5 outline-none"
                            />
                        </div>
                        <div className="flex gap-2">
                            <button onClick={onClose} className="flex-1 py-2.5 text-gray-500 font-medium">取消</button>
                            <button onClick={() => { onSave({ ...profile, bio }); onClose(); }} className="flex-1 py-2.5 bg-indigo-600 text-white rounded-xl font-medium">儲存</button>
                        </div>
                    </div>
                </div>
            );
        }

        // 主應用程式入口
        function App() {
            const [activeTab, setActiveTab] = useState('map');
            const [isAddModalOpen, setIsAddModalOpen] = useState(false);
            const [profile, setProfile] = useState({ name: 'Traveler', bio: '熱愛探索世界' });
            const [events, setEvents] = useState([
                { id: 1, title: '九份老街', country: '台灣', date: '2026-01-10', lat: 25.109, lng: 121.844, status: 'visited' }
            ]);

            const handleDeleteEvent = (eventId) => {
                setEvents(prev => prev.filter(evt => evt.id !== eventId));
            };

            const handleAddEvent = (newEvent) => {
                setEvents(prev => [...prev, newEvent]);
            };

            const getGoogleMapsUrl = (evt) => {
                return `https://www.google.com/maps/search/?api=1&query=${evt.lat},${evt.lng}`;
            };

            return (
                <div className="flex flex-col h-screen max-w-md mx-auto bg-white shadow-2xl relative overflow-hidden">
                    {/* Header */}
                    <header className="pt-safe bg-white border-b border-gray-100 p-4 flex justify-between items-center z-10">
                        <h1 className="font-bold text-lg">足跡隨手記</h1>
                        <button onClick={() => setIsAddModalOpen(true)} className="bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-sm font-medium active:scale-95 transition-transform">
                            + 新增
                        </button>
                    </header>

                    {/* View Controller */}
                    <main className="flex-1 overflow-y-auto">
                        {activeTab === 'map' && (
                            <LeafletMapSection 
                                events={events} 
                                onDelete={handleDeleteEvent} 
                                getGoogleMapsUrl={getGoogleMapsUrl} 
                            />
                        )}
                        {activeTab === 'stats' && <StatsSection events={events} />}
                    </main>

                    {/* Bottom Navigation (iOS 適配) */}
                    <nav className="pb-safe bg-white border-t border-gray-100 flex justify-around p-3 z-10">
                        <button 
                            onClick={() => setActiveTab('map')}
                            className={`text-sm font-medium ${activeTab === 'map' ? 'text-indigo-600' : 'text-gray-400'}`}
                        >
                            足跡地圖
                        </button>
                        <button 
                            onClick={() => setActiveTab('stats')}
                            className={`text-sm font-medium ${activeTab === 'stats' ? 'text-indigo-600' : 'text-gray-400'}`}
                        >
                            成就統計
                        </button>
                    </nav>

                    {/* Modals */}
                    {isAddModalOpen && (
                        <AddEventModal 
                            onClose={() => setIsAddModalOpen(false)} 
                            onAdd={handleAddEvent} 
                        />
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
