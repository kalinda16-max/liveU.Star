<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>LiveU iOS App</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="LiveU">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#161D15">

    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="image/icons/icon-180.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        palette: {
                            taupe: '#CCB9AA',
                            offwhite: '#EFF0EA',
                            lightgrey: '#E1E1DF',
                            sage: '#737C75',
                            dustrose: '#AB8C83',
                            camel: '#C5AB89',
                            beige: '#D2CABF',
                            cardbg: '#F8F8F8',
                            softgrey: '#EBEBE9',
                            darkslate: '#161D15',
                        }
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- Lucide Icons & React Core -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Canvas Confetti for Fireworks Animation -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- Cropper.js CSS & JavaScript -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>

    <!-- 獨立的 venues 場館資料庫檔案 -->
    <script src="venues.js" onerror="window.VENUE_DATABASE = {};"></script>
    
    <style>
        *, *::before, *::after { 
            box-sizing: border-box !important; 
            -webkit-tap-highlight-color: transparent !important;
        }
        button, button:focus, button:focus-visible, button:active {
            outline: none !important;
            -webkit-tap-highlight-color: transparent !important;
        }
        html, body {
            margin: 0; padding: 0; width: 100vw; height: 100%; max-width: 100vw;
            overflow-x: hidden !important; overflow-y: hidden !important;
            background-color: #161D15; color: #EFF0EA; touch-action: manipulation;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .app-container {
            display: flex; flex-direction: column; 
            height: 100vh; height: 100dvh;
            overflow: hidden !important; 
            background-color: #161D15; max-width: 100vw; width: 100%; position: relative;
        }
        header, .app-header {
            position: relative; z-index: 1000 !important;
            padding-top: calc(env(safe-area-inset-top, 20px) + 8px) !important;
            background-color: #121212 !important; border-bottom: 1px solid rgba(115, 124, 117, 0.3); flex-shrink: 0;
        }
        .top-stats-card { z-index: 999 !important; }
        #map-wrapper { flex: 1; width: 100%; position: relative; overflow: hidden; display: flex; flex-direction: column; z-index: 1 !important; }
        #map { width: 100% !important; height: 100% !important; z-index: 1 !important; background: #000000 !important; }
        
        footer, .bottom-nav {
            position: fixed !important;
            bottom: 0 !important;
            left: 0 !important;
            right: 0 !important;
            flex-shrink: 0;
            z-index: 999999 !important;
        }

        .modal-overlay {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            bottom: 0 !important;
            flex-shrink: 0;
            z-index: 99999 !important;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        .ios-glass {
            background: rgba(22, 29, 21, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        /* Leaflet Dark Mode Overrides */
        .leaflet-container {
            background: #000000 !important;
            font-family: inherit;
        }
        .leaflet-tile-pane { 
            filter: invert(100%) hue-rotate(180deg) brightness(85%) contrast(90%); 
        }

        /* Simplified Numeric Leaflet Marker */
        .custom-numeric-marker {
            background: #C5AB89;
            border: 2px solid #EFF0EA;
            color: #161D15;
            font-weight: 900;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.7);
            font-size: 11px;
            transition: transform 0.2s;
        }
        .custom-numeric-marker:hover {
            transform: scale(1.2);
        }

        /* Cropper.js Styling Overrides for Dark Mode & Theme */
        .cropper-view-box {
            outline: 2px solid #C5AB89 !important;
            outline-color: #C5AB89 !important;
        }
        .cropper-line {
            background-color: #C5AB89 !important;
        }
        .cropper-point {
            background-color: #C5AB89 !important;
            width: 8px !important;
            height: 8px !important;
        }
        .cropper-dashed {
            border-color: rgba(239, 240, 234, 0.6) !important;
        }
        .cropper-bg {
            background-image: none !important;
            background-color: #0d120d !important;
        }
        .cropper-container {
            touch-action: none !important;
            max-width: 100% !important;
            max-height: 100% !important;
        }

        /* Gold Glow for Artist of the Year */
        .glow-gold {
            box-shadow: 0 0 25px rgba(197, 171, 137, 0.35);
        }
    </style>
</head>
<body class="bg-[#161D15] text-[#EFF0EA] font-sans antialiased h-full select-none overflow-hidden max-w-[100vw]">
    <div id="root" class="h-full"></div>

    <script type="text/babel">
        try {
            const { useState, useEffect, useMemo, useRef, useCallback } = React;

            const CATEGORIES = {
                concert: { label: '演唱會', icon: 'concert.png', emoji: '🎵', badgeBg: 'bg-[#C5AB89] text-[#737C75]' },
                exhibition: { label: '展覽', icon: 'abstract.png', emoji: '🎨', badgeBg: 'bg-[#C5AB89] text-[#737C75]' },
                movie: { label: '電影', icon: 'clapperboard.png', emoji: '🎬', badgeBg: 'bg-[#C5AB89] text-[#737C75]' },
                book: { label: '見面會', icon: 'chant.png', emoji: '📚', badgeBg: 'bg-[#C5AB89] text-[#737C75]' },
                drama: { label: '舞台劇', icon: 'theatre.png', emoji: '🎭', badgeBg: 'bg-[#C5AB89] text-[#737C75]' }
            };

            const venueDb = window.VENUE_DATABASE || {};

            const COUNTRY_NAME_MAPPING = {
                'Taiwan': '台灣', 'TW': '台灣',
                'Japan': '日本', 'JP': '日本',
                'South Korea': '南韓', 'Korea': '南韓', 'KR': '南韓',
                'United States': '美國', 'US': '美國', 'USA': '美國',
                'Australia': '澳大利亞', 'AU': '澳大利亞',
                'United Kingdom': '英國', 'GB': '英國', 'UK': '英國',
                'Thailand': '泰國', 'TH': '泰國',
                'China': '中國', 'CN': '中國',
                'Hong Kong': '香港', 'HK': '香港'
            };

            function resolveCountryInfo(countryInput) {
                const clean = (countryInput || '').trim().toLowerCase();
                if (clean.includes('台') || clean.includes('tw') || clean.includes('taiwan')) return { code: 'TW', name: '台灣', lat: 25.033, lng: 121.565 };
                if (clean.includes('日') || clean.includes('jp') || clean.includes('japan')) return { code: 'JP', name: '日本', lat: 35.676, lng: 139.650 };
                if (clean.includes('韓') || clean.includes('kr') || clean.includes('korea')) return { code: 'KR', name: '南韓', lat: 37.566, lng: 126.978 };
                if (clean.includes('美') || clean.includes('us') || clean.includes('america')) return { code: 'US', name: '美國', lat: 40.712, lng: -74.006 };
                return { code: 'OTHER', name: countryInput || '台灣', lat: 25.033, lng: 121.565 };
            }

            function parseSpotifyEmbedUrl(urlOrUri) {
                if (!urlOrUri) return null;
                let raw = urlOrUri.trim();
                if (raw.startsWith('spotify:')) {
                    const parts = raw.split(':');
                    if (parts.length >= 3) return `https://open.spotify.com/embed/${parts[1]}/${parts[2]}?utm_source=generator&theme=0`;
                }
                if (raw.includes('open.spotify.com')) {
                    try {
                        const urlObj = new URL(raw);
                        const pathSegments = urlObj.pathname.split('/').filter(Boolean);
                        if (pathSegments.length >= 2) return `https://open.spotify.com/embed/${pathSegments[0]}/${pathSegments[1]}?utm_source=generator&theme=0`;
                    } catch (e) {}
                }
                return null;
            }

            function CategoryIcon({ cat, sizeClass = "w-4 h-4", showFallback = true }) {
                if (cat && cat.icon && cat.icon.endsWith('.png')) {
                    return <img src={cat.icon} alt={cat.label} className={`${sizeClass} object-contain inline-block shrink-0`} />;
                }
                return showFallback ? <span>{cat?.emoji}</span> : null;
            }

            function CustomCategorySelect({ value, onChange }) {
                const [isOpen, setIsOpen] = useState(false);
                const dropdownRef = useRef(null);

                const selectedCat = CATEGORIES[value] || CATEGORIES.concert;

                useEffect(() => {
                    const handleClickOutside = (event) => {
                        if (dropdownRef.current && !dropdownRef.current.contains(event.target)) {
                            setIsOpen(false);
                        }
                    };
                    document.addEventListener('mousedown', handleClickOutside);
                    return () => document.removeEventListener('mousedown', handleClickOutside);
                }, []);

                return (
                    <div className="relative w-full" ref={dropdownRef}>
                        <button
                            type="button"
                            onClick={() => setIsOpen(!isOpen)}
                            className="w-full bg-white px-3 py-2 rounded-xl text-xs border border-[#D2CABF] flex items-center justify-between shadow-sm active:scale-[0.99] transition-transform"
                        >
                            <div className="flex items-center gap-2">
                                <CategoryIcon cat={selectedCat} sizeClass="w-4 h-4" />
                                <span className="font-bold text-[#161D15]">{selectedCat.label}</span>
                            </div>
                            <i data-lucide="chevron-down" className={`w-4 h-4 text-[#737C75] transition-transform duration-200 ${isOpen ? 'rotate-180' : ''}`}></i>
                        </button>

                        {isOpen && (
                            <div className="absolute top-full left-0 right-0 mt-1 bg-white border border-[#D2CABF] rounded-xl shadow-xl z-50 overflow-hidden py-1 max-h-48 overflow-y-auto no-scrollbar">
                                {Object.entries(CATEGORIES).map(([key, cat]) => {
                                    const isSelected = key === value;
                                    return (
                                        <div
                                            key={key}
                                            onClick={() => {
                                                onChange(key);
                                                setIsOpen(false);
                                            }}
                                            className={`flex items-center gap-2.5 px-3 py-2 text-xs font-bold cursor-pointer transition-colors ${
                                                isSelected ? 'bg-[#C5AB89]/20 text-[#161D15]' : 'text-[#161D15] hover:bg-[#EBEBE9]'
                                            }`}
                                        >
                                            <CategoryIcon cat={cat} sizeClass="w-4 h-4" />
                                            <span>{cat.label}</span>
                                            {isSelected && <i data-lucide="check" className="w-3.5 h-3.5 ml-auto text-[#C5AB89]"></i>}
                                        </div>
                                    );
                                })}
                            </div>
                        )}
                    </div>
                );
            }

            function ImageCropperModal({ imageSrc, initialAspectRatio = 1, onConfirm, onCancel }) {
                const imageRef = useRef(null);
                const cropperRef = useRef(null);
                const containerRef = useRef(null);

                useEffect(() => {
                    if (window.lucide) {
                        try { window.lucide.createIcons(); } catch (e) {}
                    }
                });

                useEffect(() => {
                    let touchStartAngle = 0;
                    let touchStartDist = 0;

                    const handleTouchStart = (e) => {
                        if (e.touches && e.touches.length === 2) {
                            const t1 = e.touches[0];
                            const t2 = e.touches[1];
                            touchStartDist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
                            touchStartAngle = Math.atan2(t2.clientY - t1.clientY, t2.clientX - t1.clientX) * (180 / Math.PI);
                        }
                    };

                    const handleTouchMove = (e) => {
                        if (e.touches && e.touches.length === 2 && cropperRef.current) {
                            const t1 = e.touches[0];
                            const t2 = e.touches[1];

                            const currentDist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
                            if (touchStartDist > 0) {
                                const distDiff = currentDist - touchStartDist;
                                if (Math.abs(distDiff) >= 4) {
                                    const zoomRatio = distDiff > 0 ? 0.04 : -0.04;
                                    cropperRef.current.zoom(zoomRatio);
                                    touchStartDist = currentDist;
                                }
                            }

                            const currentAngle = Math.atan2(t2.clientY - t1.clientY, t2.clientX - t1.clientX) * (180 / Math.PI);
                            let diff = currentAngle - touchStartAngle;
                            if (diff > 180) diff -= 360;
                            if (diff < -180) diff += 360;

                            if (Math.abs(diff) >= 2) {
                                cropperRef.current.rotate(Math.round(diff));
                                touchStartAngle = currentAngle;
                            }
                        }
                    };

                    const container = containerRef.current;
                    if (container) {
                        container.addEventListener('touchstart', handleTouchStart, { passive: true });
                        container.addEventListener('touchmove', handleTouchMove, { passive: true });
                    }

                    const initCropper = () => {
                        if (cropperRef.current) {
                            cropperRef.current.destroy();
                            cropperRef.current = null;
                        }
                        if (imageRef.current && window.Cropper) {
                            cropperRef.current = new window.Cropper(imageRef.current, {
                                aspectRatio: initialAspectRatio,
                                viewMode: 1,
                                dragMode: 'move',
                                autoCropArea: 0.85,
                                restore: false,
                                guides: true,
                                center: true,
                                highlight: false,
                                cropBoxMovable: true,
                                cropBoxResizable: true,
                                toggleDragModeOnDblclick: false,
                                zoomOnTouch: true,
                                zoomOnWheel: true,
                                wheelZoomRatio: 0.1,
                                touchDragMode: 'move',
                                rotatable: true,
                                scalable: true,
                                responsive: true,
                                background: false,
                                ready() {
                                    if (cropperRef.current) {
                                        cropperRef.current.resize();
                                    }
                                }
                            });
                        }
                    };

                    const img = imageRef.current;
                    if (img) {
                        if (img.complete) {
                            initCropper();
                        } else {
                            img.onload = initCropper;
                        }
                    }

                    return () => {
                        if (container) {
                            container.removeEventListener('touchstart', handleTouchStart);
                            container.removeEventListener('touchmove', handleTouchMove);
                        }
                        if (cropperRef.current) {
                            cropperRef.current.destroy();
                            cropperRef.current = null;
                        }
                    };
                }, [imageSrc, initialAspectRatio]);

                const handleRotate = (degree) => {
                    if (cropperRef.current) {
                        cropperRef.current.rotate(degree);
                    }
                };

                const handleZoom = (ratio) => {
                    if (cropperRef.current) {
                        cropperRef.current.zoom(ratio);
                    }
                };

                const handleReset = () => {
                    if (cropperRef.current) {
                        cropperRef.current.reset();
                    }
                };

                const handleConfirm = () => {
                    if (!cropperRef.current) return;
                    const canvas = cropperRef.current.getCroppedCanvas({
                        maxWidth: 800,
                        maxHeight: 800,
                        imageSmoothingEnabled: true,
                        imageSmoothingQuality: 'medium',
                    });
                    if (canvas) {
                        const croppedDataUrl = canvas.toDataURL('image/jpeg', 0.6);
                        onConfirm(croppedDataUrl);
                    }
                };

                return (
                    <div className="modal-overlay bg-black/90 backdrop-blur-md flex items-center justify-center p-4 z-[9999999]">
                        <div className="bg-[#161D15] text-[#EFF0EA] w-full max-w-sm rounded-3xl p-4 shadow-2xl border border-[#C5AB89]/40 flex flex-col space-y-3 my-auto">
                            <div className="flex items-center justify-between shrink-0">
                                <h3 className="font-extrabold text-sm text-[#C5AB89] flex items-center gap-1.5">
                                    <i data-lucide="crop" className="w-4 h-4"></i> 裁切圖片
                                </h3>
                            </div>

                            <div ref={containerRef} className="relative w-full h-64 bg-black/60 rounded-2xl overflow-hidden flex items-center justify-center border border-[#737C75]/40">
                                <img ref={imageRef} src={imageSrc} alt="Crop preview" className="max-w-full max-h-full block" />
                            </div>

                            <div className="space-y-2 shrink-0">
                                <div className="flex items-center justify-center gap-2 text-xs pt-1">
                                    <button
                                        type="button"
                                        onClick={() => handleRotate(-90)}
                                        className="p-2.5 rounded-xl bg-[#737C75]/30 text-[#EFF0EA] active:bg-[#C5AB89] active:text-[#161D15] flex items-center justify-center transition-colors"
                                        title="向左旋轉 90°"
                                    >
                                        <i data-lucide="rotate-ccw" className="w-4 h-4"></i>
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => handleRotate(90)}
                                        className="p-2.5 rounded-xl bg-[#737C75]/30 text-[#EFF0EA] active:bg-[#C5AB89] active:text-[#161D15] flex items-center justify-center transition-colors"
                                        title="向右旋轉 90°"
                                    >
                                        <i data-lucide="rotate-cw" className="w-4 h-4"></i>
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => handleZoom(0.1)}
                                        className="p-2.5 rounded-xl bg-[#737C75]/30 text-[#EFF0EA] active:bg-[#C5AB89] active:text-[#161D15] flex items-center justify-center transition-colors"
                                        title="放大"
                                    >
                                        <i data-lucide="zoom-in" className="w-4 h-4"></i>
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => handleZoom(-0.1)}
                                        className="p-2.5 rounded-xl bg-[#737C75]/30 text-[#EFF0EA] active:bg-[#C5AB89] active:text-[#161D15] flex items-center justify-center transition-colors"
                                        title="縮小"
                                    >
                                        <i data-lucide="zoom-out" className="w-4 h-4"></i>
                                    </button>
                                    <button
                                        type="button"
                                        onClick={handleReset}
                                        className="px-3 py-2.5 rounded-xl bg-[#737C75]/30 text-[#D2CABF] active:bg-[#C5AB89] active:text-[#161D15] text-xs font-bold transition-colors"
                                        title="重置"
                                    >
                                        重置
                                    </button>
                                </div>
                            </div>

                            <div className="flex gap-2 pt-1 shrink-0">
                                <button
                                    type="button"
                                    onClick={onCancel}
                                    className="flex-1 py-2.5 rounded-xl bg-[#737C75]/30 text-[#EFF0EA] text-xs font-bold active:bg-[#737C75]/50 transition-colors"
                                >
                                    取消
                                </button>
                                <button
                                    type="button"
                                    onClick={handleConfirm}
                                    className="flex-1 py-2.5 rounded-xl bg-[#C5AB89] text-[#161D15] text-xs font-bold shadow-lg active:bg-[#d5bc9a] transition-colors"
                                >
                                    確認裁切
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            /* 皇冠 Icon 與星星 Icon 渲染組件 */
            function RankIcon({ rank }) {
                if (rank === 1) {
                    return (
                        <div className="relative w-6 h-6 flex items-center justify-center shrink-0">
                            <svg viewBox="0 0 100 80" className="w-6 h-6 filter drop-shadow">
                                <path d="M10,65 L90,65 L85,25 L65,45 L50,15 L35,45 L15,25 Z" fill="#E5A912" />
                                <circle cx="10" cy="22" r="5" fill="#E5A912" />
                                <circle cx="50" cy="12" r="6" fill="#E5A912" />
                                <circle cx="90" cy="22" r="5" fill="#E5A912" />
                                <path d="M15,65 L85,65 L82,72 L18,72 Z" fill="#C58D00" />
                            </svg>
                        </div>
                    );
                }
                if (rank === 2) {
                    return (
                        <div className="relative w-6 h-6 flex items-center justify-center shrink-0">
                            <svg viewBox="0 0 100 80" className="w-6 h-6 filter drop-shadow">
                                <path d="M10,65 L90,65 L85,25 L65,45 L50,15 L35,45 L15,25 Z" fill="#B5B8BC" />
                                <circle cx="10" cy="22" r="5" fill="#B5B8BC" />
                                <circle cx="50" cy="12" r="6" fill="#B5B8BC" />
                                <circle cx="90" cy="22" r="5" fill="#B5B8BC" />
                                <path d="M15,65 L85,65 L82,72 L18,72 Z" fill="#8F9296" />
                            </svg>
                        </div>
                    );
                }
                if (rank === 3) {
                    return (
                        <div className="relative w-6 h-6 flex items-center justify-center shrink-0">
                            <svg viewBox="0 0 100 80" className="w-6 h-6 filter drop-shadow">
                                <path d="M10,65 L90,65 L85,25 L65,45 L50,15 L35,45 L15,25 Z" fill="#A46738" />
                                <circle cx="10" cy="22" r="5" fill="#A46738" />
                                <circle cx="50" cy="12" r="6" fill="#A46738" />
                                <circle cx="90" cy="22" r="5" fill="#A46738" />
                                <path d="M15,65 L85,65 L82,72 L18,72 Z" fill="#824E24" />
                            </svg>
                        </div>
                    );
                }
                return (
                    <div className="relative w-6 h-6 flex items-center justify-center shrink-0">
                        <svg viewBox="0 0 100 100" className="w-5 h-5 filter drop-shadow">
                            <polygon points="50,5 64,36 98,39 72,62 80,95 50,77 20,95 28,62 2,39 36,36" fill="#737C75" />
                        </svg>
                    </div>
                );
            }

            function GreyFourPointStar({ className = "w-4 h-4" }) {
                return (
                    <svg viewBox="0 0 24 24" className={`${className} shrink-0 fill-[#737C75] inline-block`}>

            function BackupModal({ events, schedules, userProfile, onClose, onImport, showAlert }) {
                const fileInputRef = useRef(null);

                const handleExport = () => {
                    const data = {
                        version: 'liveecho_v12',
                        exportDate: new Date().toISOString(),
                        events,
                        schedules,
                        userProfile
                    };
                    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data, null, 2));
                    const downloadAnchor = document.createElement('a');
                    downloadAnchor.setAttribute("href", dataStr);
                    downloadAnchor.setAttribute("download", `liveu_backup_${new Date().toISOString().slice(0, 10)}.json`);
                    document.body.appendChild(downloadAnchor);
                    downloadAnchor.click();
                    downloadAnchor.remove();
                    showAlert('備份資料匯出成功');
                };

                const handleImportFile = (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        try {
                            const importedData = JSON.parse(event.target.result);
                            if (importedData.events || importedData.schedules || importedData.userProfile) {
                                onImport(importedData);
                                showAlert('資料備份匯入成功');
                                onClose();
                            } else {
                                alert('無效的備份檔案格式！');
                            }
                        } catch (err) {
                            alert('解析備份檔案失敗，請確認檔案格式是否正確。');
                        }
                    };
                    reader.readAsText(file);
                };

                return (
                    <div className="modal-overlay bg-black/85 flex items-center justify-center p-4 z-[999999]">

                            <div className="flex items-center justify-between pb-1 border-b border-[#D2CABF]">
                                <h3 className="font-extrabold text-sm flex items-center gap-1.5">
                                    <i data-lucide="database" className="w-4 h-4"></i> 資料備份與匯入
                                </h3>
                                <button onClick={onClose}><i data-lucide="x" className="w-5 h-5"></i></button>
                            </div>
                            <p className="text-xs text-[#737C75] leading-relaxed">
                                您可以將所有藝文紀錄、演出排程及個人設定導出為備份 JSON 檔案，或從先前備份的檔案恢復資料。
                            </p>
                            <div className="space-y-2 pt-2">
                                <button 
                                    onClick={handleExport}
                                    className="w-full py-3 rounded-2xl bg-[#C5AB89] text-[#161D15] text-xs font-extrabold flex items-center justify-center gap-2 shadow hover:bg-[#d5bc9a] transition-colors"
                                >
                                    <i data-lucide="download" className="w-4 h-4"></i> 匯出備份資料 JSON
                                </button>
                                <button 
                                    onClick={() => fileInputRef.current?.click()}
                                    className="w-full py-3 rounded-2xl bg-[#161D15] text-[#EFF0EA] text-xs font-extrabold flex items-center justify-center gap-2 shadow hover:bg-[#2A3626] transition-colors"
                                >
                                    <i data-lucide="upload" className="w-4 h-4"></i> 匯入備份資料 JSON
                                </button>
                                <input 
                                    type="file" 
                                    ref={fileInputRef} 
                                    onChange={handleImportFile} 
                                    accept=".json" 
                                    className="hidden" 
                                />

                            <button 
                                onClick={onClose}

                            </button>
                        </div>
                    </div>

            function App() {
                const [events, setEvents] = useState(() => {
                    try {
                        const saved = localStorage.getItem('liveecho_records_palette_v12');

                    } catch (e) { return []; }

                const [schedules, setSchedules] = useState(() => {
                    try {
                        const saved = localStorage.getItem('liveecho_schedules_v12');
                        return saved ? JSON.parse(saved) : [];
                    } catch (e) { return []; }
                });
                const [userProfile, setUserProfile] = useState(() => {
                    try {
                        const saved = localStorage.getItem('liveecho_user_profile_v12');
                        return saved ? JSON.parse(saved) : { name: 'LiveU', subtitle: 'say something', avatarUrl: '', initials: 'LU' };
                    } catch (e) { return { name: 'LiveU', subtitle: 'say something', avatarUrl: '', initials: 'LU' }; }

                const [activeTab, setActiveTab] = useState('archive');

                const [isAddModalOpen, setIsAddModalOpen] = useState(false);
                const [isAddScheduleModalOpen, setIsAddScheduleModalOpen] = useState(false);

                const [editingEvent, setEditingEvent] = useState(null);
                const [editingSchedule, setEditingSchedule] = useState(null);
                const [alertMsg, setAlertMsg] = useState(null);

                useEffect(() => {
                    try { localStorage.setItem('liveecho_records_palette_v12', JSON.stringify(events)); } catch (e) { alert('儲存空間不足，建議清理部分圖片記錄！'); }
                }, [events]);
                useEffect(() => { localStorage.setItem('liveecho_schedules_v12', JSON.stringify(schedules)); }, [schedules]);
                useEffect(() => { localStorage.setItem('liveecho_user_profile_v12', JSON.stringify(userProfile)); }, [userProfile]);
                
                useEffect(() => { 
                    if (window.lucide) {
                        try { window.lucide.createIcons(); } catch (e) {}
                    }

                const showAlert = (msg) => { setAlertMsg(msg); setTimeout(() => setAlertMsg(null), 3000); };

                const handleImportData = (data) => {
                    if (data.events) setEvents(data.events);
                    if (data.schedules) setSchedules(data.schedules);
                    if (data.userProfile) setUserProfile(data.userProfile);
                };

                const filteredEvents = useMemo(() => {
                    return events.filter(evt => {
                        const matchCategory = selectedCategory === 'all' || evt.type === selectedCategory;
                        const q = (searchQuery || '').toLowerCase().trim();
                        const matchSearch = (evt.title || '').toLowerCase().includes(q) || 
                                            (evt.venue || '').toLowerCase().includes(q) || 
                                            (evt.artist || '').toLowerCase().includes(q);
                        return matchCategory && matchSearch;
                    }).sort((a, b) => new Date(b.date) - new Date(a.date));
                }, [events, selectedCategory, searchQuery]);

                const stats = useMemo(() => {
                    const attended = events.filter(e => e.status === 'attended' || !e.status);
                    const currentYear = new Date().getFullYear();
                    
                    const yearlyMap = {};
                    let currentYearCost = 0;
                    let currentYearCount = 0;

                    events.forEach(e => {
                        const year = e.date ? parseInt(e.date.split('-')[0], 10) || currentYear : currentYear;
                        const cost = Number(e.cost) || 0;
                        if (!yearlyMap[year]) {
                            yearlyMap[year] = { year, count: 0, cost: 0 };
                        }
                        yearlyMap[year].count += 1;
                        yearlyMap[year].cost += cost;

                        if (year === currentYear) {
                            currentYearCount += 1;
                            currentYearCost += cost;
                        }
                    });

                    const yearlyList = Object.values(yearlyMap).sort((a, b) => b.year - a.year);
                    const totalCost = events.reduce((sum, e) => sum + (Number(e.cost) || 0), 0);
                    const categoryCounts = {
                        concert: events.filter(e => e.type === 'concert').length,
                        exhibition: events.filter(e => e.type === 'exhibition').length,
                        movie: events.filter(e => e.type === 'movie').length,
                        book: events.filter(e => e.type === 'book').length,
                        drama: events.filter(e => e.type === 'drama').length,
                    };
                    const uniqueArtistsCount = new Set(events.map(e => e.artist).filter(Boolean)).size;
                    return {
                        totalEvents: events.length,
                        attendedCount: attended.length,
                        totalCost,
                        currentYear,
                        currentYearCount,
                        currentYearCost,
                        yearlyList,
                        uniqueVenuesCount: new Set(attended.map(e => e.venue).filter(Boolean)).size,
                        uniqueCountriesCount: new Set(attended.map(e => e.countryName || '台灣').filter(Boolean)).size,
                        uniqueArtistsCount,
                        categoryCounts
                    };
                }, [events]);

                const handleSaveEvent = (data) => {
                    if (data.id) {
                        setEvents(events.map(e => e.id === data.id ? data : e));
                        
                    } else {
                        const created = { ...data, id: 'evt-' + Date.now() };
                        setEvents([created, ...events]);
                        
                    }
                    setEditingEvent(null);
                };

                const handleDeleteEvent = (id) => {
                    setEvents(events.filter(e => e.id !== id));
                    
                };

                const handleSaveSchedule = (data) => {
                    if (data.id) {
                        setSchedules(schedules.map(s => s.id === data.id ? data : s));
                        
                    } else {
                        setSchedules([{ ...data, id: 'sch-' + Date.now() }, ...schedules]);
                        
                    }
                    setEditingSchedule(null);
                };

                const handleDeleteSchedule = (id) => {
                    setSchedules(schedules.filter(s => s.id !== id));
                    
                };

                const getGoogleMapsUrl = (venue, address) => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${venue} ${address || ''}`)}`;

                const NAV_ITEMS = [
                    { id: 'archive', label: '藝文紀錄', icon: 'library' },
                    { id: 'schedule', label: '演出排程', icon: 'calendar-days' },
                    { id: 'map', label: '星跡map', icon: 'map-pin' },
                    { id: 'stats', label: '浩瀚星辰', icon: 'trophy' }

                return (

                                {userProfile.avatarUrl ? (
                                    <div className="w-8 h-8 rounded-lg overflow-hidden border border-[#C5AB89] relative bg-[#EBEBE9] flex items-center justify-center">
                                        <img src={userProfile.avatarUrl} alt="Avatar" className="w-full h-full object-cover" />
                                    </div>
                                ) : (
                                    <div className="w-8 h-8 rounded-lg bg-[#C5AB89] text-[#161D15] flex items-center justify-center font-black text-xs">{userProfile.initials || 'LU'}</div>
                                )}
                                <div>
                                    <h1 className="font-extrabold text-sm text-[#EFF0EA]">{userProfile.name}</h1>
                                    <p className="text-[9px] text-[#D2CABF] font-mono">{userProfile.subtitle}</p>
                                </div>
                            </button>

                                    <>
                                        <div className="flex bg-[#161D15] p-0.5 rounded-lg border border-[#737C75]/40">
                                            <button onClick={() => setViewMode('list')} className={`px-2.5 py-1 rounded-md text-[11px] ${viewMode === 'list' ? 'bg-[#C5AB89] text-[#161D15] font-bold' : 'text-[#D2CABF]'}`}>條列</button>
                                            <button onClick={() => setViewMode('calendar')} className={`px-2.5 py-1 rounded-md text-[11px] ${viewMode === 'calendar' ? 'bg-[#C5AB89] text-[#161D15] font-bold' : 'text-[#D2CABF]'}`}>月曆</button>
                                        </div>
                                        <button onClick={() => setIsAddModalOpen(true)} className="w-8 h-8 rounded-lg bg-[#C5AB89] text-[#161D15] flex items-center justify-center shadow"><i data-lucide="plus" className="w-4 h-4 font-black"></i></button>
                                    </>
                                )}
                                {activeTab === 'schedule' && (
                                    <button onClick={() => setIsAddScheduleModalOpen(true)} className="w-8 h-8 rounded-lg bg-[#C5AB89] text-[#161D15] flex items-center justify-center shadow"><i data-lucide="plus" className="w-4 h-4 font-black"></i></button>
                                )}
                                {activeTab === 'stats' && (
                                    <button onClick={() => setIsBackupModalOpen(true)} className="w-8 h-8 rounded-lg bg-[#737C75]/40 text-[#EFF0EA] flex items-center justify-center shadow hover:bg-[#737C75]/60 transition-colors" title="備份資料">
                                        <i data-lucide="database" className="w-4 h-4"></i>
                                    </button>
                                )}
                            </div>
                        </header>

                        {alertMsg && <div className="absolute top-20 left-1/2 -translate-x-1/2 z-50 bg-[#C5AB89] text-[#161D15] px-4 py-2 rounded-full text-xs font-bold shadow-2xl animate-bounce">{alertMsg}</div>}

                        <main className="flex-1 overflow-y-auto no-scrollbar relative flex flex-col">
                            {activeTab === 'archive' && <ArchiveSection events={filteredEvents} allEvents={events} selectedCategory={selectedCategory} setSelectedCategory={setSelectedCategory} searchQuery={searchQuery} setSearchQuery={setSearchQuery} viewMode={viewMode} onDelete={handleDeleteEvent} onEdit={(evt) => setEditingEvent(evt)} getGoogleMapsUrl={getGoogleMapsUrl} onOpenAddModal={() => setIsAddModalOpen(true)} />}
                            {activeTab === 'schedule' && <ScheduleSection schedules={schedules} onDelete={handleDeleteSchedule} onEdit={(sch) => setEditingSchedule(sch)} onSaveSchedule={handleSaveSchedule} getGoogleMapsUrl={getGoogleMapsUrl} onOpenAddModal={() => setIsAddScheduleModalOpen(true)} />}
                            {activeTab === 'map' && <LeafletMapSection events={events} stats={stats} getGoogleMapsUrl={getGoogleMapsUrl} onDelete={handleDeleteEvent} onEdit={(evt) => setEditingEvent(evt)} />}
                            {activeTab === 'stats' && <StatsSection stats={stats} events={events} />}
                        </main>

                        <nav className="bottom-nav-container w-full">
                            <div className="liquid-glass-bar p-1.5 flex items-center justify-around max-w-sm mx-auto shadow-2xl">
                                {NAV_ITEMS.map((item) => {
                                    const isActive = activeTab === item.id;
                                    return (
                                        <button
                                            key={item.id}
                                            onClick={() => setActiveTab(item.id)}
                                            className={`flex-1 flex flex-col items-center justify-center py-2 px-1 rounded-full transition-all duration-300 relative outline-none focus:outline-none focus-visible:outline-none border border-transparent ${

                                                    ? 'liquid-tab-active font-bold scale-105' 
                                                    : 'text-[#D2CABF]/70 hover:text-[#EFF0EA] active:scale-95'
                                            }`}
                                        >
                                            <i data-lucide={item.icon} className={`w-5 h-5 transition-transform duration-300 ${isActive ? 'scale-110 stroke-[2.2]' : 'stroke-[1.8]'}`}></i>

                                        </button>
                                    );
                                })}
                            </div>

                        {isEditProfileOpen && <EditProfileModal userProfile={userProfile} setUserProfile={setUserProfile} onClose={() => setIsEditProfileOpen(false)} showAlert={showAlert} />}
                        {(isAddModalOpen || editingEvent) && <AddEventModal initialData={editingEvent} onSave={handleSaveEvent} onClose={() => { setIsAddModalOpen(false); setEditingEvent(null); }} />}
                        {(isAddScheduleModalOpen || editingSchedule) && <AddScheduleModal initialData={editingSchedule} onSave={handleSaveSchedule} onDelete={handleDeleteSchedule} onClose={() => { setIsAddScheduleModalOpen(false); setEditingSchedule(null); }} />}
                    </div>
                );
            }

                const [name, setName] = useState(userProfile.name);
                const [subtitle, setSubtitle] = useState(userProfile.subtitle);
                const [avatarUrl, setAvatarUrl] = useState(userProfile.avatarUrl);

                const fileRef = useRef(null);

                const handleFileChange = (e) => {

                            setCropSource(evt.target.result);

                            </div>

                        {cropSource && (

                                    setCropSource(null);
                                }}
                                onCancel={() => setCropSource(null)}
                            />
                        )}

function AddEventModal({ initialData, onSave, onClose }) {
                const [title, setTitle] = useState(initialData?.title || '');
                const [type, setType] = useState(initialData?.type || 'concert');
                const [date, setDate] = useState(initialData?.date || new Date().toISOString().slice(0, 10));
                const [time, setTime] = useState(initialData?.time || '19:30');

                const [venueAddress, setVenueAddress] = useState(initialData?.venueAddress || '');
                const [artist, setArtist] = useState(initialData?.artist || '');
                const [city, setCity] = useState(initialData?.city || '台北');
                const [countryName, setCountryName] = useState(initialData?.countryName || '台灣');
                const [cost, setCost] = useState(initialData?.cost || '');
                const [detailSeat, setDetailSeat] = useState(initialData?.detailSeat || '');
                const [spotifyUrl, setSpotifyUrl] = useState(initialData?.spotifyUrl || '');
                const [notes, setNotes] = useState(initialData?.notes || '');
                const [coverImg, setCoverImg] = useState(initialData?.coverImg || '');
                const [extraImgs, setExtraImgs] = useState(initialData?.extraImgs || []);
                
                const [cropSource, setCropSource] = useState(null);
                const [cropTarget, setCropTarget] = useState('cover');

                const [lat, setLat] = useState(initialData?.lat || null);
                const [lng, setLng] = useState(initialData?.lng || null);

                const fileRef = useRef(null);
                const extraFileRef = useRef(null);

                const handleFileChange = (e) => {
                    if (e.target.files && e.target.files[0]) {
                        const file = e.target.files[0];
                        const reader = new FileReader();
                        reader.onload = (evt) => {
                            setCropTarget('cover');
                            setCropSource(evt.target.result);
                        };
                        reader.readAsDataURL(file);
                        e.target.value = '';
                    }
                };

                const handleExtraFileChange = (e) => {
                    if (e.target.files && e.target.files[0]) {
                        const file = e.target.files[0];
                        const reader = new FileReader();
                        reader.onload = (evt) => {
                            setCropTarget('extra');
                            setCropSource(evt.target.result);
                        };
                        reader.readAsDataURL(file);
                        e.target.value = '';
                    }
                };

                const removeExtraImg = (index) => {
                    setExtraImgs(extraImgs.filter((_, i) => i !== index));

            function LeafletMapSection({ events, stats, getGoogleMapsUrl, onDelete, onEdit }) {
                const mapRef = useRef(null);
                const mapInst = useRef(null);
                const markersLayerRef = useRef(L.layerGroup());
                const activeLayerRef = useRef(null);
                const geoJsonLayerRef = useRef(null);
                const [selectedCountry, setSelectedCountry] = useState(null);

                const countryMap = useMemo(() => {
                    const m = {};
                    events.forEach(e => {
                        if (e.status === 'wishlist') return;
                        const c = e.countryName || '台灣';
                        if (!m[c]) m[c] = { name: c, events: [], venues: new Set() };
                        m[c].events.push(e);
                        if (e.venue) m[c].venues.add(e.venue);
                    });
                    return m;
                }, [events]);

                const visited = useMemo(() => Object.keys(countryMap), [countryMap]);
                const venueCounts = useMemo(() => {
                    const counts = {};
                    events.forEach(e => {
                        if (e.venue) {
                            counts[e.venue] = (counts[e.venue] || 0) + 1;
                        }
                    });
                    return counts;
                }, [events]);

                useEffect(() => {
                    if (!mapRef.current) return;
                    if (!mapInst.current) {
                        const southWest = L.latLng(-85, -180);
                        const northEast = L.latLng(85, 180);
                        const bounds = L.latLngBounds(southWest, northEast);

                        const map = L.map(mapRef.current, { 
                            zoomControl: false, 
                            attributionControl: false, 
                            minZoom: 2,
                            maxBounds: bounds,
                            maxBoundsViscosity: 1.0
                        }).setView([25.033, 121.565], 3);

                        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { 
                            maxZoom: 19, 
                            noWrap: true,
                            bounds: bounds
                        }).addTo(map);

                        markersLayerRef.current.addTo(map);
                        mapInst.current = map;

                        fetch('https://raw.githubusercontent.com/datasets/geo-boundaries-world-110m/master/countries.geojson')
                            .then(res => res.json())
                            .then(data => {
                                const layer = L.geoJSON(data, {
                                    style: (feature) => {
                                        const p = feature.properties || {};
                                        const name = COUNTRY_NAME_MAPPING[p.name || p.ADMIN] || p.name || '';
                                        const isV = visited.some(v => name.includes(v));
                                        return { fillColor: isV ? '#C2A175' : '#1A2218', fillOpacity: isV ? 0.45 : 0.2, color: isV ? '#C5AB89' : '#2A3626', weight: isV ? 1.5 : 0.8 };
                                    },
                                    onEachFeature: (feature, layer) => {
                                        const p = feature.properties || {};
                                        const zh = COUNTRY_NAME_MAPPING[p.name || p.ADMIN] || p.name || '區域';
                                        layer.on({
                                            click: (e) => {
                                                L.DomEvent.stopPropagation(e);
                                                if (activeLayerRef.current && geoJsonLayerRef.current) {
                                                    geoJsonLayerRef.current.resetStyle(activeLayerRef.current);
                                                }
                                                activeLayerRef.current = e.target;
                                                e.target.setStyle({ fillColor: '#FFC800', fillOpacity: 0.75, color: '#FFFFFF', weight: 2.5 });
                                                const match = visited.find(v => zh.includes(v));
                                                setSelectedCountry(match ? countryMap[match] : { name: zh, events: [], venues: new Set() });
                                            }
                                        });
                                    }
                                }).addTo(map);
                                geoJsonLayerRef.current = layer;
                            }).catch(() => {});
                    }

                    const timer = requestAnimationFrame(() => {
                        if (mapInst.current) mapInst.current.invalidateSize();
                    });

                    return () => { 
                        cancelAnimationFrame(timer);
                    };
                }, []);

                useEffect(() => {
                    if (!mapInst.current) return;
                    markersLayerRef.current.clearLayers();

                    events.forEach((evt) => {
                        const latVal = parseFloat(evt.lat);
                        const lngVal = parseFloat(evt.lng);

                        if (isNaN(latVal) || isNaN(lngVal)) return;
 
                        const visitCount = evt.venue ? (venueCounts[evt.venue] || 1) : 1;

                        const marker = L.marker([latVal, lngVal], {

            function ScheduleSection({ schedules, onDelete, onEdit, onSaveSchedule, getGoogleMapsUrl, onOpenAddModal }) {

            function StatsSection({ stats, events }) {
                const [imgError, setImgError] = useState(false);
                const [isCardActive, setIsCardActive] = useState(false);

                // 計算藝人排名 (Top Artists)
                const artistRankings = useMemo(() => {
                    const counts = {};
                    const avatarMap = {};
                    events.forEach(e => {
                        if (e.artist) {
                            counts[e.artist] = (counts[e.artist] || 0) + 1;
                            if (e.coverImg && !avatarMap[e.artist]) {
                                avatarMap[e.artist] = e.coverImg;
                            }
                        }
                    });
                    return Object.entries(counts)
                        .map(([artist, count]) => ({ 
                            artist, 
                            count, 
                            avatar: avatarMap[artist] || null 
                        }))
                        .sort((a, b) => b.count - a.count);
                }, [events]);

                // 1. 設定排排名判斷邏輯
                const isArtistOfTheYearVisible = useMemo(() => {
                   const topArtist = artistRankings[0]; 
                   return topArtist && topArtist.count >= 3;
                }, [artistRankings]);

                // 計算場館排名 (Top Venues)
                const venueRankings = useMemo(() => {
                    const counts = {};
                    events.forEach(e => {
                        if (e.venue) {
                            counts[e.venue] = (counts[e.venue] || 0) + 1;
                        }
                    });
                    return Object.entries(counts)
                        .map(([venue, count]) => ({ venue, count }))
                        .sort((a, b) => b.count - a.count);
                }, [events]);

                // 計算最高次數場館，供長條圖比例計算
                const maxVenueCount = useMemo(() => {
                    if (venueRankings.length === 0) return 1;
                    return Math.max(...venueRankings.map(v => v.count), 1);
                }, [venueRankings]);

                // 年度藝人數據
                const topArtistObj = artistRankings[0] || null;

                // 觸發彩帶/煙火動畫與卡片點擊反饋
                const triggerFireworks = (e) => {
                    setIsCardActive(true);
                    setTimeout(() => setIsCardActive(false), 200);

                    if (typeof window.confetti === 'function') {
                        const rect = e.currentTarget.getBoundingClientRect();
                        const x = (rect.left + rect.width / 2) / window.innerWidth;
                        const y = (rect.top + rect.height / 2) / window.innerHeight;

                        window.confetti({
                            particleCount: 80,
                            spread: 70,
                            origin: { x, y },
                            colors: ['#C5AB89', '#EFF0EA', '#FFC800', '#D2CABF', '#E5A912']
                        });
                    }
                };

                return (
                    <div className="p-4 pb-12 space-y-4">
                        {isArtistOfTheYearVisible && (
                            <div className="space-y-2">
                                <div className="flex items-center justify-between">
                                    <h3 className="font-extrabold text-sm text-[#C5AB89] flex items-center gap-1.5">
                                        <img src="image/icons/crown.png" alt="icon" className="w-6 h-6 object-contain inline-block" /> 2026 年度藝人
                                </h3>
                            </div>

                            <div 
                                onClick={triggerFireworks}
                                className={`relative w-full bg-[#121812] border border-[#C5AB89]/50 rounded-3xl p-4 shadow-2xl overflow-hidden cursor-pointer glow-gold transition-all duration-200 ${
                                    isCardActive ? 'scale-95' : 'hover:scale-[1.01]'
                                }`}
                            >
                                {/* 裝飾背景微光 */}
                                <div className="absolute -top-12 -right-12 w-32 h-32 bg-[#C5AB89]/15 rounded-full blur-2xl pointer-events-none"></div>

                                {/* 拍立得 1:1 照片相框 */}
                                <div className="relative w-full aspect-square rounded-2xl overflow-hidden bg-[#1A2218] border border-[#C5AB89]/30 shadow-inner flex items-center justify-center">
                                    {!imgError ? (
                                        <img 
                                            src="./images/artists/artist-of-the-year.jpg" 
                                            alt={topArtistObj ? topArtistObj.artist : "年度藝人"}
                                            onError={() => setImgError(true)}
                                            className="w-full h-full object-cover transition-transform duration-500 hover:scale-105"
                                        />
                                    ) : topArtistObj && topArtistObj.avatar ? (
                                        <img 
                                            src={topArtistObj.avatar} 
                                            alt={topArtistObj.artist}
                                            className="w-full h-full object-cover"
                                        />
                                    ) : (
                                        <div className="flex flex-col items-center justify-center p-4 text-center space-y-2">
                                            <div className="w-16 h-16 rounded-full bg-[#C5AB89]/20 flex items-center justify-center text-[#C5AB89] font-black text-xl border border-[#C5AB89]/40">
                                                {topArtistObj ? topArtistObj.artist.slice(0, 1) : "🌟"}
                                            </div>
                                            <span className="text-xs font-bold text-[#EFF0EA]">
                                                {topArtistObj ? topArtistObj.artist : "尚無年度藝人紀錄"}
                                            </span>
                                            <span className="text-[9px] text-[#737C75]">放置 artist-of-the-year.jpg 於相對路徑資料夾</span>
                                        </div>
                                    )}

                                    {/* 相片內右上角標籤 */}
                                    <div className="absolute top-3 right-3 bg-[#161D15]/80 backdrop-blur-md px-2.5 py-1 rounded-full border border-[#C5AB89]/40 text-[10px] font-black text-[#C5AB89] shadow-md">
                                        2026 TOP 1
                                    </div>
                                </div>

                                {/* 卡片下半部文字資訊 */}
                                <div className="mt-3.5 flex items-center justify-between px-1">
                                    <div className="min-w-0 flex-1 pr-2">
                                        <div className="text-[10px] font-extrabold text-[#C5AB89] tracking-wider uppercase">Most Played Artist</div>
                                        <h2 className="text-base font-black text-[#EFF0EA] truncate mt-0.5">
                                            {topArtistObj ? topArtistObj.artist : "尚未產生"}
                                        </h2>
                                    </div>
                                    <div className="bg-[#C5AB89] text-[#161D15] px-3 py-1.5 rounded-2xl font-black text-xs shrink-0 shadow-md">
                                        {topArtistObj ? `${topArtistObj.count} 場演唱會` : "0 場"}
                                    </div>
                                </div>
                            </div>
                        </div>
                        )}
                        {/* 2. 藝人次數排名 (Top Artists) */}
                        <div className="bg-[#EFF0EA] text-[#161D15] rounded-3xl p-4 shadow-lg border border-[#D2CABF] space-y-3">
                            <div className="flex items-center justify-between border-b border-[#D2CABF]/60 pb-2">
                                <h3 className="font-extrabold text-sm text-[#161D15] flex items-center gap-1.5">
                                    <GreyFourPointStar className="w-4 h-4" /> 藝人次數排名 Top 5
                                </h3>
                                <span className="text-[10px] text-[#737C75] font-mono">共 {stats.uniqueArtistsCount} 位藝人</span>
                            </div>

                            <div className="space-y-2 pt-1">
                                {artistRankings.length === 0 ? (
                                    <p className="text-xs text-[#737C75] text-center py-4">尚無藝人參戰紀錄</p>
                                ) : (
                                    artistRankings.slice(0, 5).map((item, idx) => {
                                        const rank = idx + 1;
                                        return (
                                            <div key={item.artist} className="bg-white p-2.5 rounded-2xl border border-[#D2CABF]/60 flex items-center justify-between text-xs shadow-sm">
                                                <div className="flex items-center gap-2.5 min-w-0 flex-1">
                                                    <RankIcon rank={rank} />
                                                    <div className="w-8 h-8 rounded-full overflow-hidden bg-[#EBEBE9] border border-[#D2CABF] shrink-0 flex items-center justify-center font-bold text-[#161D15]">
                                                        {item.avatar ? (
                                                            <img src={item.avatar} alt={item.artist} className="w-full h-full object-cover" />
                                                        ) : (
                                                            item.artist.slice(0, 1)
                                                        )}
                                                    </div>
                                                    <span className="font-extrabold text-[#161D15] truncate">{item.artist}</span>
                                                </div>
                                                <div className="font-mono font-black text-[11px] bg-[#EBEBE9] px-2.5 py-1 rounded-xl shrink-0 text-[#161D15]">
                                                    觀看 {item.count} 次
                                                </div>
                                            </div>
                                        );
                                    })
                                )}
                            </div>
                        </div>

                        {/* 3. 場館次數排名 (Top Venues - Bar Chart) */}
                        <div className="bg-[#EFF0EA] text-[#161D15] rounded-3xl p-4 shadow-lg border border-[#D2CABF] space-y-3">
                            <div className="flex items-center justify-between border-b border-[#D2CABF]/60 pb-2">
                                <h3 className="font-extrabold text-sm text-[#161D15] flex items-center gap-1.5">
                                    <GreyFourPointStar className="w-4 h-4" /> 場館次數排名
                                </h3>
                                <span className="text-[10px] text-[#737C75] font-mono">共 {stats.uniqueVenuesCount} 個場館</span>
                            </div>

                            <div className="space-y-2.5 pt-1">
                                {venueRankings.length === 0 ? (
                                    <p className="text-xs text-[#737C75] text-center py-4">尚無場館紀錄</p>
                                ) : (
                                    venueRankings.slice(0, 5).map((item, idx) => {
                                        const pct = Math.round((item.count / maxVenueCount) * 100);
                                        return (
                                            <div key={item.venue} className="space-y-1">
                                                <div className="flex items-center justify-between text-xs font-bold">
                                                <div className="flex items-center gap-1 min-w-0">
                                                <img src="./image/icons/favourite.png" alt="場館名稱" className="w-3.5 h-3.5 object-contain shrink-0" />
                                                    <span className="truncate max-w-[200px] text-[#161D15]"> {item.venue}</span>
                                                </div>    
                                                <span className="font-mono text-[11px] text-[#737C75] shrink-0">{item.count} 次</span>

                                                </div>

                                                <div className="w-full bg-[#EBEBE9] h-2.5 rounded-full overflow-hidden border border-[#D2CABF]/40">
                                                    <div 
                                                        className="bg-[#C5AB89] h-full rounded-full transition-all duration-500" 
                                                        style={{ width: `${pct}%` }}
                                                    ></div>
                                                </div>
                                            </div>
                                        );
                                    })
                                )}
                            </div>
                        </div>

                        {/* 4. 總藝文紀錄與總累積花費 */}
                        <div className="grid grid-cols-2 gap-3">
                            <div className="bg-[#EFF0EA] text-[#161D15] rounded-3xl p-4 shadow-lg border border-[#D2CABF] space-y-1">
                                <div className="text-[10px] font-extrabold text-[#737C75]"><GreyFourPointStar className="w-4 h-4" /> 總藝文紀錄</div>
                                <div className="font-mono text-2xl font-black text-[#161D15]">{stats.attendedCount} <span className="text-xs font-normal">場</span></div>
                                <div className="text-[9px] text-[#737C75]">今年度：{stats.currentYearCount} 場</div>
                            </div>
                            <div className="bg-[#EFF0EA] text-[#161D15] rounded-3xl p-4 shadow-lg border border-[#D2CABF] space-y-1">
                                <div className="text-[10px] font-extrabold text-[#737C75]"><GreyFourPointStar className="w-4 h-4" /> 總累積花費</div>
                                <div className="font-mono text-xl font-black text-[#161D15] truncate">NT$ {stats.totalCost.toLocaleString()}</div>
                                <div className="text-[9px] text-[#737C75]">今年度：NT$ {stats.currentYearCost.toLocaleString()}</div>
                            </div>
                        </div>

                        {/* 5. 類別佔比分析 */}
                        <div className="bg-[#EFF0EA] text-[#161D15] rounded-3xl p-4 shadow-lg border border-[#D2CABF] space-y-3">
                            <div className="flex items-center justify-between border-b border-[#D2CABF]/60 pb-2">
                                <h3 className="font-extrabold text-sm text-[#161D15] flex items-center gap-1.5">
                                    <GreyFourPointStar className="w-4 h-4" /> 類別佔比分析
                                </h3>
                            </div>
                            <div className="space-y-2 pt-1">
                                {Object.entries(CATEGORIES).map(([key, cat]) => {
                                    const count = stats.categoryCounts[key] || 0;
                                    const pct = stats.totalEvents > 0 ? Math.round((count / stats.totalEvents) * 100) : 0;
                                    return (
                                        <div key={key} className="space-y-1">
                                            <div className="flex items-center justify-between text-xs font-bold">
                                                <span className="flex items-center gap-1 text-[#161D15]">
                                                    <CategoryIcon cat={cat} sizeClass="w-3.5 h-3.5" />
                                                    {cat.label}
                                                </span>
                                                <span className="font-mono text-[11px] text-[#737C75]">{count} 場</span>
                                            </div>
                                            <div className="w-full bg-[#EBEBE9] h-2 rounded-full overflow-hidden border border-[#D2CABF]/40">
                                                <div className="bg-[#C5AB89] h-full rounded-full transition-all duration-500" style={{ width: `${pct}%` }}></div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    </div>
                );
            }

            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
        } catch (e) {
            console.error("App Render Error:", e);
        }
    </script>
</body>
</html>
