<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiveU - 藝文紀錄 & 演出追蹤 iOS App</title>
    <!-- iOS 全螢幕 App 必備關鍵標籤 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="LiveU">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#161D15">

    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="icon-180.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        palette: {
                            taupe: '#CCB9AA',
                            offwhite: '#EFF0EA',
                            lightgrey: '#E1E1DF',
                            sage: '#737C75',
                            dustrose: '#AB8C83',
                            camel: '#C5AB89',
                            beige: '#D2CABF',
                            cardbg: '#F8F8F8',
                            softgrey: '#EBEBE9',
                            darkslate: '#161D15',
                        }
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <style>
        *, *::before, *::after {
            box-sizing: border-box !important;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            max-width: 100vw;
            overflow-x: hidden !important;
            background-color: #161D15;
            color: #EFF0EA;
            font-size: 14px;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow-x: hidden !important;
            overflow-y: hidden;
            background-color: #161D15;
            max-width: 100vw;
            width: 100%;
            position: relative;
        }

        header, .app-header {
            position: relative;
            z-index: 1000 !important;
            padding-top: calc(env(safe-area-inset-top, 16px) + 8px) !important;
            background-color: #121212 !important;
            border-bottom: 1px solid rgba(115, 124, 117, 0.3);
            flex-shrink: 0;
        }

        .top-stats-card {
            z-index: 999 !important;
        }

        #map-wrapper {
            flex: 1;
            width: 100%;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            z-index: 1 !important;
        }

        #map {
            width: 100% !important;
            height: 100% !important;
            z-index: 1 !important;
            background: #000000 !important;
        }

        footer, .bottom-nav {
            flex-shrink: 0;
            z-index: 1000 !important;
        }

        .app-safe-bottom {
            padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)) !important;
        }

        .ios-glass {
            background: rgba(22, 29, 21, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .leaflet-container {
            background: #000000 !important;
            font-family: inherit;
        }
        .leaflet-tile-pane { 
            filter: invert(100%) hue-rotate(180deg) brightness(85%) contrast(90%); 
        }

        .custom-numeric-marker {
            background: #C5AB89;
            border: 2px solid #EFF0EA;
            color: #161D15;
            font-weight: 900;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.7);
            font-size: 10px;
        }
        .custom-numeric-marker:hover {
            transform: scale(1.2);
        }

        .modal-overlay {
            position: fixed !important;
            inset: 0 !important;
            z-index: 99999 !important;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            width: 100vw !important;
            max-width: 100vw !important;
            height: 100vh !important;
            height: 100dvh !important;
            overflow-x: hidden !important;
            overflow-y: auto !important;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            box-sizing: border-box !important;
        }

        .form-row {
            display: flex !important;
            flex-wrap: wrap !important;
            width: 100% !important;
            gap: 6px !important;
            box-sizing: border-box !important;
            margin: 0 !important;
        }

        .form-group {
            flex: 1 1 calc(50% - 3px) !important;
            min-width: 0 !important;
            max-width: 100% !important;
            box-sizing: border-box !important;
        }

        .form-group.full {
            flex: 1 1 100% !important;
        }

        input, select, textarea {
            width: 100% !important;
            max-width: 100% !important;
            box-sizing: border-box !important;
            font-size: 13px !important;
        }
    </style>
</head>
<body class="bg-[#161D15] text-[#EFF0EA] font-sans antialiased min-h-screen select-none overflow-x-hidden max-w-[100vw]">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const CATEGORIES = {
            concert: { label: '演唱會', icon: 'music', emoji: '🎵', badgeBg: 'bg-[#C5AB89] text-[#161D15]' },
            exhibition: { label: '展覽', icon: 'palette', emoji: '🎨', badgeBg: 'bg-[#CCB9AA] text-[#161D15]' },
            movie: { label: '電影', icon: 'film', emoji: '🎬', badgeBg: 'bg-[#AB8C83] text-[#EFF0EA]' },
            book: { label: '書籍', icon: 'book-open', emoji: '📚', badgeBg: 'bg-[#D2CABF] text-[#161D15]' },
            drama: { label: '話劇/音樂劇', icon: 'theater', emoji: '🎭', badgeBg: 'bg-[#737C75] text-[#EFF0EA]' }
        };

        function App() {
            const [events, setEvents] = useState(() => {
                const saved = localStorage.getItem('liveecho_records_palette_v7');
                return saved ? JSON.parse(saved) : [];
            });
            const [schedules, setSchedules] = useState(() => {
                const saved = localStorage.getItem('liveecho_schedules_v7');
                return saved ? JSON.parse(saved) : [];
            });

            const [userProfile, setUserProfile] = useState(() => {
                const saved = localStorage.getItem('liveecho_user_profile_v7');
                return saved ? JSON.parse(saved) : { name: 'LiveU', subtitle: 'say something', avatarUrl: '', initials: 'LU' };
            });

            const [activeTab, setActiveTab] = useState('archive');
            const [viewMode, setViewMode] = useState('list');
            const [selectedCategory, setSelectedCategory] = useState('all');
            const [searchQuery, setSearchQuery] = useState('');
            const [selectedEventId, setSelectedEventId] = useState(null);

            const [isEditProfileOpen, setIsEditProfileOpen] = useState(false);
            const [isAddModalOpen, setIsAddModalOpen] = useState(false);
            const [isAddScheduleModalOpen, setIsAddScheduleModalOpen] = useState(false);
            const [alertMsg, setAlertMsg] = useState(null);

            useEffect(() => { localStorage.setItem('liveecho_records_palette_v7', JSON.stringify(events)); }, [events]);
            useEffect(() => { localStorage.setItem('liveecho_schedules_v7', JSON.stringify(schedules)); }, [schedules]);
            useEffect(() => { localStorage.setItem('liveecho_user_profile_v7', JSON.stringify(userProfile)); }, [userProfile]);
            
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            });

            const showAlert = (msg) => {
                setAlertMsg(msg);
                setTimeout(() => setAlertMsg(null), 2500);
            };

            const filteredEvents = useMemo(() => {
                return events.filter(evt => {
                    const matchCategory = selectedCategory === 'all' || evt.type === selectedCategory;
                    const q = searchQuery.toLowerCase();
                    const matchSearch = (evt.title || '').toLowerCase().includes(q) ||
                                        (evt.creator || '').toLowerCase().includes(q) ||
                                        (evt.venue || '').toLowerCase().includes(q) ||
                                        (evt.venueAddress || '').toLowerCase().includes(q);
                    return matchCategory && matchSearch;
                }).sort((a, b) => new Date(b.date) - new Date(a.date));
            }, [events, selectedCategory, searchQuery]);

            const selectedEvent = useMemo(() => {
                return events.find(e => e.id === selectedEventId) || filteredEvents[0] || null;
            }, [events, selectedEventId, filteredEvents]);

            const stats = useMemo(() => {
                const attendedEvents = events.filter(e => e.status === 'attended' || !e.status);
                const totalCost = events.reduce((sum, e) => sum + (Number(e.cost) || 0), 0);
                
                const uniqueVenues = new Set(attendedEvents.map(e => e.venue).filter(Boolean));
                const uniqueCountries = new Set(attendedEvents.map(e => e.countryCode || 'TW').filter(Boolean));

                return { 
                    totalEvents: events.length, 
                    attendedCount: attendedEvents.length,
                    totalCost, 
                    uniqueVenuesCount: uniqueVenues.size,
                    uniqueCountriesCount: uniqueCountries.size,
                    categoryCounts: {
                        concert: events.filter(e => e.type === 'concert').length,
                        exhibition: events.filter(e => e.type === 'exhibition').length,
                        movie: events.filter(e => e.type === 'movie').length,
                        book: events.filter(e => e.type === 'book').length,
                        drama: events.filter(e => e.type === 'drama').length,
                    }
                };
            }, [events]);

            const handleAddEvent = (newEvent) => {
                const created = { ...newEvent, id: 'evt-' + Date.now() };
                const updated = [created, ...events];
                setEvents(updated);
                setSelectedEventId(created.id);
                showAlert('已成功新增藝文紀錄');
            };

            const handleDeleteEvent = (id) => {
                const updated = events.filter(e => e.id !== id);
                setEvents(updated);
                if (selectedEventId === id && updated.length > 0) {
                    setSelectedEventId(updated[0].id);
                }
                showAlert('已刪除該筆紀錄');
            };

            const handleAddSchedule = (newSch) => {
                const created = { ...newSch, id: 'sch-' + Date.now() };
                const updated = [created, ...schedules];
                setSchedules(updated);
                showAlert('已成功新增演出排程');
            };

            const handleDeleteSchedule = (id) => {
                const updated = schedules.filter(s => s.id !== id);
                setSchedules(updated);
                showAlert('已刪除排程');
            };

            const getGoogleMapsUrl = (venue, address) => {
                const query = encodeURIComponent(`${venue} ${address || ''}`);
                return `https://www.google.com/maps/search/?api=1&query=${query}`;
            };

            return (
                <div className="app-container max-w-md mx-auto border-x border-[#737C75]/30 relative text-[#EFF0EA] shadow-2xl text-xs">
                    
                    <header className="app-header px-3 py-2 flex items-center justify-between shrink-0">
                        <button 
                            onClick={() => setIsEditProfileOpen(true)}
                            className="flex items-center gap-2 text-left group transition-all p-1 -ml-1 rounded-xl hover:bg-[#D2CABF]/10 active:scale-95"
                        >
                            <div className="relative">
                                {userProfile.avatarUrl ? (
                                    <img src={userProfile.avatarUrl} alt={userProfile.name} className="w-7 h-7 rounded-lg object-cover border border-[#C5AB89]" />
                                ) : (
                                    <div className="w-7 h-7 rounded-lg bg-[#C5AB89] text-[#161D15] flex items-center justify-center font-black text-[10px] shadow-md border border-[#CCB9AA]">
                                        {userProfile.initials || 'LE'}
                                    </div>
                                )}
                            </div>
                            <div>
                                <h1 className="font-extrabold text-xs tracking-tight text-[#EFF0EA] group-hover:text-[#C5AB89] transition-colors flex items-center gap-1">
                                    <span>{userProfile.name}</span>
                                </h1>
                                <p className="text-[8px] text-[#D2CABF] uppercase tracking-widest font-mono line-clamp-1">{userProfile.subtitle}</p>
                            </div>
                        </button>

                        <div className="flex items-center gap-1.5">
                            {activeTab === 'archive' && (
                                <>
                                    <div className="flex bg-[#161D15] p-0.5 rounded-lg border border-[#737C75]/40">
                                        <button onClick={() => setViewMode('list')} className={`px-2 py-0.5 rounded-md text-[10px] font-medium transition-all ${viewMode === 'list' ? 'bg-[#C5AB89] text-[#161D15] font-bold shadow' : 'text-[#D2CABF]'}`}>條列</button>
                                        <button onClick={() => setViewMode('calendar')} className={`px-2 py-0.5 rounded-md text-[10px] font-medium transition-all ${viewMode === 'calendar' ? 'bg-[#C5AB89] text-[#161D15] font-bold shadow' : 'text-[#D2CABF]'}`}>月曆</button>
                                    </div>
                                    <button 
                                        onClick={() => setIsAddModalOpen(true)}
                                        className="w-7 h-7 rounded-lg bg-[#C5AB89] text-[#161D15] flex items-center justify-center shadow hover:bg-[#CCB9AA] active:scale-95 transition-all text-xs"
                                        title="新增紀錄"
                                    >
                                        <i data-lucide="plus" className="w-3.5 h-3.5 font-black"></i>
                                    </button>
                                </>
                            )}
                            {activeTab === 'schedule' && (
                                <button 
                                    onClick={() => setIsAddScheduleModalOpen(true)}
                                    className="w-7 h-7 rounded-lg bg-[#C5AB89] text-[#161D15] flex items-center justify-center shadow hover:bg-[#CCB9AA] active:scale-95 transition-all text-xs"
                                    title="新增演出排程"
                                >
                                    <i data-lucide="plus" className="w-3.5 h-3.5 font-black"></i>
                                </button>
                            )}
                        </div>
                    </header>

                    {alertMsg && (
                        <div className="absolute top-16 left-1/2 -translate-x-1/2 z-50 bg-[#C5AB89] text-[#161D15] px-3 py-1 rounded-full text-[10px] font-bold shadow-2xl animate-bounce border border-[#CCB9AA]">
                            {alertMsg}
                        </div>
                    )}

                    <main className="flex-1 overflow-y-auto no-scrollbar relative flex flex-col">
                        {activeTab === 'archive' && (
                            <ArchiveSection 
                                events={filteredEvents} allEvents={events}
                                selectedCategory={selectedCategory} setSelectedCategory={setSelectedCategory}
                                searchQuery={searchQuery} setSearchQuery={setSearchQuery}
                                selectedEvent={selectedEvent} setSelectedEventId={setSelectedEventId}
                                viewMode={viewMode} onDelete={handleDeleteEvent}
                                getGoogleMapsUrl={getGoogleMapsUrl}
                                onOpenAddModal={() => setIsAddModalOpen(true)}
                            />
                        )}

                        {activeTab === 'schedule' && (
                            <ScheduleSection 
                                schedules={schedules} 
                                onDelete={handleDeleteSchedule}
                                getGoogleMapsUrl={getGoogleMapsUrl} 
                                onOpenAddModal={() => setIsAddScheduleModalOpen(true)}
                            />
                        )}
                        
                        {activeTab === 'map' && <LeafletMapSection events={events} stats={stats} getGoogleMapsUrl={getGoogleMapsUrl} />}
                        
                        {activeTab === 'stats' && <StatsSection stats={stats} events={events} />}
                    </main>

                    <nav className="bottom-nav ios-glass pt-2 px-3 flex items-center justify-around app-safe-bottom border-t border-[#737C75]/30">
                        <button onClick={() => setActiveTab('archive')} className={`flex flex-col items-center gap-0.5 transition-all ${activeTab === 'archive' ? 'text-[#C5AB89]' : 'text-[#737C75]'}`}>
                            <i data-lucide="library" className="w-4 h-4"></i>
                            <span className="text-[9px] font-medium">藝文紀錄</span>
                        </button>
                        <button onClick={() => setActiveTab('schedule')} className={`flex flex-col items-center gap-0.5 transition-all ${activeTab === 'schedule' ? 'text-[#C5AB89]' : 'text-[#737C75]'}`}>
                            <i data-lucide="calendar-days" className="w-4 h-4"></i>
                            <span className="text-[9px] font-medium">演出排程</span>
                        </button>
                        <button onClick={() => setActiveTab('map')} className={`flex flex-col items-center gap-0.5 transition-all ${activeTab === 'map' ? 'text-[#C5AB89]' : 'text-[#737C75]'}`}>
                            <i data-lucide="map-pin" className="w-4 h-4"></i>
                            <span className="text-[9px] font-medium">地圖足跡</span>
                        </button>
                        <button onClick={() => setActiveTab('stats')} className={`flex flex-col items-center gap-0.5 transition-all ${activeTab === 'stats' ? 'text-[#C5AB89]' : 'text-[#737C75]'}`}>
                            <i data-lucide="trophy" className="w-4 h-4"></i>
                            <span className="text-[9px] font-medium">成就統計</span>
                        </button>
                    </nav>

                    {isEditProfileOpen && (
                        <EditProfileModal userProfile={userProfile} setUserProfile={setUserProfile} onClose={() => setIsEditProfileOpen(false)} showAlert={showAlert} />
                    )}
                    {isAddModalOpen && (
                        <AddEventModal onAdd={handleAddEvent} onClose={() => setIsAddModalOpen(false)} />
                    )}
                    {isAddScheduleModalOpen && (
                        <AddScheduleModal onAdd={handleAddSchedule} onClose={() => setIsAddScheduleModalOpen(false)} />
                    )}
                </div>
            );
        }

        function EditProfileModal({ userProfile, setUserProfile, onClose, showAlert }) {
            const [name, setName] = useState(userProfile.name);
            const [subtitle, setSubtitle] = useState(userProfile.subtitle);
            const [avatarUrl, setAvatarUrl] = useState(userProfile.avatarUrl);
            const fileInputRef = useRef(null);

            const handleFileChange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => setAvatarUrl(reader.result);
                    reader.readAsDataURL(file);
                }
            };

            const handleSave = (e) => {
                e.preventDefault();
                const initials = name ? name.substring(0, 2).toUpperCase() : 'LE';
                setUserProfile({ name, subtitle, avatarUrl, initials });
                showAlert('更新成功');
                onClose();
            };

            return (
                <div className="modal-overlay bg-black/85">
                    <div className="bg-[#EFF0EA] text-[#161D15] w-full max-w-xs rounded-2xl p-4 shadow-2xl border border-[#D2CABF] space-y-3 my-auto text-xs">
                        <div className="flex items-center justify-between border-b border-[#D2CABF] pb-2">
                            <h3 className="font-extrabold text-xs text-[#161D15] flex items-center gap-1.5">
                                <i data-lucide="user-pen" className="w-3.5 h-3.5 text-[#737C75]"></i> 編輯個人檔案
                            </h3>
                            <button onClick={onClose} className="p-1 text-[#737C75] hover:text-[#161D15]"><i data-lucide="x" className="w-4 h-4"></i></button>
                        </div>
                        <form onSubmit={handleSave} className="space-y-3">
                            <div className="flex flex-col items-center gap-1.5">
                                <div className="relative group cursor-pointer" onClick={() => fileInputRef.current?.click()}>
                                    {avatarUrl ? (
                                        <img src={avatarUrl} alt="Avatar" className="w-16 h-16 rounded-xl object-cover border-2 border-[#C5AB89] shadow-sm" />
                                    ) : (
                                        <div className="w-16 h-16 rounded-xl bg-[#C5AB89] text-[#161D15] flex items-center justify-center font-black text-base shadow-sm border-2 border-[#CCB9AA]">
                                            {name ? name.substring(0, 2).toUpperCase() : 'LE'}
                                        </div>
                                    )}
                                </div>
                                <input type="file" ref={fileInputRef} onChange={handleFileChange} accept="image/*" className="hidden" />
                                <button type="button" onClick={() => fileInputRef.current?.click()} className="text-[10px] font-bold text-[#AB8C83] hover:underline">選擇大頭貼</button>
                            </div>
                            <div className="space-y-0.5">
                                <label className="text-[10px] font-bold text-[#737C75]">稱呼</label>
                                <input type="text" value={name} onChange={(e) => setName(e.target.value)} required className="bg-white text-[#161D15] px-2.5 py-1.5 rounded-lg text-xs font-medium border border-[#D2CABF]" />
                            </div>
                            <div className="space-y-0.5">
                                <label className="text-[10px] font-bold text-[#737C75]">簡介</label>
                                <input type="text" value={subtitle} onChange={(e) => setSubtitle(e.target.value)} className="bg-white text-[#161D15] px-2.5 py-1.5 rounded-lg text-xs font-medium border border-[#D2CABF]" />
                            </div>
                            <div className="flex gap-2 pt-1">
                                <button type="button" onClick={onClose} className="flex-1 py-2 rounded-xl bg-[#EBEBE9] text-[#161D15] font-bold text-[11px]">取消</button>
                                <button type="submit" className="flex-1 py-2 rounded-xl bg-[#161D15] text-[#EFF0EA] font-bold text-[11px]">儲存</button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        function AddEventModal({ onAdd, onClose }) {
            const [title, setTitle] = useState('');
            const [type, setType] = useState('concert');
            const [date, setDate] = useState(new Date().toISOString().slice(0, 10));
            const [venue, setVenue] = useState('');
            const [venueAddress, setVenueAddress] = useState('');
            const [city, setCity] = useState('台北');
            const [countryCode, setCountryCode] = useState('TW');
            const [countryName, setCountryName] = useState('台灣');
            const [cost, setCost] = useState('');
            const [detailSeat, setDetailSeat] = useState('');
            const [coverImg, setCoverImg] = useState('');
            const [notes, setNotes] = useState('');

            const handleSubmit = (e) => {
                e.preventDefault();
                let lat = 25.033, lng = 121.565;
                if(countryCode === 'JP') { lat = 35.68; lng = 139.76; }
                else if(countryCode === 'KR') { lat = 37.56; lng = 126.97; }
                else if(countryCode === 'US') { lat = 40.71; lng = -74.00; }
                else if(countryCode === 'AU') { lat = -37.81; lng = 144.96; }

                onAdd({
                    title, type, date,
                    venue: venue || '未指定場館',
                    venueAddress: venueAddress || venue || '台灣',
                    city: city || '台北',
                    countryCode, countryName, lat, lng,
                    status: 'attended',
                    cost: Number(cost) || 0,
                    detailSeat,
                    coverImg: coverImg || 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=800&q=80',
                    notes
                });
                onClose();
            };

            return (
                <div className="modal-overlay bg-black/85">

        function LeafletMapSection({ events, stats, getGoogleMapsUrl }) {
            const mapContainerRef = useRef(null);
            const mapInstanceRef = useRef(null);
            const [selectedCountryInfo, setSelectedCountryInfo] = useState(null);
            const [selectedEventModal, setSelectedEventModal] = useState(null);

            const countryEventsMap = useMemo(() => {
                const map = {};
                events.forEach(evt => {
                    if (evt.status === 'wishlist') return;
                    const code = evt.countryCode || 'TW';
                    if (!map[code]) {
                        map[code] = { code, name: evt.countryName || '台灣', events: [], venues: new Set() };
                    }
                    map[code].events.push(evt);
                    if (evt.venue) map[code].venues.add(evt.venue);
                });
                return map;
            }, [events]);

            const visitedCountryCodes = useMemo(() => Object.keys(countryEventsMap), [countryEventsMap]);

            useEffect(() => {
                if (!mapContainerRef.current) return;
                if (!mapInstanceRef.current) {
                    const map = L.map(mapContainerRef.current, { zoomControl: false, attributionControl: false, minZoom: 2 }).setView([25.033, 121.565], 3);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, noWrap: true }).addTo(map);
                    mapInstanceRef.current = map;

                    fetch('https://raw.githubusercontent.com/datasets/geo-boundaries-world-110m/master/countries.geojson')
                        .then(res => res.json())
                        .then(data => {
                            L.geoJSON(data, {
                                style: (feature) => {
                                    const props = feature.properties || {};
                                    const name = props.name || props.ADMIN || '';
                                    const iso = props.ISO_A2 || '';
                                    let isVisited = visitedCountryCodes.some(code => name.includes(code === 'TW' ? 'Taiwan' : code === 'JP' ? 'Japan' : 'Australia') || iso === code);
                                    return {
                                        fillColor: isVisited ? '#C2A175' : '#1A2218',
                                        fillOpacity: isVisited ? 0.45 : 0.2,
                                        color: isVisited ? '#C5AB89' : '#2A3626',
                                        weight: isVisited ? 1.5 : 0.8
                                    };
                                },
                                onEachFeature: (feature, layer) => {
                                    layer.on({
                                        click: (e) => {
                                            L.DomEvent.stopPropagation(e);
                                            const props = feature.properties || {};
                                            const name = props.name || props.ADMIN || '';
                                            const iso = props.ISO_A2 || '';
                                            let matchedCode = visitedCountryCodes.find(c => name.includes(c === 'TW' ? 'Taiwan' : c) || iso === c);
                                            if (matchedCode && countryEventsMap[matchedCode]) {
                                                setSelectedCountryInfo(countryEventsMap[matchedCode]);
                                            }
                                        }
                                    });
                                }
                            }).addTo(map);
                        }).catch(() => {});

                    events.forEach((evt, index) => {
                        if (!evt.lat || !evt.lng) return;
                        const customIcon = L.divIcon({ className: 'custom-div-icon', html: `<div class="custom-numeric-marker w-6 h-6">${index + 1}</div>`, iconSize: [24, 24], iconAnchor: [12, 12] });
                        const marker = L.marker([evt.lat, evt.lng], { icon: customIcon }).addTo(map);
                        marker.on('click', () => setSelectedEventModal(evt));
                    });
                    setTimeout(() => map.invalidateSize(), 100);
                }
                return () => {
                    if (mapInstanceRef.current) { mapInstanceRef.current.remove(); mapInstanceRef.current = null; }
                };
            }, [events, visitedCountryCodes]);

            return (
                <div id="map-wrapper" className="relative flex-1 w-full flex flex-col bg-[#000000] overflow-hidden">
                    <div className="absolute top-2.5 left-3 right-3 z-[999] flex items-center justify-between pointer-events-none">
                        <div className="ios-glass px-2.5 py-1 rounded-full shadow-md border border-[#737C75]/30 pointer-events-auto text-[10px]">
                            <span className="text-[#C5AB89] font-bold">🌍 足跡: </span>
                            <span className="text-[#EFF0EA]/80 font-mono"><strong className="text-[#C5AB89]">{stats.uniqueCountriesCount}</strong>國 · <strong className="text-[#C5AB89]">{stats.attendedCount}</strong>場</span>
                        </div>
                    </div>
                    <div ref={mapContainerRef} id="map" className="w-full h-full flex-1 bg-[#000000]"></div>
                    {selectedCountryInfo && (
                        <div className="absolute bottom-3 left-3 right-3 z-[1000]">
                            <div className="bg-[#EFF0EA] text-[#161D15] rounded-2xl p-3 shadow-xl border border-[#C5AB89] space-y-2 text-xs">
                                <div className="flex items-center justify-between">
                                    <h3 className="font-black text-xs text-[#161D15]">{selectedCountryInfo.name}</h3>
                                    <button onClick={() => setSelectedCountryInfo(null)} className="p-1"><i data-lucide="x" className="w-3.5 h-3.5"></i></button>
                                </div>
                                <p className="text-[11px] text-[#737C75]">共參加 {selectedCountryInfo.events.length} 場活動</p>
                            </div>
                        </div>
                    )}
                    {selectedEventModal && (
                        <EventDetailModal event={selectedEventModal} onClose={() => setSelectedEventModal(null)} onDelete={() => {}} getGoogleMapsUrl={getGoogleMapsUrl} />
                    )}
                </div>
            );
        }

        function ArchiveSection({ events, allEvents, selectedCategory, setSelectedCategory, searchQuery, setSearchQuery, viewMode, onDelete, getGoogleMapsUrl, onOpenAddModal }) {
            const [detailEvent, setDetailEvent] = useState(null);
            const [calendarDate, setCalendarDate] = useState(new Date());

            const year = calendarDate.getFullYear();
            const month = calendarDate.getMonth();

            const calendarDays = useMemo(() => {
                const firstDayIndex = new Date(year, month, 1).getDay();
                const totalDays = new Date(year, month + 1, 0).getDate();
                const days = [];
                for (let i = 0; i < firstDayIndex; i++) days.push(null);
                for (let i = 1; i <= totalDays; i++) {
                    const mStr = String(month + 1).padStart(2, '0');
                    const dStr = String(i).padStart(2, '0');
                    const dateStr = `${year}-${mStr}-${dStr}`;
                    const dayEvents = allEvents.filter(e => e.date === dateStr);
                    days.push({ day: i, dateStr, events: dayEvents });
                }
                return days;
            }, [year, month, allEvents]);

            return (
                <div className="space-y-3 p-3 pb-20 text-xs">
                    <div className="space-y-2">
                        <div className="relative">
                            <i data-lucide="search" className="w-3.5 h-3.5 absolute left-2.5 top-1/2 -translate-y-1/2 text-[#737C75]"></i>
                            <input type="text" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} placeholder="搜尋名稱、場館..." className="w-full bg-[#EFF0EA] text-[#161D15] placeholder-[#737C75] pl-8 pr-3 py-1.5 rounded-lg text-xs border border-[#D2CABF]" />
                        </div>
                        <div className="flex items-center gap-1 overflow-x-auto no-scrollbar pb-1">
                            <button onClick={() => setSelectedCategory('all')} className={`px-2.5 py-1 rounded-full text-[11px] font-bold whitespace-nowrap ${selectedCategory === 'all' ? 'bg-[#C5AB89] text-[#161D15]' : 'bg-[#EFF0EA] text-[#161D15]/80'}`}>
                                全部 ({allEvents.length})
                            </button>
                            {Object.entries(CATEGORIES).map(([catKey, cat]) => {
                                const count = allEvents.filter(e => e.type === catKey).length;
                                const isSelected = selectedCategory === catKey;
                                return (
                                    <button key={catKey} onClick={() => setSelectedCategory(catKey)} className={`px-2.5 py-1 rounded-full text-[11px] font-bold whitespace-nowrap ${isSelected ? `${cat.badgeBg}` : 'bg-[#EFF0EA] text-[#161D15]/80'}`}>
                                        {cat.emoji} {cat.label} ({count})
                                    </button>
                                );
                            })}
                        </div>
                    </div>

                    {viewMode === 'calendar' ? (
                        <div className="bg-[#EFF0EA] text-[#161D15] p-3 rounded-2xl shadow border border-[#D2CABF] space-y-2">
                            <div className="flex items-center justify-between">
                                <h3 className="font-extrabold text-xs font-mono">{year} 年 {month + 1} 月</h3>
                                <div className="flex gap-1">
                                    <button onClick={() => setCalendarDate(new Date(year, month - 1, 1))} className="p-1 rounded bg-[#EBEBE9]"><i data-lucide="chevron-left" className="w-3.5 h-3.5"></i></button>
                                    <button onClick={() => setCalendarDate(new Date(year, month + 1, 1))} className="p-1 rounded bg-[#EBEBE9]"><i data-lucide="chevron-right" className="w-3.5 h-3.5"></i></button>
                                </div>
                            </div>
                            <div className="grid grid-cols-7 gap-1 text-center font-bold text-[9px] text-[#737C75]">
                                <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
                            </div>
                            <div className="grid grid-cols-7 gap-1">
                                {calendarDays.map((item, idx) => {
                                    if (!item) return <div key={idx} className="h-8"></div>;
                                    const hasEvent = item.events.length > 0;
                                    return (
                                        <div key={idx} onClick={() => { if (hasEvent) setDetailEvent(item.events[0]); }} className={`h-8 rounded-lg flex flex-col items-center justify-center relative ${hasEvent ? 'bg-[#C5AB89] text-[#161D15] font-black cursor-pointer' : 'bg-[#EBEBE9] text-[#161D15]/50'}`}>
                                            <span className="text-[11px]">{item.day}</span>
                                            {hasEvent && <span className="w-1 h-1 rounded-full bg-[#161D15]"></span>}
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    ) : (
                        <div className="space-y-2.5">
                            {events.length === 0 ? (
                                <div className="text-center py-12 bg-[#EFF0EA]/5 border border-dashed border-[#737C75]/40 rounded-2xl p-4 space-y-2">
                                    <p className="text-xs text-[#EFF0EA] font-extrabold">暫無紀錄</p>
                                    <button onClick={onOpenAddModal} className="px-3 py-1.5 bg-[#C5AB89] text-[#161D15] rounded-lg font-bold text-[11px]">新增紀錄</button>
                                </div>
                            ) : (
                                events.map((evt) => {
                                    const cat = CATEGORIES[evt.type] || CATEGORIES.concert;
                                    return (
                                        <div key={evt.id} onClick={() => setDetailEvent(evt)} className="relative bg-[#EFF0EA] text-[#161D15] rounded-xl flex shadow overflow-hidden cursor-pointer hover:scale-[1.01] transition-all">
                                            <div className="absolute -left-2.5 top-1/2 -translate-y-1/2 w-5 h-5 bg-[#161D15] rounded-full z-20"></div>
                                            <div className="absolute -right-2.5 top-1/2 -translate-y-1/2 w-5 h-5 bg-[#161D15] rounded-full z-20"></div>
                                            <div className="flex-1 p-3 pl-4 flex gap-2.5 min-w-0 pr-3">
                                                <div className="w-12 h-16 rounded-lg overflow-hidden shrink-0 border border-[#D2CABF] bg-[#D2CABF]">
                                                    <img src={evt.coverImg} alt={evt.title} className="w-full h-full object-cover" />
                                                </div>
                                                <div className="flex-1 flex flex-col justify-between min-w-0">
                                                    <div className="space-y-0.5">
                                                        <div className="flex items-center justify-between text-[9px] font-mono text-[#737C75]">
                                                            <span>{evt.date}</span>
                                                        </div>
                                                        <h3 className="font-extrabold text-[11px] text-[#161D15] truncate">{evt.title}</h3>
                                                        <p className="text-[10px] text-[#737C75] truncate">📍 {evt.venue}</p>
                                                    </div>
                                                </div>
                                            </div>
                                            <div className="w-[72px] bg-[#EBEBE9] p-2 flex flex-col justify-between items-center text-center shrink-0 border-l border-[#D2CABF]/40">
                                                <span className="text-[7px] font-mono font-black text-[#737C75]">ADMIT ONE</span>
                                                <div className="font-mono text-[9px] font-black text-[#161D15]">{evt.cost ? `$${Number(evt.cost).toLocaleString()}` : 'FREE'}</div>
                                                <span className="text-[7px] font-bold text-[#161D15] bg-[#CCB9AA] px-1 py-0.5 rounded w-full truncate">已存檔</span>
                                            </div>
                                        </div>
                                    );
                                })
                            )}
                        </div>
                    )}
                    {detailEvent && (
                        <EventDetailModal event={detailEvent} onClose={() => setDetailEvent(null)} onDelete={onDelete} getGoogleMapsUrl={getGoogleMapsUrl} />
                    )}
                </div>
            );
        }

        function ScheduleSection({ schedules, onDelete, getGoogleMapsUrl, onOpenAddModal }) {
            return (
                <div className="p-3 pb-20 space-y-3 text-xs">
                    <div>
                        <h2 className="text-xs font-extrabold text-[#EFF0EA]">近期演出排程</h2>
                        <p className="text-[10px] text-[#D2CABF]">官方預告之演唱會與巡迴</p>
                    </div>
                    <div className="space-y-2.5">
                        {schedules.length === 0 ? (
                            <div className="text-center py-12 bg-[#EFF0EA]/5 border border-dashed border-[#737C75]/40 rounded-2xl p-4 space-y-2">
                                <p className="text-xs text-[#EFF0EA] font-extrabold">暫無排程</p>
                                <button onClick={onOpenAddModal} className="px-3 py-1.5 bg-[#C5AB89] text-[#161D15] rounded-lg font-bold text-[11px]">新增排程</button>
                            </div>
                        ) : (
                            schedules.map(sch => {
                                const mapsUrl = getGoogleMapsUrl(sch.venue, sch.venueAddress);
                                return (
                                    <div key={sch.id} className="relative bg-[#EFF0EA] text-[#161D15] rounded-xl flex overflow-hidden shadow">
                                        <div className="absolute -left-2.5 top-1/2 -translate-y-1/2 w-5 h-5 bg-[#161D15] rounded-full z-20"></div>
                                        <div className="absolute -right-2.5 top-1/2 -translate-y-1/2 w-5 h-5 bg-[#161D15] rounded-full z-20"></div>
                                        <div className="flex-1 p-3 pl-4 pr-2 space-y-1 min-w-0">
                                            <div className="flex items-center justify-between">
                                                <span className="text-[9px] font-mono text-[#161D15] font-extrabold px-1.5 py-0.5 rounded bg-[#C5AB89]">{sch.date}</span>
                                                <button onClick={() => onDelete(sch.id)} className="text-red-500 hover:text-red-700"><i data-lucide="trash-2" className="w-3 h-3"></i></button>
                                            </div>
                                            <h3 className="font-extrabold text-[11px] text-[#161D15] truncate">{sch.title}</h3>
                                            <p className="text-[10px] text-[#737C75] truncate">{sch.venue}</p>
                                        </div>
                                        <div className="w-20 bg-[#EBEBE9] p-2 flex flex-col justify-between items-center text-center shrink-0 border-l border-[#D2CABF]/40">
                                            <span className="font-mono text-[9px] font-black text-[#161D15]">{sch.priceRange}</span>
                                            <a href={sch.ticketLink} target="_blank" rel="noreferrer" className="w-full py-1 rounded bg-[#161D15] text-[#EFF0EA] font-extrabold text-[9px]">購票</a>
                                        </div>
                                    </div>
                                );
                            })
                        )}
                    </div>
                </div>
            );
        }

        function StatsSection({ stats, events }) {
            return (
                <div className="p-3 pb-20 space-y-3 text-xs">
                    <div>
                        <h2 className="text-xs font-extrabold text-[#EFF0EA]">成就統計</h2>
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                        <div className="bg-[#EFF0EA] text-[#161D15] p-3 rounded-2xl shadow border border-[#D2CABF]">
                            <span className="text-[9px] text-[#737C75] font-bold block">總紀錄</span>
                            <div className="font-mono font-black text-lg text-[#161D15]">{stats.totalEvents} <span className="text-[10px] font-normal">筆</span></div>
                        </div>
                        <div className="bg-[#EFF0EA] text-[#161D15] p-3 rounded-2xl shadow border border-[#D2CABF]">
                            <span className="text-[9px] text-[#737C75] font-bold block">總金額</span>
                            <div className="font-mono font-black text-sm text-[#161D15]">NT$ {stats.totalCost.toLocaleString()}</div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
