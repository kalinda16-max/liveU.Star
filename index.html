<body class="bg-[#161D15] text-[#EFF0EA] font-sans antialiased h-full select-none overflow-hidden max-w-[100vw]">
    <div id="root" class="h-full"></div>

    <script type="text/babel">

        try {
            const { useState, useEffect, useMemo, useRef, useCallback } = React;
            
            // --- 【請加在這裡】IndexedDB 封裝輔助函式 ---
            const DB_NAME = 'LiveU_DB';
            const STORE_NAME = 'app_data';

            function openDB() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open(DB_NAME, 1);
                    request.onerror = () => reject(request.error);
                    request.onsuccess = () => resolve(request.result);
                    request.onupgradeneeded = (event) => {
                        const db = event.target.result;
                        if (!db.objectStoreNames.contains(STORE_NAME)) {
                            db.createObjectStore(STORE_NAME);
                        }
                    };
                });
            }

            async function saveToIDB(key, value) {
                const db = await openDB();
                return new Promise((resolve, reject) => {
                    const transaction = db.transaction(STORE_NAME, 'readwrite');
                    const store = transaction.objectStore(STORE_NAME);
                    const request = store.put(value, key);
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
            }

            async function getFromIDB(key) {
                const db = await openDB();
                return new Promise((resolve, reject) => {
                    const transaction = db.transaction(STORE_NAME, 'readonly');
                    const store = transaction.objectStore(STORE_NAME);
                    const request = store.get(key);
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
            }
            // ---------------------------------------------

            const CATEGORIES = {
                concert: { label: '演唱會', icon: 'concert.png', emoji: '🎵', badgeBg: 'bg-[#A9B7AA] text-[#161D15]' },
                exhibition: { label: '展覽', icon: 'abstract.png', emoji: '🎨', badgeBg: 'bg-[#A9B7AA] text-[#161D15]' },
                movie: { label: '電影', icon: 'clapperboard.png', emoji: '🎬', badgeBg: 'bg-[#A9B7AA] text-[#161D15]' },
                book: { label: '見面會', icon: 'chant.png', emoji: '📚', badgeBg: 'bg-[#A9B7AA] text-[#161D15]' },
                drama: { label: '舞台劇', icon: 'theatre.png', emoji: '🎭', badgeBg: 'bg-[#A9B7AA] text-[#161D15]' }
            };

            const venueDb = window.VENUE_DATABASE || {};

            const COUNTRY_NAME_MAPPING = {
                'Taiwan': '台灣', 'TW': '台灣',
                'Japan': '日本', 'JP': '日本',
                'South Korea': '南韓', 'Korea': '南韓', 'KR': '南韓',
                'Korea, Republic of': '南韓',
                'Republic of Korea': '南韓',
                'United States': '美國', 'US': '美國', 'USA': '美國',
                'Australia': '澳大利亞', 'AU': '澳大利亞',
                'United Kingdom': '英國', 'GB': '英國', 'UK': '英國',
                'Thailand': '泰國', 'TH': '泰國',
                'China': '中國', 'CN': '中國',
                'Hong Kong': '香港', 'HK': '香港',
                'Singapore': '新加坡', 'SG': '新加坡',
                'Malaysia': '馬來西亞', 'MY': '馬來西亞'
            };

            const COUNTRY_CODE_BY_NAME = {
                '台灣': 'TW', 'Taiwan': 'TW', 'TW': 'TW',
                '日本': 'JP', 'Japan': 'JP', 'JP': 'JP',
                '南韓': 'KR', 'South Korea': 'KR', 'Korea': 'KR', 'KR': 'KR',
                '美國': 'US', 'United States': 'US', 'US': 'US', 'USA': 'US',
                '澳大利亞': 'AU', 'Australia': 'AU', 'AU': 'AU',
                '英國': 'GB', 'United Kingdom': 'GB', 'GB': 'GB', 'UK': 'GB',
                '泰國': 'TH', 'Thailand': 'TH', 'TH': 'TH',
                '中國': 'CN', 'China': 'CN', 'CN': 'CN',
                '香港': 'HK', 'Hong Kong': 'HK', 'HK': 'HK',
                '新加坡': 'SG', 'Singapore': 'SG', 'SG': 'SG',
                '馬來西亞': 'MY', 'Malaysia': 'MY', 'MY': 'MY'
            };

            function getCountryCode(name, fallbackCode = '') {
                const raw = (name || '').trim();
                return COUNTRY_CODE_BY_NAME[raw] ||
                    COUNTRY_CODE_BY_NAME[COUNTRY_NAME_MAPPING[raw]] ||
                    fallbackCode ||
                    raw.toLowerCase();
            }

            function getGeoCountryInfo(feature) {
                const p = feature?.properties || {};
                const rawName = p.ADMIN || p.NAME || p.name || p.SOVEREIGNT || '';
                const displayName = COUNTRY_NAME_MAPPING[rawName] || rawName || '區域';
                const code = getCountryCode(
                    displayName,
                    p.ISO_A2 && p.ISO_A2 !== '-99' ? p.ISO_A2 : (p.ISO_A2_EH || '')
                );
                return { rawName, displayName, code };
            }

            function countryNamesMatch(a, b) {
                return getCountryCode(a) === getCountryCode(b);
            }

            function resolveCountryInfo(countryInput) {
                const clean = (countryInput || '').trim().toLowerCase();
                if (clean.includes('台') || clean.includes('tw') || clean.includes('taiwan')) return { code: 'TW', name: '台灣', lat: 25.033, lng: 121.565 };
                if (clean.includes('日') || clean.includes('jp') || clean.includes('japan')) return { code: 'JP', name: '日本', lat: 35.676, lng: 139.650 };
                if (clean.includes('韓') || clean.includes('kr') || clean.includes('korea')) return { code: 'KR', name: '南韓', lat: 37.566, lng: 126.978 };
                if (clean.includes('美') || clean === 'us' || clean.includes('america')) return { code: 'US', name: '美國', lat: 40.712, lng: -74.006 };
                if (clean.includes('新加坡') || clean === 'sg' || clean.includes('singapore')) return { code: 'SG', name: '新加坡', lat: 1.3521, lng: 103.8198 };
                if (clean.includes('馬來西亞') || clean === 'my' || clean.includes('malaysia')) return { code: 'MY', name: '馬來西亞', lat: 3.139, lng: 101.6869 };
                return { code: 'OTHER', name: countryInput || '台灣', lat: 25.033, lng: 121.565 };
            }

            function parseSpotifyEmbedUrl(urlOrUri) {
                if (!urlOrUri) return null;
                let raw = urlOrUri.trim();
                if (raw.startsWith('spotify:')) {
                    const parts = raw.split(':');
                    if (parts.length >= 3) return `https://open.spotify.com/embed/${parts[1]}/${parts[2]}?utm_source=generator&theme=0`;
                }
                if (raw.includes('open.spotify.com')) {
                    try {
                        const urlObj = new URL(raw);
                        const pathSegments = urlObj.pathname.split('/').filter(Boolean);
                        if (pathSegments.length >= 2) return `https://open.spotify.com/embed/${pathSegments[0]}/${pathSegments[1]}?utm_source=generator&theme=0`;
                    } catch (e) {}
                }
                return null;
            }

            function CategoryIcon({ cat, sizeClass = "w-4 h-4", showFallback = true }) {
                if (cat && cat.icon && cat.icon.endsWith('.png')) {
                    return <img src={cat.icon} alt={cat.label} className={`${sizeClass} object-contain inline-block shrink-0`} />;
                }
                return showFallback ? <span>{cat?.emoji}</span> : null;
            }

            function CustomCategorySelect({ value, onChange }) {
                const [isOpen, setIsOpen] = useState(false);
                const dropdownRef = useRef(null);

                const selectedCat = CATEGORIES[value] || CATEGORIES.concert;

                useEffect(() => {
                    const handleClickOutside = (event) => {
                        if (dropdownRef.current && !dropdownRef.current.contains(event.target)) {
                            setIsOpen(false);
                        }
                    };
                    document.addEventListener('mousedown', handleClickOutside);
                    return () => document.removeEventListener('mousedown', handleClickOutside);
                }, []);

                return (
                    <div className="relative w-full" ref={dropdownRef}>
                        <button
                            type="button"
                            onClick={() => setIsOpen(!isOpen)}
                            className="w-full bg-white/[0.06] backdrop-blur-xl px-3 py-2 rounded-xl text-xs border border-[#C5AB89]/30 flex items-center justify-between shadow-[inset_0_1px_0_rgba(255,255,255,0.08),0_4px_12px_rgba(0,0,0,0.12)] active:scale-[0.99] transition-all hover:bg-white/[0.09]"
                        >
                            <div className="flex items-center gap-2">
                                <CategoryIcon cat={selectedCat} sizeClass="w-4 h-4" />
                                <span className="font-bold text-[#EFF0EA]">{selectedCat.label}</span>
                            </div>
                            <i data-lucide="chevron-down" className={`w-4 h-4 text-[#C5AB89] transition-transform duration-200 ${isOpen ? 'rotate-180' : ''}`}></i>
                        </button>

                        {isOpen && (
                            <div className="absolute top-full left-0 right-0 mt-1 bg-[#232B25]/85 backdrop-blur-2xl border border-[#C5AB89]/30 rounded-xl shadow-[0_8px_25px_rgba(0,0,0,0.35),inset_0_1px_0_rgba(255,255,255,0.08)] z-50 overflow-hidden py-1 max-h-48 overflow-y-auto no-scrollbar">
                                {Object.entries(CATEGORIES).map(([key, cat]) => {
                                    const isSelected = key === value;
                                    return (
                                        <div
                                            key={key}
                                            onClick={() => {
                                                onChange(key);
                                                setIsOpen(false);
                                            }}
                                            className={`flex items-center gap-2.5 px-3 py-2 text-xs font-bold cursor-pointer transition-colors ${
                                                isSelected ? 'bg-[#C5AB89]/20 text-[#EFF0EA]' : 'text-[#EFF0EA] hover:bg-white/[0.08]'
                                            }`}
                                        >
                                            <CategoryIcon cat={cat} sizeClass="w-4 h-4" />
                                            <span>{cat.label}</span>
                                            {isSelected && <i data-lucide="check" className="w-3.5 h-3.5 ml-auto text-[#C5AB89]"></i>}
                                        </div>
                                    );
                                })}
                            </div>
                        )}
                    </div>
                );
            }

            function ImageCropperModal({ imageSrc, initialAspectRatio = 1, onConfirm, onCancel }) {
                const imageRef = useRef(null);
                const cropperRef = useRef(null);
                const containerRef = useRef(null);

                useEffect(() => {
                    if (window.lucide) {
                        try { window.lucide.createIcons(); } catch (e) {}
                    }
                });

                useEffect(() => {
                    let touchStartAngle = 0;
                    let touchStartDist = 0;

                    const handleTouchStart = (e) => {
                        if (e.touches && e.touches.length === 2) {
                            const t1 = e.touches[0];
                            const t2 = e.touches[1];
                            touchStartDist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
                            touchStartAngle = Math.atan2(t2.clientY - t1.clientY, t2.clientX - t1.clientX) * (180 / Math.PI);
                        }
                    };

                    const handleTouchMove = (e) => {
                        if (e.touches && e.touches.length === 2 && cropperRef.current) {
                            const t1 = e.touches[0];
                            const t2 = e.touches[1];

                            const currentDist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
                            if (touchStartDist > 0) {
                                const distDiff = currentDist - touchStartDist;
                                if (Math.abs(distDiff) >= 4) {
                                    const zoomRatio = distDiff > 0 ? 0.04 : -0.04;
                                    cropperRef.current.zoom(zoomRatio);
                                    touchStartDist = currentDist;
                                }
                            }

                            const currentAngle = Math.atan2(t2.clientY - t1.clientY, t2.clientX - t1.clientX) * (180 / Math.PI);
                            let diff = currentAngle - touchStartAngle;
                            if (diff > 180) diff -= 360;
                            if (diff < -180) diff += 360;

                            if (Math.abs(diff) >= 2) {
                                cropperRef.current.rotate(Math.round(diff));
                                touchStartAngle = currentAngle;
                            }
                        }
                    };

                    const container = containerRef.current;
                    if (container) {
                        container.addEventListener('touchstart', handleTouchStart, { passive: true });
                        container.addEventListener('touchmove', handleTouchMove, { passive: true });
                    }

                    const initCropper = () => {
                        if (cropperRef.current) {
                            cropperRef.current.destroy();
                            cropperRef.current = null;
                        }
                        if (imageRef.current && window.Cropper) {
                            cropperRef.current = new window.Cropper(imageRef.current, {
                                aspectRatio: initialAspectRatio,
                                viewMode: 1,
                                dragMode: 'move',
                                autoCropArea: 0.85,
                                restore: false,
                                guides: true,
                                center: true,
                                highlight: false,
                                cropBoxMovable: true,
                                cropBoxResizable: true,
                                toggleDragModeOnDblclick: false,
                                zoomOnTouch: true,
                                zoomOnWheel: true,
                                wheelZoomRatio: 0.1,
                                touchDragMode: 'move',
                                rotatable: true,
                                scalable: true,
                                responsive: true,
                                background: false,
                                ready() {
                                    if (cropperRef.current) {
                                        cropperRef.current.resize();
                                    }
                                }
                            });
                        }
                    };

                    const img = imageRef.current;
                    if (img) {
                        if (img.complete) {
                            initCropper();
                        } else {
                            img.onload = initCropper;
                        }
                    }

                    return () => {
                        if (container) {
                            container.removeEventListener('touchstart', handleTouchStart);
                            container.removeEventListener('touchmove', handleTouchMove);
                        }
                        if (cropperRef.current) {
                            cropperRef.current.destroy();
                            cropperRef.current = null;
                        }
                    };
                }, [imageSrc, initialAspectRatio]);

                const handleRotate = (degree) => {
                    if (cropperRef.current) {
                        cropperRef.current.rotate(degree);
                    }
                };

                const handleZoom = (ratio) => {
                    if (cropperRef.current) {
                        cropperRef.current.zoom(ratio);
                    }
                };

                const handleReset = () => {
                    if (cropperRef.current) {
                        cropperRef.current.reset();
                    }
                };

                const handleConfirm = () => {
                    if (!cropperRef.current) return;
                    const canvas = cropperRef.current.getCroppedCanvas({
                        maxWidth: 1920,
                        maxHeight: 1080,
                        imageSmoothingEnabled: true,
                        imageSmoothingQuality: 'high',
                    });
                    if (canvas) {
                        const croppedDataUrl = canvas.toDataURL('image/jpeg', 0.6);
                        onConfirm(croppedDataUrl);
                    }
                };

                return (
                    <div className="modal-overlay bg-black/90 backdrop-blur-md flex items-center justify-center p-4 z-[9999999]">
                        <div className="bg-[#161D15] text-[#EFF0EA] w-full max-w-sm rounded-3xl p-4 shadow-2xl border border-[#C5AB89]/40 flex flex-col space-y-3 my-auto">
                            <div className="flex items-center justify-between shrink-0">
                                <h3 className="font-extrabold text-sm text-[#C5AB89] flex items-center gap-1.5">
                                    <i data-lucide="crop" className="w-4 h-4"></i> 裁切圖片
                                </h3>
                            </div>

                            <div ref={containerRef} className="relative w-full h-64 bg-black/60 rounded-2xl overflow-hidden flex items-center justify-center border border-[#737C75]/40">
                                <img ref={imageRef} src={imageSrc} alt="Crop preview" className="max-w-full max-h-full block" />
                            </div>

                            <div className="space-y-2 shrink-0">
                                <div className="flex items-center justify-center gap-2 text-xs pt-1">
                                    <button
                                        type="button"
                                        onClick={() => handleRotate(-90)}
                                        className="p-2.5 rounded-xl bg-[#737C75]/30 text-[#EFF0EA] active:bg-[#C5AB89] active:text-[#161D15] flex items-center justify-center transition-colors"
                                        title="向左旋轉 90°"
                                    >
                                        <i data-lucide="rotate-ccw" className="w-4 h-4"></i>
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => handleRotate(90)}
                                        className="p-2.5 rounded-xl bg-[#737C75]/30 text-[#EFF0EA] active:bg-[#C5AB89] active:text-[#161D15] flex items-center justify-center transition-colors"
                                        title="向右旋轉 90°"
                                    >
                                        <i data-lucide="rotate-cw" className="w-4 h-4"></i>
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => handleZoom(0.1)}
                                        className="p-2.5 rounded-xl bg-[#737C75]/30 text-[#EFF0EA] active:bg-[#C5AB89] active:text-[#161D15] flex items-center justify-center transition-colors"
                                        title="放大"
                                    >
                                        <i data-lucide="zoom-in" className="w-4 h-4"></i>
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => handleZoom(-0.1)}

function BackupModal({ events, schedules, userProfile, onClose, onImport, showAlert }) {
    const fileInputRef = useRef(null);

    // 1. 修正匯出：使用 Blob 避免 Data URI 長度限制
    const handleExport = () => {
        try {
            const data = {
                version: 'liveecho_v12',
                exportDate: new Date().toISOString(),
                events: events || [],
                schedules: schedules || [],
                userProfile: userProfile || {}
            };
            
            const jsonString = JSON.stringify(data, null, 2);
            const blob = new Blob([jsonString], { type: 'application/json;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            
            const downloadAnchor = document.createElement('a');
            downloadAnchor.href = url;
            downloadAnchor.setAttribute("download", `liveu_backup_${new Date().toISOString().slice(0, 10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            
            // 清除 DOM 與記憶體中的 URL
            downloadAnchor.remove();
            URL.revokeObjectURL(url);
            
            showAlert('備份資料匯出成功');
        } catch (err) {
            console.error('匯出失敗:', err);
            alert('匯出備份資料時發生錯誤！');
        }
    };

    // 2. 修正匯入：嚴格型別檢查與重置 input value
    const handleImportFile = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
            try {
                const importedData = JSON.parse(event.target.result);
                
                // 檢查物件格式是否合規
                if (typeof importedData === 'object' && importedData !== null) {
                    const cleanData = {
                        events: Array.isArray(importedData.events) ? importedData.events : null,
                        schedules: Array.isArray(importedData.schedules) ? importedData.schedules : null,
                        userProfile: (importedData.userProfile && typeof importedData.userProfile === 'object') ? importedData.userProfile : null
                    };

                    if (cleanData.events || cleanData.schedules || cleanData.userProfile) {
                        onImport(cleanData);
                        showAlert('資料備份匯入成功');
                        onClose();
                    } else {
                        alert('無效的備份檔案格式：缺少有效的紀錄資料！');
                    }
                } else {
                    alert('無效的 JSON 檔案結構！');
                }
            } catch (err) {
                console.error('匯入解析失敗:', err);
                alert('解析備份檔案失敗，請確認檔案格式是否為合法的 JSON。');
            } finally {
                // 清空 input 允許重複選擇同一檔案
                e.target.value = '';
            }
        };

        reader.readAsText(file);
    };

    return (
        <div className="modal-overlay bg-black/85 flex items-center justify-center p-4 z-[999999]">
            <div className="bg-[#EFF0EA] text-[#161D15] w-full max-w-sm rounded-3xl p-5 shadow-2xl border border-[#D2CABF] space-y-4 my-auto">
                <div className="flex items-center justify-between pb-1 border-b border-[#D2CABF]">
                    <h3 className="font-extrabold text-sm flex items-center gap-1.5">
                        <i data-lucide="database" className="w-4 h-4"></i> 資料備份與匯入
                    </h3>
                    <button onClick={onClose}><i data-lucide="x" className="w-5 h-5"></i></button>
                </div>
                <p className="text-xs text-[#737C75] leading-relaxed">
                    您可以將所有藝文紀錄、演出排程及個人設定導出為備份 JSON 檔案，或從先前備份的檔案恢復資料。
                </p>
                <div className="space-y-2 pt-2">
                    <button 
                        onClick={handleExport}
                        className="w-full py-3 rounded-2xl bg-[#C5AB89] text-[#161D15] text-xs font-extrabold flex items-center justify-center gap-2 shadow hover:bg-[#d5bc9a] transition-colors"
                    >
                        <i data-lucide="download" className="w-4 h-4"></i> 匯出備份資料 JSON
                    </button>
                    <button 
                        onClick={() => fileInputRef.current?.click()}
                        className="w-full py-3 rounded-2xl bg-[#161D15] text-[#EFF0EA] text-xs font-extrabold flex items-center justify-center gap-2 shadow hover:bg-[#2A3626] transition-colors"
                    >
                        <i data-lucide="upload" className="w-4 h-4"></i> 匯入備份資料 JSON
                    </button>
                    <input 
                        type="file" 
                        ref={fileInputRef} 
                        onChange={handleImportFile} 
                        accept=".json" 
                        className="hidden" 
                    />
                </div>
                <button 
                    onClick={onClose}
                    className="w-full py-2.5 rounded-xl bg-[#EBEBE9] text-[#737C75] font-bold text-xs"
                >
                    關閉
                </button>
            </div>
        </div>
    );
}

            function App() {
// 1. 資料 State（改為預設空值/預設物件，準備從 IndexedDB 載入）
                const [events, setEvents] = useState([]);
                const [schedules, setSchedules] = useState([]);
                const [userProfile, setUserProfile] = useState({ name: 'LiveU', subtitle: 'say something', avatarUrl: '', initials: 'LU' });
                const [isDataLoaded, setIsDataLoaded] = useState(false);

                // 2. 【要保留】原本的 UI 狀態、分頁、搜尋與各種 Modal 開關
                const [activeTab, setActiveTab] = useState('archive');
                const [viewMode, setViewMode] = useState('list');
                const [selectedCategory, setSelectedCategory] = useState('all');
                const [searchQuery, setSearchQuery] = useState('');

                const [isEditProfileOpen, setIsEditProfileOpen] = useState(false);
                const [isAddModalOpen, setIsAddModalOpen] = useState(false);
                const [isAddScheduleModalOpen, setIsAddScheduleModalOpen] = useState(false);
                const [isBackupModalOpen, setIsBackupModalOpen] = useState(false);
                const [editingEvent, setEditingEvent] = useState(null);
                const [editingSchedule, setEditingSchedule] = useState(null);
                const [alertMsg, setAlertMsg] = useState(null);

                // 3. 頁面載入時：從 IndexedDB 讀取資料（會自動向後相容去抓舊的 localStorage 資料）
                useEffect(() => {
                    async function loadInitialData() {
                        try {
                            const savedEvents = await getFromIDB('events');
                            const savedSchedules = await getFromIDB('schedules');
                            const savedProfile = await getFromIDB('userProfile');

                            if (savedEvents) {
                                setEvents(savedEvents);
                            } else {
                                const legacyEvents = localStorage.getItem('liveecho_records_palette_v12');
                                if (legacyEvents) setEvents(JSON.parse(legacyEvents));
                            }

                            if (savedSchedules) {
                                setSchedules(savedSchedules);
                            } else {
                                const legacySchedules = localStorage.getItem('liveecho_schedules_v12');
                                if (legacySchedules) setSchedules(JSON.parse(legacySchedules));
                            }

                            if (savedProfile) {
                                setUserProfile(savedProfile);
                            } else {
                                const legacyProfile = localStorage.getItem('liveecho_user_profile_v12');
                                if (legacyProfile) setUserProfile(JSON.parse(legacyProfile));
                            }
                        } catch (e) {
                            console.error('從 IndexedDB 載入失敗:', e);
                        } finally {
                            setIsDataLoaded(true);
                        }
                    }
                    loadInitialData();
                }, []);

                // 4. 資料變更時：自動非同步寫入 IndexedDB （取代原本會爆掉的 localStorage.setItem）
                useEffect(() => {
                    if (!isDataLoaded) return;
                    saveToIDB('events', events).catch(e => console.error('儲存 events 失敗', e));
                }, [events, isDataLoaded]);

                useEffect(() => {
                    if (!isDataLoaded) return;
                    saveToIDB('schedules', schedules).catch(e => console.error('儲存 schedules 失敗', e));
                }, [schedules, isDataLoaded]);

                useEffect(() => {
                    if (!isDataLoaded) return;
                    saveToIDB('userProfile', userProfile).catch(e => console.error('儲存 userProfile 失敗', e));
                }, [userProfile, isDataLoaded]);
                
                // 5. 【要保留】Lucide 圖標渲染
                useEffect(() => { 
                    if (window.lucide) {
                        try { window.lucide.createIcons(); } catch (e) {}
                    }
                });

                const showAlert = (msg) => { setAlertMsg(msg); setTimeout(() => setAlertMsg(null), 3000); };

                const handleImportData = (data) => {
                    if (data.events && Array.isArray(data.events)) setEvents(data.events);
                    if (data.schedules && Array.isArray(data.schedules)) setSchedules(data.schedules);
                    if (data.userProfile && typeof data.userProfile === 'object') setUserProfile(data.userProfile);
                };

                const filteredEvents = useMemo(() => {
                    return events.filter(evt => {
                        const matchCategory = selectedCategory === 'all' || evt.type === selectedCategory;
                        const q = (searchQuery || '').toLowerCase().trim();
                        const matchSearch = (evt.title || '').toLowerCase().includes(q) || 
                                            (evt.venue || '').toLowerCase().includes(q) || 
                                            (evt.artist || '').toLowerCase().includes(q);
                        return matchCategory && matchSearch;
                    }).sort((a, b) => new Date(b.date) - new Date(a.date));
                }, [events, selectedCategory, searchQuery]);

                const stats = useMemo(() => {
                    const activeEvents = events.filter(e => e.status !== 'cancelled');
                    const attended = activeEvents.filter(e => e.status === 'attended' || !e.status);
                    const currentYear = new Date().getFullYear();

                    const yearlyMap = {};
                    let currentYearCost = 0;
                    let currentYearCount = 0;

                    activeEvents.forEach(e => {
                        const year = e.date ? parseInt(e.date.split('-')[0], 10) || currentYear : currentYear;
                        const cost = Number(e.cost) || 0;
                        if (!yearlyMap[year]) {
                            yearlyMap[year] = { year, count: 0, cost: 0 };
                        }
                        yearlyMap[year].count += 1;
                        yearlyMap[year].cost += cost;

                        if (year === currentYear) {
                            currentYearCount += 1;
                            currentYearCost += cost;
                        }
                    });

                    const yearlyList = Object.values(yearlyMap).sort((a, b) => b.year - a.year);
                    const totalCost = activeEvents.reduce((sum, e) => sum + (Number(e.cost) || 0), 0);
                    const categoryCounts = {
                        concert: activeEvents.filter(e => e.type === 'concert').length,
                        exhibition: activeEvents.filter(e => e.type === 'exhibition').length,
                        movie: activeEvents.filter(e => e.type === 'movie').length,
                        book: activeEvents.filter(e => e.type === 'book').length,
                        drama: activeEvents.filter(e => e.type === 'drama').length,
                    };
                    const uniqueArtistsCount = new Set(activeEvents.map(e => e.artist).filter(Boolean)).size;
                    return {
                        totalEvents: activeEvents.length,
                        attendedCount: attended.length,
                        totalCost,
                        currentYear,
                        currentYearCount,
                        currentYearCost,
                        yearlyList,
                        uniqueVenuesCount: new Set(attended.map(e => e.venue).filter(Boolean)).size,
                        uniqueCountriesCount: new Set(attended.map(e => e.countryName || '台灣').filter(Boolean)).size,
                        uniqueArtistsCount,
                        categoryCounts
                    };
                }, [events]);

                const handleSaveEvent = (data) => {
                    if (data.id) {
                        setEvents(events.map(e => e.id === data.id ? data : e));

            function LeafletMapSection({ events, stats, getGoogleMapsUrl, onDelete, onEdit }) {
                const mapRef = useRef(null);
                const mapInst = useRef(null);
                const markersLayerRef = useRef(L.layerGroup());
                const activeLayerRef = useRef(null);
                const geoJsonLayerRef = useRef(null);
                const [selectedCountry, setSelectedCountry] = useState(null);

                const countryMap = useMemo(() => {
                    const m = {};
                    events.forEach(e => {
                        if (e.status === 'wishlist' || e.status === 'cancelled') return;
                        const c = e.countryName || '台灣';
                        if (!m[c]) m[c] = { name: c, events: [], venues: new Set() };
                        m[c].events.push(e);
                        if (e.venue) m[c].venues.add(e.venue);
                    });
                    return m;
                }, [events]);

                const visited = useMemo(() => Object.keys(countryMap), [countryMap]);
                const venueCounts = useMemo(() => {
                    const counts = {};
                    events.forEach(e => {
                        if (e.status === 'cancelled') return;
                        if (e.venue) {
                            counts[e.venue] = (counts[e.venue] || 0) + 1;
                        }
                    });
                    return counts;
                }, [events]);

                useEffect(() => {
                    if (!mapRef.current) return;
                    if (!mapInst.current) {
                        const southWest = L.latLng(-85, -180);
                        const northEast = L.latLng(85, 180);
                        const bounds = L.latLngBounds(southWest, northEast);

                        const map = L.map(mapRef.current, { 
                            zoomControl: false, 
                            attributionControl: false, 
                            minZoom: 2,
                            maxBounds: bounds,
                            maxBoundsViscosity: 1.0
                        }).setView([25.033, 121.565], 3);

                        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { 
                            maxZoom: 19, 
                            noWrap: true,
                            bounds: bounds
                        }).addTo(map);

                        markersLayerRef.current.addTo(map);
                        mapInst.current = map;

                        fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_10m_admin_0_countries.geojson')
                            .then(res => res.json())
                            .then(data => {
                                const normalStyle = (feature) => {
                                    const info = getGeoCountryInfo(feature);
                                    const isV = visited.some(v => countryNamesMatch(v, info.displayName));
                                    return {
                                        fillColor: isV ? '#C2A175' : '#1e1e1e',
                                        fillOpacity: isV ? 0.70 : 0.82,
                                        color: isV ? '#C5AB89' : '#2a2a2a',
                                        weight: isV ? 1.5 : 0.8,
                                        smoothFactor: 0
                                    };
                                };

                                const layer = L.geoJSON(data, {
                                    style: normalStyle,
                                    onEachFeature: (feature, layer) => {
                                        layer.on({
                                            click: (e) => {
                                                L.DomEvent.stopPropagation(e);
                                                const clickedInfo = getGeoCountryInfo(feature);
                                                const clickedCode = clickedInfo.code;

                                                if (geoJsonLayerRef.current) {
                                                    geoJsonLayerRef.current.eachLayer((countryLayer) => {
                                                        geoJsonLayerRef.current.resetStyle(countryLayer);
                                                        const layerInfo = getGeoCountryInfo(countryLayer.feature);
                                                        if (layerInfo.code === clickedCode) {
                                                            countryLayer.setStyle({
                                                                fillColor: '#60b0e6',
                                                                fillOpacity: 0.50,
                                                                color: '#FFFFFF',
                                                                weight: 1.5,
                                                                smoothFactor: 0
                                                            });
                                                        }
                                                    });
                                                }

                                                activeLayerRef.current = { code: clickedCode };
                                                const match = visited.find(v => countryNamesMatch(v, clickedInfo.displayName));
                                                setSelectedCountry(match
                                                    ? countryMap[match]
                                                    : { name: clickedInfo.displayName, events: [], venues: new Set() });
                                            }
                                        });
                                    }
                                }).addTo(map);

                                // 台灣離島（包含連江縣馬祖）可能被鄰近國家的圖層蓋住，
                                // 將所有 TW 圖層移到最上層，確保離島可以直接點選。
                                layer.eachLayer((countryLayer) => {
                                    const info = getGeoCountryInfo(countryLayer.feature);
                                    if (info.code === 'TW') {
                                        countryLayer.bringToFront();
                                    }
                                });

                                geoJsonLayerRef.current = layer;
                            })
                            .catch(() => {});
                    }

                    const timer = requestAnimationFrame(() => {
                        if (mapInst.current) mapInst.current.invalidateSize();
                    });

                    return () => { 
                        cancelAnimationFrame(timer);
                    };
                }, []);

                useEffect(() => {
                    if (!mapInst.current) return;
                    markersLayerRef.current.clearLayers();

                    events.forEach((evt) => {
                            if (evt.status === 'cancelled') return;
                        const latVal = parseFloat(evt.lat);
                        const lngVal = parseFloat(evt.lng);

                        if (isNaN(latVal) || isNaN(lngVal)) return;
 
                        const visitCount = evt.venue ? (venueCounts[evt.venue] || 1) : 1;

                        const marker = L.marker([latVal, lngVal], {
                            icon: L.divIcon({ 
                                className: 'custom-div-icon', 
                                html: `<div class="custom-numeric-marker w-7 h-7 flex items-center justify-center">${visitCount}</div>`, 
                                iconSize: [28, 28], 
                                iconAnchor: [14, 14] 
                            })
                        });
                        
                        markersLayerRef.current.addLayer(marker);
                    });
                }, [events, venueCounts]);

                const handleCloseCountryModal = () => {
                    if (geoJsonLayerRef.current) {
                        geoJsonLayerRef.current.eachLayer((countryLayer) => {
                            geoJsonLayerRef.current.resetStyle(countryLayer);
                        });
                    }
                    activeLayerRef.current = null;
                    setSelectedCountry(null);
                };

                return (

                                <img 
                                    src="./image/icons/star.png"
                                    alt="星跡Map圖示"
                                    className="w-4 h-4 object-contain" 
                                    />
                                    星跡Map
                                    </span>
                                
                                <span className="text-[10px] font-mono"><strong className="text-[#C5AB89]">{stats.uniqueCountriesCount}</strong> 國 · <strong className="text-[#C5AB89]">{stats.attendedCount}</strong> 場</span>
                            </div>
                        </div>
                        <div ref={mapRef} id="map" className="w-full h-full flex-1"></div>
                        
                        {selectedCountry && (() => {
    // 自動計算該國家觀看最多次的當地藝人及其對應照片
    const localArtistCounts = {};
    const localArtistAvatar = {};
    selectedCountry.events?.forEach(e => {
        if (e.artist) {
            localArtistCounts[e.artist] = (localArtistCounts[e.artist] || 0) + 1;
            if (e.coverImg && !localArtistAvatar[e.artist]) {
                localArtistAvatar[e.artist] = e.coverImg;
            }
        }
    });
    const sortedLocalArtists = Object.entries(localArtistCounts).sort((a, b) => b[1] - a[1]);
    const topLocalArtist = sortedLocalArtists.length > 0 ? {
        name: sortedLocalArtists[0][0],
        count: sortedLocalArtists[0][1],
        avatar: localArtistAvatar[sortedLocalArtists[0][0]] || null
    } : null;

    return (
        <div className="absolute bottom-4 left-4 right-4 z-[1000]">
            <div className="bg-[#232B25]/90 backdrop-blur-2xl text-[#EFF0EA] rounded-3xl px-4 pt-3 py-4 shadow-[0_0_5px_rgba(197,171,137,0.70)] border border-[#C5AB89]/45 space-y-3 relative">
                
                {/* 上半部：左右並排設計 */}
                <div className="flex items-center justify-between gap-2 px-0.5 pt-0.5 translate-y-1">
                    
                    {/* 左側：國家名稱與已去過場館數 */}
                    <div className="space-y-1.5 min-w-0 flex-1">
                        <div className="flex items-center gap-2">
                            <CompassStarIcon className="w-6 h-6 shrink-0 text-[#C5AB89]" />
                            <h3 className="font-black text-base text-[#EFF0EA] truncate">{selectedCountry.name}</h3>
                        </div>
                        <div className="text-[#EFF0EA] text-[11px] font-bold">

                        </div>
                    </div>

                    {/* 右側：當地代表藝人方形框（含照片、名稱與場次） */}
                    {topLocalArtist && (
                        <div className="relative z-20 w-20 h-20 rounded-2xl overflow-hidden border border-[#C5AB89]/50 filter drop-shadow-[0_0_3px_rgba(197,171,137,0.5)] shrink-0 bg-white/5 backdrop-blur-md mr-1">

                            {topLocalArtist.avatar ? (
                                <img src={topLocalArtist.avatar} alt={topLocalArtist.name} className="absolute inset-0 w-full h-full object-cover" />

                                <div className="absolute inset-0 bg-[#C5AB89]/20 flex items-center justify-center text-[#C5AB89] font-black text-sm">
                                    {topLocalArtist.name.slice(0, 1)}

                            {/* 底部漸層與文字資訊（加上 z-10 確保文字浮在圖片上方） */}
                            <div className="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/90 via-black/50 to-transparent pt-3 pb-1 px-1 text-center z-10">
                                <div className="text-[9px] font-black text-white truncate w-full leading-tight">
                                    {topLocalArtist.name}
                                </div>
                                <div className="text-[8px] font-mono text-[#C5AB89] font-bold leading-tight mt-0.5">
                                    {topLocalArtist.count} 場
                                </div>
                            </div>
                        </div>
                    )}
                </div>

                            <div className="space-y-2">

                                    <h3 className="font-extrabold text-sm text-[#C5AB89] flex items-center gap-1.5">
                                        <img src="image/icons/crown.png" alt="icon" className="w-6 h-6 object-contain inline-block filter invert brightness-200 sepia" />2026 年度藝</h3>
                        </div>

                            <div 
                                onClick={triggerFireworks}
                                className={`w-full rounded-3xl shadow-[0_0_5px_rgba(197,171,137,0.50)] cursor-pointer transition-all duration-200 transform-gpu ${
                        isCardActive ? 'scale-95' : 'hover:scale-[1.01]'
                    }`}
                >      
                            <div
                                style={{ clipPath: 'inset(0 round 24px)' }}
                                className="relative w-full bg-[#232B25]/90 backdrop-blur-2xl border border-[#C5AB89]/50 rounded-3xl p-4 overflow-hidden"
                            >
                                {/* 裝飾背景微光 */}
                                <div className="absolute -top-12 -right-12 w-32 h-32 bg-[#C5AB89]/15 rounded-full blur-2xl pointer-events-none"></div>

                                {/* 拍立得 1:1 照片相框 */}
                                <div className="relative w-full aspect-square rounded-2xl overflow-hidden bg-white/5 backdrop-blur-md border border-[#C5AB89]/35 shadow-inner flex items-center justify-center">
                                    {!imgError ? (
                                        <img 
                                            src="./images/artists/artist-of-the-year.jpg" 
                                            alt={topArtistObj ? topArtistObj.artist : "年度藝人"}
                                            onError={() => setImgError(true)}
                                            className="w-full h-full object-cover transition-transform duration-500 hover:scale-105"
                                        />
                                    ) : topArtistObj && topArtistObj.avatar ? (
                                        <img 
                                            src={topArtistObj.avatar} 
                                            alt={topArtistObj.artist}
                                            className="w-full h-full object-cover"
                                        />
                                    ) : (
                                        <div className="flex flex-col items-center justify-center p-4 text-center space-y-2">
                                            <div className="w-16 h-16 rounded-full bg-[#C5AB89]/20 flex items-center justify-center text-[#C5AB89] font-black text-xl border border-[#C5AB89]/40">
                                                {topArtistObj ? topArtistObj.artist.slice(0, 1) : "🌟"}
                                            </div>
                                            <span className="text-xs font-bold text-[#EFF0EA]">
                                                {topArtistObj ? topArtistObj.artist : "尚無年度藝人紀錄"}
                                            </span>
                                            <span className="text-[9px] text-[#A3ADA5]">放置 artist-of-the-year.jpg 於相對路徑資料夾</span>
                                        </div>
                                    )}

                                    {/* 相片內右上角標籤 */}
                                    <div className="absolute top-3 right-3 bg-[#161D15]/80 backdrop-blur-md px-2.5 py-1 rounded-full border border-[#C5AB89]/40 text-[10px] font-black text-[#C5AB89] shadow-md">
                                        2026 TOP 1
                                    </div>
                                </div>

                                {/* 卡片下半部文字資訊 */}
                                <div className="mt-3.5 flex items-center justify-between px-1">
                                    <div className="min-w-0 flex-1 pr-2">
                                        <div className="text-[10px] font-extrabold text-[#C5AB89] tracking-wider uppercase">Most Played Artist</div>
                                        <h2 className="text-base font-black text-[#EFF0EA] truncate mt-0.5">
                                            {topArtistObj ? topArtistObj.artist : "尚未產生"}
                                        </h2>
                                    </div>
                                    <div className="bg-[#C5AB89] text-[#161D15] px-3 py-1.5 rounded-2xl font-black text-xs shrink-0 shadow-md shadow-[0_0_10px_rgba(197,171,137,0.4)]">
                                        {topArtistObj ? `${topArtistObj.count} 場演唱會` : "0 場"}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
             )}
                        {/* 2. 藝人次數排名 (Top Artists) */}
                        <div className="bg-[#232B25]/90 backdrop-blur-2xl text-[#EFF0EA] rounded-3xl p-4 shadow-[0_0_5px_rgba(197,171,137,0.50)] border border-[#C5AB89]/40 space-y-3">
                            <div className="flex items-center justify-between border-b border-[#C5AB89]/20 pb-2">
                                <h3 className="font-extrabold text-sm text-[#C5AB89] flex items-center gap-1.5">
                                    <GreyFourPointStar className="w-4 h-4 text-[#C5AB89]" /> 藝人次數排名 Top 5
                                </h3>
                                <span className="text-[10px] text-[#A3ADA5] font-mono">共 {stats.uniqueArtistsCount} 位藝人</span>
                            </div>

                            <div className="space-y-2 pt-1">
                                {artistRankings.length === 0 ? (
                                    <p className="text-xs text-[#A3ADA5] text-center py-4">尚無藝人參戰紀錄</p>
                                ) : (
                                    artistRankings.slice(0, 5).map((item, idx) => {
                                        const rank = idx + 1;
                                        return (
                                            <div key={item.artist} className="bg-white/5 backdrop-blur-md p-2.5 rounded-2xl border border-[#C5AB89]/30 flex items-center justify-between text-xs shadow-sm">
                                                <div className="flex items-center gap-2.5 min-w-0 flex-1">
                                                    <RankIcon rank={rank} />
                                                    <div className="w-8 h-8 rounded-full overflow-hidden bg-white/10 border border-[#C5AB89]/30 shrink-0 flex items-center justify-center font-bold text-[#EFF0EA]">
                                                        {item.avatar ? (
                                                            <img src={item.avatar} alt={item.artist} className="w-full h-full object-cover" />
                                                        ) : (
                                                            item.artist.slice(0, 1)
                                                        )}
                                                    </div>
                                                    <span className="font-extrabold text-[#EFF0EA] truncate">{item.artist}</span>
                                                </div>
                                                <div className="font-mono font-black text-[11px] bg-white/10 border border-white/10 px-2.5 py-1 rounded-xl shrink-0 text-[#C5AB89]">
                                                    觀看 {item.count} 次
                                                </div>
                                            </div>
                                        );
                                    })
                                )}
                            </div>
                        </div>

                        {/* 3. 場館次數排名 (Top Venues - Bar Chart) */}
                        <div className="bg-[#232B25]/90 backdrop-blur-2xl text-[#EFF0EA] rounded-3xl p-4 shadow-[0_0_5px_rgba(197,171,137,0.50)] border border-[#C5AB89]/40 space-y-3">
                            <div className="flex items-center justify-between border-b border-[#C5AB89]/20 pb-2">
                                <h3 className="font-extrabold text-sm text-[#C5AB89] flex items-center gap-1.5">
                                    <GreyFourPointStar className="w-4 h-4 text-[#C5AB89]" /> 場館次數排名
                                </h3>
                                <span className="text-[10px] text-[#A3ADA5] font-mono">共 {stats.uniqueVenuesCount} 個場館</span>
                            </div>

                            <div className="space-y-2.5 pt-1">
                                {venueRankings.length === 0 ? (
                                    <p className="text-xs text-[#A3ADA5] text-center py-4">尚無場館紀錄</p>
                                ) : (
                                    venueRankings.slice(0, 5).map((item, idx) => {
                                        const pct = Math.round((item.count / maxVenueCount) * 100);
                                        return (
                                            <div key={item.venue} className="space-y-1">
                                                <div className="flex items-center justify-between text-xs font-bold">
                                                <div className="flex items-center gap-1.5 min-w-0">
                                                <img src="./image/icons/favourite.png" alt="場館名稱" className="w-3.5 h-3.5 object-contain shrink-0" />
                                                    <span className="truncate max-w-[200px] text-[#EFF0EA]"> {item.venue}</span>
                                                </div>    
                                                <span className="font-mono text-[11px] text-[#C5AB89] shrink-0">{item.count} 次</span>

                                                </div>

                                                <div className="w-full bg-white/10 h-2.5 rounded-full overflow-hidden border border-white/10">
                                                    <div 
                                                        className="bg-[#C5AB89] h-full rounded-full transition-all duration-500 shadow-[0_0_8px_rgba(197,171,137,0.6)]" 
                                                        style={{ width: `${pct}%` }}
                                                    ></div>
                                                </div>
                                            </div>
                                        );
                                    })
                                )}
                            </div>
                        </div>

                        {/* 4. 今年與總累積紀錄 */}
<div className="grid grid-cols-2 gap-3">
    {/* 藝文紀錄卡片 */}
    <div className="bg-[#232B25]/90 backdrop-blur-2xl text-[#EFF0EA] rounded-3xl p-4 shadow-[0_0_5px_rgba(197,171,137,0.50)] border border-[#C5AB89]/40 flex flex-col justify-between min-w-0">
        <div>
            <div className="text-[10px] font-extrabold text-[#C5AB89] flex items-center gap-1">
                <GreyFourPointStar className="w-4 h-4" /> 今年藝文紀錄
            </div>
            <div className="font-mono text-2xl font-black text-[#EFF0EA] truncate mt-1">
                {stats.currentYearCount} <span className="text-xs font-normal">場</span>
            </div>
        </div>
        <div className="text-[9px] text-[#A3ADA5] mt-2">總累計：{stats.attendedCount} 場</div>
    </div>

    {/* 累積花費卡片 */}
    {(() => {
        const costStr = `NT$ ${stats.currentYearCost.toLocaleString()}`;

        return (
            <div className="bg-[#232B25]/90 backdrop-blur-2xl text-[#EFF0EA] rounded-3xl p-4 shadow-[0_0_5px_rgba(197,171,137,0.50)] border border-[#C5AB89]/40 flex flex-col justify-between min-w-0">
                <div>
                    <div className="text-[10px] font-extrabold text-[#C5AB89] flex items-center gap-1">
                        <GreyFourPointStar className="w-4 h-4" /> 今年累積花費
                    </div>
                    <div className={`ffont-mono text-2xl font-black text-[#EFF0EA] whitespace-nowrap overflow-x-auto no-scrollbar mt-1`} 
                    style={{
                            maskImage: 'linear-gradient(to right, black 90%, transparent 100%)',
                            WebkitMaskImage: 'linear-gradient(to right, black 80%, transparent 100%)'
                        }}
                    title={costStr}>
                        {costStr}
                    </div>
                </div>
                <div className="text-[9px] text-[#A3ADA5] mt-2">總累積：NT$ {stats.totalCost.toLocaleString()}</div>
            </div>
        );
    })()}
</div>
                        {/* 5. 類別佔比分析 */}
                        <div className="bg-[#232B25]/90 backdrop-blur-2xl text-[#EFF0EA] rounded-3xl p-4 shadow-[0_0_5px_rgba(197,171,137,0.50)] border border-[#C5AB89]/40 space-y-3">
                            <div className="flex items-center justify-between border-b border-[#C5AB89]/20 pb-2">
                                <h3 className="font-extrabold text-sm text-[#C5AB89] flex items-center gap-1.5">
                                    <GreyFourPointStar className="w-4 h-4 text-[#C5AB89]" /> 類別佔比分析
                                </h3>
                            </div>
                            <div className="space-y-2 pt-1">
                                {Object.entries(CATEGORIES).map(([key, cat]) => {
                                    const count = stats.categoryCounts[key] || 0;
                                    const pct = stats.totalEvents > 0 ? Math.round((count / stats.totalEvents) * 100) : 0;
                                    return (
                                        <div key={key} className="space-y-1">
                                            <div className="flex items-center justify-between text-xs font-bold">
                                                <span className="flex items-center gap-1.5 text-[#EFF0EA]">
                                                    <CategoryIcon cat={cat} sizeClass="w-3.5 h-3.5" />
                                                    {cat.label}
                                                </span>
                                                <span className="font-mono text-[11px] text-[#C5AB89]">{count} 場</span>
                                            </div>
                                            <div className="w-full bg-white/10 h-2 rounded-full overflow-hidden border border-white/10">
                                                <div className="bg-[#C5AB89] h-full rounded-full transition-all duration-500 shadow-[0_0_10px_rgba(197,171,137,0.50)]" style={{ width: `${pct}%` }}></div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    </div>
                );
            }

            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
        } catch (e) {
            console.error("App Render Error:", e);
        }
    </script>
</body>
</html>
