    <script type="text/babel">
        try {
            const { useState, useEffect, useMemo, useRef, useCallback } = React;

            const CATEGORIES = {

            const VENUE_ADDRESS_DATABASE = {

                '國家音樂廳': { address: '100台北市中正區中山南路21-1號', city: '台北', country: '台灣' },
                '台北流行音樂中心': { address: '115台北市南港區市民大道八段99號', city: '台北', country: '台灣' },
                '高雄流行音樂中心': { address: '803高雄市鹽埕區真愛路1號', city: '高雄', country: '台灣' },
                'legacy taipei': { address: '100台北市中正區八德路一段1號', city: '台北', country: '台灣' },
                'clapper studio': { address: '100台北市中正區市民大道三段2號5樓', city: '台北', country: '台灣' },
                'zepp new taipei': { address: '242新北市新莊區新北大道四段3號8樓', city: '新北', country: '台灣' },
                'tokyo dome': { address: '1-3 Koraku, Bunkyo City, Tokyo 112-0004', city: '東京', country: '日本' },
                'budokan': { address: '2-3 Kitanomarukoen, Chiyoda City, Tokyo 102-0091', city: '東京', country: '日本' }
            };

            const COUNTRY_NAME_MAPPING = {
                'Taiwan': '台灣', 'TW': '台灣',
                'Japan': '日本', 'JP': '日本',
                'South Korea': '南韓', 'Korea': '南韓', 'KR': '南韓',
                'United States': '美國', 'US': '美國', 'USA': '美國',
                'Australia': '澳大利亞', 'AU': '澳大利亞',
                'United Kingdom': '英國', 'GB': '英國', 'UK': '英國',
                'Thailand': '泰國', 'TH': '泰國',
                'China': '中國', 'CN': '中國',
                'Hong Kong': '香港', 'HK': '香港'
            };

            function resolveCountryInfo(countryInput) {
                const clean = (countryInput || '').trim().toLowerCase();
                if (clean.includes('台') || clean.includes('tw') || clean.includes('taiwan')) return { code: 'TW', name: '台灣', lat: 25.033, lng: 121.565 };
                if (clean.includes('日') || clean.includes('jp') || clean.includes('japan')) return { code: 'JP', name: '日本', lat: 35.676, lng: 139.650 };
                if (clean.includes('韓') || clean.includes('kr') || clean.includes('korea')) return { code: 'KR', name: '南韓', lat: 37.566, lng: 126.978 };
                if (clean.includes('美') || clean.includes('us') || clean.includes('america')) return { code: 'US', name: '美國', lat: 40.712, lng: -74.006 };
                return { code: 'OTHER', name: countryInput || '台灣', lat: 25.033, lng: 121.565 };
            }

            function parseSpotifyEmbedUrl(urlOrUri) {
                if (!urlOrUri) return null;
                let raw = urlOrUri.trim();
                if (raw.startsWith('spotify:')) {
                    const parts = raw.split(':');
                    if (parts.length >= 3) return `https://open.spotify.com/embed/${parts[1]}/${parts[2]}?utm_source=generator&theme=0`;
                }
                if (raw.includes('open.spotify.com')) {
                    try {
                        const urlObj = new URL(raw);
                        const pathSegments = urlObj.pathname.split('/').filter(Boolean);
                        if (pathSegments.length >= 2) return `https://open.spotify.com/embed/${pathSegments[0]}/${pathSegments[1]}?utm_source=generator&theme=0`;
                    } catch (e) {}
                }
                return null;
            }

            function compressImageFile(fileOrUrl, maxWidth = 350, maxHeight = 350, quality = 0.6) {
                return new Promise((resolve) => {
                    if (typeof fileOrUrl === 'string' && (fileOrUrl.startsWith('http') || fileOrUrl.length < 400)) {
                        resolve(fileOrUrl);
                        return;
                    }
                    const img = new Image();
                    img.onload = () => {
                        let width = img.width, height = img.height;
                        if (width > height) {
                            if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
                        } else {
                            if (height > maxHeight) { width = Math.round((width * maxHeight) / height); height = maxHeight; }
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.onerror = () => resolve('https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=400&q=80');
                    if (typeof fileOrUrl === 'string') img.src = fileOrUrl;
                    else if (fileOrUrl instanceof File || fileOrUrl instanceof Blob) {
                        const reader = new FileReader();
                        reader.onload = (e) => { img.src = e.target.result; };
                        reader.readAsDataURL(fileOrUrl);
                    } else resolve('https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=400&q=80');
                });
            }

            function TouchImageTransform({ src, initialTransform, onChange, className = "w-full h-full object-cover" }) {
                const containerRef = useRef(null);
                const [transform, setTransform] = useState(() => initialTransform || { scale: 1, x: 0, y: 0 });
                const isDragging = useRef(false);
                const dragStart = useRef({ x: 0, y: 0 });
                const pinchStartDist = useRef(null);
                const pinchStartScale = useRef(1);

                const handleTouchStart = (e) => {
                    if (e.touches.length === 1) {
                        isDragging.current = true;
                        dragStart.current = { x: e.touches[0].clientX - transform.x, y: e.touches[0].clientY - transform.y };
                    } else if (e.touches.length === 2) {
                        isDragging.current = false;
                        pinchStartDist.current = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                        pinchStartScale.current = transform.scale;
                    }
                };

                const handleTouchMove = (e) => {
                    if (e.touches.length === 1 && isDragging.current) {
                        const updated = { ...transform, x: e.touches[0].clientX - dragStart.current.x, y: e.touches[0].clientY - dragStart.current.y };
                        setTransform(updated);
                        if (onChange) onChange(updated);
                    } else if (e.touches.length === 2 && pinchStartDist.current) {
                        const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                        const updated = { ...transform, scale: Math.min(Math.max(0.5, pinchStartScale.current * (dist / pinchStartDist.current)), 4) };
                        setTransform(updated);
                        if (onChange) onChange(updated);
                    }
                };

                const handleTouchEnd = () => { isDragging.current = false; pinchStartDist.current = null; };

                return (
                    <div ref={containerRef} className="overflow-hidden relative select-none w-full h-full cursor-grab active:cursor-grabbing"
                        onTouchStart={handleTouchStart} onTouchMove={handleTouchMove} onTouchEnd={handleTouchEnd}
                        onMouseDown={(e) => { isDragging.current = true; dragStart.current = { x: e.clientX - transform.x, y: e.clientY - transform.y }; }}
                        onMouseMove={(e) => { if (!isDragging.current) return; const updated = { ...transform, x: e.clientX - dragStart.current.x, y: e.clientY - dragStart.current.y }; setTransform(updated); if (onChange) onChange(updated); }}
                        onMouseUp={() => { isDragging.current = false; }} onMouseLeave={() => { isDragging.current = false; }}>
                        <img src={src} alt="Preview" className={className}
                            style={{ transform: `translate(${transform.x}px, ${transform.y}px) scale(${transform.scale})`, transition: isDragging.current ? 'none' : 'transform 0.1s ease-out' }}
                            draggable={false} />
                    </div>
                );
            }

            function App() {
                const [events, setEvents] = useState(() => {
                    try {
                        const saved = localStorage.getItem('liveecho_records_palette_v12');
                        return saved ? JSON.parse(saved) : [];
                    } catch (e) { return []; }
                });
                const [schedules, setSchedules] = useState(() => {
                    try {
                        const saved = localStorage.getItem('liveecho_schedules_v12');
                        return saved ? JSON.parse(saved) : [];
                    } catch (e) { return []; }
                });
                const [userProfile, setUserProfile] = useState(() => {
                    try {
                        const saved = localStorage.getItem('liveecho_user_profile_v12');
                        return saved ? JSON.parse(saved) : { name: 'LiveU', subtitle: 'say something', avatarUrl: '', initials: 'LU' };
                    } catch (e) { return { name: 'LiveU', subtitle: 'say something', avatarUrl: '', initials: 'LU' }; }
                });

                const [activeTab, setActiveTab] = useState('archive');
                const [viewMode, setViewMode] = useState('list');
                const [selectedCategory, setSelectedCategory] = useState('all');
                const [searchQuery, setSearchQuery] = useState('');
                const [selectedEventId, setSelectedEventId] = useState(null);

                const [isEditProfileOpen, setIsEditProfileOpen] = useState(false);
                const [isAddModalOpen, setIsAddModalOpen] = useState(false);
                const [isAddScheduleModalOpen, setIsAddScheduleModalOpen] = useState(false);
                const [editingEvent, setEditingEvent] = useState(null);
                const [editingSchedule, setEditingSchedule] = useState(null);
                const [alertMsg, setAlertMsg] = useState(null);

                useEffect(() => {
                    try { localStorage.setItem('liveecho_records_palette_v12', JSON.stringify(events)); } catch (e) { alert('儲存空間不足，建議清理部分圖片記錄！'); }
                }, [events]);
                useEffect(() => { localStorage.setItem('liveecho_schedules_v12', JSON.stringify(schedules)); }, [schedules]);
                useEffect(() => { localStorage.setItem('liveecho_user_profile_v12', JSON.stringify(userProfile)); }, [userProfile]);
                
                useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

                const showAlert = (msg) => { setAlertMsg(msg); setTimeout(() => setAlertMsg(null), 3000); };

                const filteredEvents = useMemo(() => {
                    return events.filter(evt => {
                        const matchCategory = selectedCategory === 'all' || evt.type === selectedCategory;
                        const q = searchQuery.toLowerCase();
                        const matchSearch = (evt.title || '').toLowerCase().includes(q) || (evt.venue || '').toLowerCase().includes(q);
                        return matchCategory && matchSearch;
                    }).sort((a, b) => new Date(b.date) - new Date(a.date));
                }, [events, selectedCategory, searchQuery]);

                const stats = useMemo(() => {
                    const attended = events.filter(e => e.status === 'attended' || !e.status);
                    const totalCost = events.reduce((sum, e) => sum + (Number(e.cost) || 0), 0);
                    return {
                        totalEvents: events.length, attendedCount: attended.length, totalCost,
                        uniqueVenuesCount: new Set(attended.map(e => e.venue).filter(Boolean)).size,
                        uniqueCountriesCount: new Set(attended.map(e => e.countryName || '台灣').filter(Boolean)).size,
                        categoryCounts: {
                            concert: events.filter(e => e.type === 'concert').length,
                            exhibition: events.filter(e => e.type === 'exhibition').length,
                            movie: events.filter(e => e.type === 'movie').length,
                            book: events.filter(e => e.type === 'book').length,
                            drama: events.filter(e => e.type === 'drama').length,
                        }
                    };
                }, [events]);

                const handleSaveEvent = (data) => {
                    if (data.id) {
                        setEvents(events.map(e => e.id === data.id ? data : e));
                        showAlert('已成功更新藝文紀錄');
                    } else {
                        const created = { ...data, id: 'evt-' + Date.now() };
                        setEvents([created, ...events]);
                        setSelectedEventId(created.id);
                        showAlert('已成功新增藝文紀錄');
                    }
                    setEditingEvent(null);
                };

                const handleDeleteEvent = (id) => {
                    setEvents(events.filter(e => e.id !== id));
                    showAlert('已刪除該筆藝文紀錄');
                };

                const handleSaveSchedule = (data) => {
                    if (data.id) {
                        setSchedules(schedules.map(s => s.id === data.id ? data : s));
                        showAlert('已成功更新演出排程');
                    } else {
                        setSchedules([{ ...data, id: 'sch-' + Date.now() }, ...schedules]);
                        showAlert('已成功新增演出排程');
                    }
                    setEditingSchedule(null);
                };

                const handleDeleteSchedule = (id) => {
                    setSchedules(schedules.filter(s => s.id !== id));
                    showAlert('已刪除該筆演出排程');
                };

                const getGoogleMapsUrl = (venue, address) => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${venue} ${address || ''}`)}`;

                return (

                        <header className="app-header px-4 py-2.5 flex items-center justify-between shrink-0">

                                {userProfile.avatarUrl ? (
                                    <img src={userProfile.avatarUrl} alt="Avatar" className="w-8 h-8 rounded-lg object-cover border border-[#C5AB89]" />
                                ) : (
                                    <div className="w-8 h-8 rounded-lg bg-[#C5AB89] text-[#161D15] flex items-center justify-center font-black text-xs">{userProfile.initials || 'LU'}</div>
                                )}
                                <div>
                                    <h1 className="font-extrabold text-sm text-[#EFF0EA]">{userProfile.name}</h1>
                                    <p className="text-[9px] text-[#D2CABF] font-mono">{userProfile.subtitle}</p>
                                </div>
                            </button>
                            <div className="flex items-center gap-2">
                                {activeTab === 'archive' && (
                                    <>

                                            <button onClick={() => setViewMode('list')} className={`px-2.5 py-1 rounded-md text-[11px] ${viewMode === 'list' ? 'bg-[#C5AB89] text-[#161D15] font-bold' : 'text-[#D2CABF]'}`}>條列</button>
                                            <button onClick={() => setViewMode('calendar')} className={`px-2.5 py-1 rounded-md text-[11px] ${viewMode === 'calendar' ? 'bg-[#C5AB89] text-[#161D15] font-bold' : 'text-[#D2CABF]'}`}>月曆</button>
                                        </div>
                                        <button onClick={() => setIsAddModalOpen(true)} className="w-8 h-8 rounded-lg bg-[#C5AB89] text-[#161D15] flex items-center justify-center shadow"><i data-lucide="plus" className="w-4 h-4 font-black"></i></button>
                                    </>
                                )}
                                {activeTab === 'schedule' && (
                                    <button onClick={() => setIsAddScheduleModalOpen(true)} className="w-8 h-8 rounded-lg bg-[#C5AB89] text-[#161D15] flex items-center justify-center shadow"><i data-lucide="plus" className="w-4 h-4 font-black"></i></button>
                                )}
                            </div>
                        </header>

                        {alertMsg && <div className="absolute top-20 left-1/2 -translate-x-1/2 z-50 bg-[#C5AB89] text-[#161D15] px-4 py-2 rounded-full text-xs font-bold shadow-2xl animate-bounce">{alertMsg}</div>}

                        <main className="flex-1 overflow-y-auto no-scrollbar relative flex flex-col">
                            {activeTab === 'archive' && <ArchiveSection events={filteredEvents} allEvents={events} selectedCategory={selectedCategory} setSelectedCategory={setSelectedCategory} searchQuery={searchQuery} setSearchQuery={setSearchQuery} viewMode={viewMode} onDelete={handleDeleteEvent} onEdit={(evt) => setEditingEvent(evt)} getGoogleMapsUrl={getGoogleMapsUrl} onOpenAddModal={() => setIsAddModalOpen(true)} />}
                            {activeTab === 'schedule' && <ScheduleSection schedules={schedules} onDelete={handleDeleteSchedule} onEdit={(sch) => setEditingSchedule(sch)} getGoogleMapsUrl={getGoogleMapsUrl} onOpenAddModal={() => setIsAddScheduleModalOpen(true)} />}
                            {activeTab === 'map' && <LeafletMapSection events={events} stats={stats} getGoogleMapsUrl={getGoogleMapsUrl} />}
                            {activeTab === 'stats' && <StatsSection stats={stats} events={events} />}
                        </main>

                        <nav className="bottom-nav ios-glass pt-3 px-4 flex items-center justify-around app-safe-bottom border-t border-[#737C75]/30">
                            <button onClick={() => setActiveTab('archive')} className={`flex flex-col items-center gap-1 ${activeTab === 'archive' ? 'text-[#C5AB89]' : 'text-[#737C75]'}`}><i data-lucide="library" className="w-5 h-5"></i><span className="text-[10px]">藝文紀錄</span></button>
                            <button onClick={() => setActiveTab('schedule')} className={`flex flex-col items-center gap-1 ${activeTab === 'schedule' ? 'text-[#C5AB89]' : 'text-[#737C75]'}`}><i data-lucide="calendar-days" className="w-5 h-5"></i><span className="text-[10px]">演出排程</span></button>
                            <button onClick={() => setActiveTab('map')} className={`flex flex-col items-center gap-1 ${activeTab === 'map' ? 'text-[#C5AB89]' : 'text-[#737C75]'}`}><i data-lucide="map-pin" className="w-5 h-5"></i><span className="text-[10px]">地圖足跡</span></button>
                            <button onClick={() => setActiveTab('stats')} className={`flex flex-col items-center gap-1 ${activeTab === 'stats' ? 'text-[#C5AB89]' : 'text-[#737C75]'}`}><i data-lucide="trophy" className="w-5 h-5"></i><span className="text-[10px]">成就統計</span></button>

            function LeafletMapSection({ events, stats, getGoogleMapsUrl }) {
                const mapRef = useRef(null);
                const mapInst = useRef(null);
                const [selectedCountry, setSelectedCountry] = useState(null);
                const [selectedEventModal, setSelectedEventModal] = useState(null);

                const countryMap = useMemo(() => {
                    const m = {};
                    events.forEach(e => {
                        if (e.status === 'wishlist') return;
                        const c = e.countryName || '台灣';
                        if (!m[c]) m[c] = { name: c, events: [], venues: new Set() };
                        m[c].events.push(e);
                        if (e.venue) m[c].venues.add(e.venue);
                    });
                    return m;
                }, [events]);

                const visited = useMemo(() => Object.keys(countryMap), [countryMap]);

                useEffect(() => {
                    if (!mapRef.current) return;
                    if (!mapInst.current) {
                        const map = L.map(mapRef.current, { zoomControl: false, attributionControl: false, minZoom: 2 }).setView([25.033, 121.565], 3);
                        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, noWrap: true }).addTo(map);
                        mapInst.current = map;

                        fetch('https://raw.githubusercontent.com/datasets/geo-boundaries-world-110m/master/countries.geojson')
                            .then(res => res.json())
                            .then(data => {
                                L.geoJSON(data, {
                                    style: (feature) => {
                                        const p = feature.properties || {};
                                        const name = COUNTRY_NAME_MAPPING[p.name || p.ADMIN] || p.name || '';
                                        const isV = visited.some(v => name.includes(v));
                                        return { fillColor: isV ? '#C2A175' : '#1A2218', fillOpacity: isV ? 0.45 : 0.2, color: isV ? '#C5AB89' : '#2A3626', weight: isV ? 1.5 : 0.8 };
                                    },
                                    onEachFeature: (feature, layer) => {
                                        const p = feature.properties || {};
                                        const zh = COUNTRY_NAME_MAPPING[p.name || p.ADMIN] || p.name || '區域';
                                        layer.on({
                                            click: (e) => {
                                                L.DomEvent.stopPropagation(e);
                                                const match = visited.find(v => zh.includes(v));
                                                setSelectedCountry(match ? countryMap[match] : { name: zh, events: [], venues: new Set() });
                                            }
                                        });
                                    }
                                }).addTo(map);
                            }).catch(() => {});

                        events.forEach((evt, idx) => {
                            if (!evt.lat || !evt.lng) return;
                            L.marker([evt.lat, evt.lng], {
                                icon: L.divIcon({ className: 'custom-div-icon', html: `<div class="custom-numeric-marker w-7 h-7 flex items-center justify-center">${idx + 1}</div>`, iconSize: [28, 28], iconAnchor: [14, 14] })
                            }).addTo(map).on('click', () => setSelectedEventModal(evt));
                        });
                        setTimeout(() => map.invalidateSize(), 100);
                    }
                    return () => { if (mapInst.current) { mapInst.current.remove(); mapInst.current = null; } };
                }, [events, visited]);

                return (
                    <div id="map-wrapper" className="relative flex-1 w-full flex flex-col bg-[#000000] overflow-hidden">
                        <div className="absolute top-3 left-4 right-4 z-[999] flex items-center justify-between pointer-events-none top-stats-card">
                            <div className="ios-glass px-3 py-1.5 rounded-full shadow-xl border border-[#737C75]/30 pointer-events-auto flex items-center gap-2">
                                <span className="text-[10px] font-bold text-[#C5AB89]">🌍 藝文足跡</span>
                                <span className="text-[10px] font-mono"><strong className="text-[#C5AB89]">{stats.uniqueCountriesCount}</strong> 國 · <strong className="text-[#C5AB89]">{stats.attendedCount}</strong> 場</span>
                            </div>
                        </div>
                        <div ref={mapRef} id="map" className="w-full h-full flex-1"></div>
                        {selectedCountry && (
                            <div className="absolute bottom-4 left-4 right-4 z-[1000]">
                                <div className="bg-[#EFF0EA] text-[#161D15] rounded-3xl p-5 shadow-2xl border-2 border-[#C5AB89] space-y-3 relative">
                                    <button onClick={() => setSelectedCountry(null)} className="absolute top-4 right-4"><i data-lucide="x" className="w-4 h-4"></i></button>
                                    <h3 className="font-black text-base">{selectedCountry.name}</h3>
                                    <p className="text-[11px] text-[#737C75]">共參加 {selectedCountry.events?.length || 0} 場藝文活動</p>
                                    <button onClick={() => setSelectedCountry(null)} className="w-full py-2.5 rounded-xl bg-[#161D15] text-[#EFF0EA] font-bold text-xs">關閉</button>
                                </div>
                            </div>
                        )}
                        {selectedEventModal && <EventDetailModal event={selectedEventModal} onClose={() => setSelectedEventModal(null)} onDelete={() => {}} onEdit={() => {}} />}
                    </div>
                );
            }

            function ArchiveSection({ events, allEvents, selectedCategory, setSelectedCategory, searchQuery, setSearchQuery, viewMode, onDelete, onEdit, getGoogleMapsUrl, onOpenAddModal }) {
                const [detailEvent, setDetailEvent] = useState(null);
                const [calendarDate, setCalendarDate] = useState(new Date());
                const year = calendarDate.getFullYear(), month = calendarDate.getMonth();

                const calendarDays = useMemo(() => {
                    const firstDay = new Date(year, month, 1).getDay();
                    const totalDays = new Date(year, month + 1, 0).getDate();
                    const days = Array(firstDay).fill(null);
                    for (let i = 1; i <= totalDays; i++) {
                        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                        days.push({ day: i, events: allEvents.filter(e => e.date === dateStr) });
                    }
                    return days;
                }, [year, month, allEvents]);

                return (
                    <div className="space-y-4 p-4 pb-24">
                        <div className="space-y-2.5">
                            <div className="relative">
                                <i data-lucide="search" className="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-[#737C75]"></i>
                                <input type="text" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} placeholder="搜尋名稱、場館..." className="w-full bg-[#EFF0EA] text-[#161D15] pl-9 pr-8 py-2 rounded-xl text-xs border border-[#D2CABF]" />
                            </div>
                            <div className="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-1 -mx-4 px-4">
                                <button onClick={() => setSelectedCategory('all')} className={`px-3 py-1.5 rounded-full text-xs font-bold whitespace-nowrap ${selectedCategory === 'all' ? 'bg-[#C5AB89] text-[#161D15]' : 'bg-[#EFF0EA] text-[#161D15]'}`}>✨ 全部 ({allEvents.length})</button>
                                {Object.entries(CATEGORIES).map(([k, cat]) => (
                                    <button key={k} onClick={() => setSelectedCategory(k)} className={`px-3 py-1.5 rounded-full text-xs font-bold whitespace-nowrap ${selectedCategory === k ? `${cat.badgeBg}` : 'bg-[#EFF0EA] text-[#161D15]'}`}>{cat.emoji} {cat.label}</button>
                                ))}
                            </div>
                        </div>

                        {viewMode === 'calendar' ? (
                            <div className="bg-[#EFF0EA] text-[#161D15] p-4 rounded-3xl shadow-lg border border-[#D2CABF] space-y-4">
                                <div className="flex items-center justify-between"><h3 className="font-extrabold text-sm">{year} 年 {month + 1} 月</h3><div className="flex gap-1"><button onClick={() => setCalendarDate(new Date(year, month - 1, 1))} className="p-1 rounded bg-[#EBEBE9]"><i data-lucide="chevron-left" className="w-4 h-4"></i></button><button onClick={() => setCalendarDate(new Date(year, month + 1, 1))} className="p-1 rounded bg-[#EBEBE9]"><i data-lucide="chevron-right" className="w-4 h-4"></i></button></div></div>
                                <div className="grid grid-cols-7 gap-1 text-center font-bold text-[10px] text-[#737C75]"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
                                <div className="grid grid-cols-7 gap-1">{calendarDays.map((item, idx) => !item ? <div key={idx} className="h-10"></div> : <div key={idx} onClick={() => { if(item.events.length) setDetailEvent(item.events[0]); }} className={`h-10 rounded-xl flex flex-col items-center justify-center ${item.events.length ? 'bg-[#C5AB89] font-black cursor-pointer' : 'bg-[#EBEBE9]'}`}><span>{item.day}</span></div>)}</div>
                            </div>
                        ) : (
                            <div className="space-y-3">
                                {events.length === 0 ? (
                                    <div className="text-center py-16 bg-[#EFF0EA]/5 border border-dashed border-[#737C75]/40 rounded-3xl p-6 space-y-3">
                                        <p className="text-xs text-[#EFF0EA] font-extrabold">暫無藝文紀錄</p>
                                        <button onClick={onOpenAddModal} className="px-4 py-2 bg-[#C5AB89] text-[#161D15] rounded-xl font-bold text-xs">新增藝文紀錄</button>
                                    </div>
                                ) : (
                                    events.map((evt) => {
                                        const cat = CATEGORIES[evt.type] || CATEGORIES.concert;
                                        const t = evt.imageTransform || { scale: 1, x: 0, y: 0 };
                                        return (
                                            <div key={evt.id} onClick={() => setDetailEvent(evt)} className="relative bg-[#EFF0EA] text-[#161D15] rounded-2xl flex shadow-lg overflow-hidden cursor-pointer hover:scale-[1.01] transition-all my-2">
                                                <div className="absolute -left-3 top-1/2 -translate-y-1/2 w-6 h-6 bg-[#161D15] rounded-full z-20"></div>
                                                <div className="absolute -right-3 top-1/2 -translate-y-1/2 w-6 h-6 bg-[#161D15] rounded-full z-20"></div>
                                                
                                                <div className="flex-1 p-3.5 pl-5 flex gap-3 min-w-0 pr-4 relative">
                                                    {/* 修正 1：小圖點擊同樣開啟與大圖相同的彈出詳情視窗 */}
                                                    <div 
                                                        onClick={(e) => { e.stopPropagation(); setDetailEvent(evt); }}
                                                        className="w-16 h-20 rounded-xl overflow-hidden shrink-0 border border-[#D2CABF] bg-[#D2CABF] relative shadow-sm cursor-pointer hover:opacity-95"
                                                    >
                                                        <img src={evt.coverImg} alt={evt.title} className="w-full h-full object-cover" style={{ transform: `translate(${t.x * 0.3}px, ${t.y * 0.3}px) scale(${t.scale})` }} />
                                                    </div>
                                                    <div className="flex-1 flex flex-col justify-between min-w-0">
                                                        <div className="space-y-1">
                                                            {/* 修正 2：將日期、音樂圖示、釘針與場館名稱放在同一行 */}
                                                            <div className="flex items-center justify-between gap-2 text-[10px] font-mono font-bold text-[#737C75]">
                                                                <div className="flex items-center gap-2">
                                                                     <span>{evt.date}</span>
                                                                     <span>{cat.emoji}</span>
                                                            </div>
                                                            <span className="flex items-center gap-0.5 truncate">📍 {evt.venue}</span>
                                                         </div>
                                                            <h3 className="font-extrabold text-xs text-[#161D15] leading-snug line-clamp-4">{evt.title}</h3>
                                                        </div>
                                                    </div>
                                                </div>
                                                <div className="relative w-0 border-r-2 border-dashed border-[#737C75]/40 my-1 z-10"></div>
                                                <div className="w-[88px] bg-[#EBEBE9] p-2.5 flex flex-col justify-between items-center text-center shrink-0 border-l border-[#D2CABF]/40">
                                                    <span className="text-[8px] font-mono font-black text-[#737C75]">ADMIT ONE</span>
                                                    <div className="font-mono text-[10px] font-black">{evt.cost ? `$${Number(evt.cost).toLocaleString()}` : 'FREE'}</div>
                                                    {evt.detailSeat ? <span className="text-[8px] font-bold bg-[#CCB9AA] px-1.5 py-0.5 rounded w-full truncate">{evt.detailSeat.slice(0, 6)}</span> : <span></span>}
                                                </div>
                                            </div>
                                        );
                                    })
                                )}
                            </div>
                        )}
                        {detailEvent && <EventDetailModal event={detailEvent} onClose={() => setDetailEvent(null)} onDelete={onDelete} onEdit={onEdit} />}
                    </div>
                );
            }

            function ScheduleSection({ schedules, onDelete, onEdit, getGoogleMapsUrl, onOpenAddModal }) {
                return (
                    <div className="p-4 pb-24 space-y-4">
                        <div><h2 className="text-base font-extrabold">近期演出排程</h2></div>
                        <div className="space-y-3.5">
                            {schedules.length === 0 ? (
                                <div className="text-center py-16 bg-[#EFF0EA]/5 border border-dashed border-[#737C75]/40 rounded-3xl p-6">
                                    <p className="text-xs text-[#EFF0EA] font-extrabold mb-2">暫無演出排程</p>
                                    <button onClick={onOpenAddModal} className="px-4 py-2 bg-[#C5AB89] text-[#161D15] rounded-xl font-bold text-xs">新增演出排程</button>
                                </div>
                            ) : (
                                schedules.map(sch => (
                                    <div key={sch.id} className="relative bg-[#EFF0EA] text-[#161D15] rounded-2xl flex overflow-hidden shadow-lg">
                                        <div className="absolute -left-3 top-1/2 -translate-y-1/2 w-6 h-6 bg-[#161D15] rounded-full z-20"></div>
                                        <div className="absolute -right-3 top-1/2 -translate-y-1/2 w-6 h-6 bg-[#161D15] rounded-full z-20"></div>
                                        <div className="flex-1 p-3.5 pl-5 pr-3 space-y-2">
                                            <div className="flex items-center justify-between"><span className="text-[10px] font-mono px-2 py-0.5 rounded bg-[#C5AB89] font-bold">{sch.date}</span><div className="flex gap-1"><button onClick={() => onEdit(sch)} className="w-6 h-6 rounded-full bg-[#D2CABF]/40 flex items-center justify-center"><i data-lucide="pencil" className="w-3.5 h-3.5"></i></button><button onClick={() => onDelete(sch.id)} className="w-6 h-6 rounded-full bg-red-100 text-red-600 flex items-center justify-center"><i data-lucide="trash-2" className="w-3.5 h-3.5"></i></button></div></div>
                                            <h3 className="font-extrabold text-sm">{sch.title}</h3>
                                            <p className="text-xs text-[#737C75]">{sch.organizer} • {sch.venue}</p>
                                        </div>
                                    </div>
                                ))
                            )}
                        </div>
                    </div>
                );
            }

            function StatsSection({ stats }) {
                return (
                    <div className="p-4 pb-24 space-y-4">
                        <div><h2 className="text-base font-extrabold">成就統計與花費總覽</h2></div>
                        <div className="grid grid-cols-2 gap-3">
                            <div className="bg-[#EFF0EA] text-[#161D15] p-4 rounded-3xl shadow-lg border border-[#D2CABF]"><span className="text-[10px] text-[#737C75] font-bold">總藝文紀錄</span><div className="font-mono font-black text-2xl">{stats.totalEvents} 筆</div></div>
                            <div className="bg-[#EFF0EA] text-[#161D15] p-4 rounded-3xl shadow-lg border border-[#D2CABF]"><span className="text-[10px] text-[#737C75] font-bold">總投資金額</span><div className="font-mono font-black text-xl">NT$ {stats.totalCost.toLocaleString()}</div></div>
                        </div>
                    </div>
                );
            }

            ReactDOM.createRoot(document.getElementById('root')).render(<App />);
        } catch (err) {
            document.getElementById('root').innerHTML = `<div style="padding:24px; color:#EFF0EA; text-align:center;"><h2>載入錯誤</h2><p>${err.message}</p><button onclick="localStorage.clear();window.location.reload();" style="background:#C5AB89;padding:8px 16px;border-radius:8px;font-weight:bold;margin-top:12px;">重設快取</button></div>`;
        }
    </script>
</body>
</html>
